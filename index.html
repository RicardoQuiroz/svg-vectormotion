        t.querySelector('.chev').textContent = col ? '▸' : '▾';
        saveUI({ ['sec_' + id]: col });
      });
    });
    $('#btnColL').onclick = e => {
      e.stopPropagation();
      document.body.classList.add('lcol-collapsed');
      document.body.style.gridTemplateColumns = '26px 1fr';
      saveUI({ lcol: true });
      requestAnimationFrame(updateView);
    };
    $('#btnColR').onclick = () => {
      document.body.classList.remove('lcol-collapsed');
      const u = uiState();
      const w = clamp(u.lpw || 230, 140, 500);
      document.body.style.gridTemplateColumns = `${w}px 1fr`;
      saveUI({ lcol: false });
      requestAnimationFrame(updateView);
    };
    function loadUI() {
      const u = uiState();
      for (const id of ['layersList', 'scenesList', 'routesList', 'guidesList']) {
        if (u['sec_' + id]) {
          document.getElementById(id).classList.add('sec-collapsed');
          const t = document.querySelector(`.panel-title[data-sec="${id}"] .chev`);
          if (t) t.textContent = '▸';
        }
      }
      const w = clamp(u.lpw || 230, 140, 500);
      $('#timeline').style.gridTemplateColumns = `${w}px 1fr`;
      if (u.lcol) {
        document.body.classList.add('lcol-collapsed');
        document.body.style.gridTemplateColumns = '26px 1fr';
      } else {
        document.body.style.gridTemplateColumns = `${w}px 1fr`;
      }
      if (u.tlh) { document.body.style.gridTemplateRows = `44px 1fr ${clamp(u.tlh, 140, 600)}px`; }
      if (u.pp_x != null && u.pp_y != null) {
        const pp = $('#propsPanel');
        pp.style.right = 'auto';
        pp.style.left = clamp(u.pp_x, 0, window.innerWidth - 80) + 'px';
        pp.style.top = clamp(u.pp_y, 44, window.innerHeight - 50) + 'px';
      }
      if (u.pp_w) { $('#propsPanel').style.width = clamp(u.pp_w, 180, 600) + 'px'; }
      if (u.pp_collapsed) { $('#propsPanel').classList.add('pp-collapsed'); $('#propsBtnCollapse').textContent = '\u2304'; }
      const a = localStorage.getItem('vm_auto');
      if (a && +a > 0) { $('#autoSel').value = a; $('#autoSel').onchange({ target: { value: a } }); }
    }

    /* ---- Handle de redimensionado del panel izquierdo ---- */
    (() => {
      const handle = $('#layerResizeHandle');
      let startX, startW;
      handle.addEventListener('pointerdown', e => {
        e.preventDefault();
        startW = $('#layersPanel').getBoundingClientRect().width;
        startX = e.clientX;
        handle.classList.add('dragging');
        handle.setPointerCapture(e.pointerId);
        document.body.style.userSelect = 'none';
      });
      handle.addEventListener('pointermove', e => {
        if (!handle.classList.contains('dragging')) return;
        const w = clamp(startW + (e.clientX - startX), 140, 500);
        document.body.style.gridTemplateColumns = `${w}px 1fr`;
        $('#timeline').style.gridTemplateColumns = `${w}px 1fr`;
        updateView();
      });
      handle.addEventListener('pointerup', e => {
        if (!handle.classList.contains('dragging')) return;
        handle.classList.remove('dragging');
        document.body.style.userSelect = '';
        const w = clamp(parseInt(document.body.style.gridTemplateColumns) || 230, 140, 500);
        saveUI({ lpw: w });
      });
    })();

    /* ---- Drag del panel flotante de propiedades ---- */
    (() => {
      const pp = $('#propsPanel');
      const bar = $('#propsDragBar');
      let ox = 0, oy = 0, sx = 0, sy = 0, dragging = false;
      bar.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;
        dragging = true;
        bar.setPointerCapture(e.pointerId);
        const r = pp.getBoundingClientRect();
        // Normalizar: siempre usar left/top (quitar right)
        pp.style.right = 'auto';
        pp.style.left = r.left + 'px';
        pp.style.top = r.top + 'px';
        ox = r.left; oy = r.top;
        sx = e.clientX; sy = e.clientY;
        document.body.style.userSelect = 'none';
      });
      bar.addEventListener('pointermove', e => {
        if (!dragging) return;
        const nx = clamp(ox + (e.clientX - sx), 0, window.innerWidth - 60);
        const ny = clamp(oy + (e.clientY - sy), 44, window.innerHeight - 50);
        pp.style.left = nx + 'px';
        pp.style.top = ny + 'px';
      });
      bar.addEventListener('pointerup', e => {
        if (!dragging) return;
        dragging = false;
        document.body.style.userSelect = '';
        saveUI({ pp_x: parseFloat(pp.style.left), pp_y: parseFloat(pp.style.top) });
      });
      // Observar resize manual del panel (handle nativo del navegador)
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          saveUI({ pp_w: pp.getBoundingClientRect().width });
        }).observe(pp);
      }
    })();

    /* ---- Boton colapsar panel de propiedades ---- */
    $('#propsBtnCollapse').onclick = () => {
      const pp = $('#propsPanel');
      const col = pp.classList.toggle('pp-collapsed');
      $('#propsBtnCollapse').textContent = col ? '\u2304' : '\u2303';
      saveUI({ pp_collapsed: col });
    };

    /* ---- Secciones colapsables dentro del panel de propiedades ---- */
    function bindPgroupToggles() {
      $('#propsBody').querySelectorAll('.pgroup').forEach(pg => {
        pg.addEventListener('click', e => {
          if (e.target.closest('.kbtn')) return;
          const id = pg.dataset.pgid;
          const body = document.getElementById('pg_' + id);
          if (!body) return;
          const col = body.classList.toggle('pg-collapsed');
          const chev = pg.querySelector('.pgroup-chev');
          if (chev) { chev.style.transform = col ? 'rotate(-90deg)' : ''; chev.textContent = col ? '\u25b8' : '\u25be'; }
          saveUI({ ['pg_' + id]: col });
        });
      });
      // Restaurar estado guardado
      const u = uiState();
      $('#propsBody').querySelectorAll('.pgroup').forEach(pg => {
        const id = pg.dataset.pgid;
        if (!id) return;
        const body = document.getElementById('pg_' + id);
        if (u['pg_' + id] && body) {
          body.classList.add('pg-collapsed');
          const chev = pg.querySelector('.pgroup-chev');
          if (chev) { chev.style.transform = 'rotate(-90deg)'; chev.textContent = '\u25b8'; }
        }
      });
    }

    /* ---- Menú de rutas con posición fija (evita clipping) ---- */
    $('#btnRouteAdd').onclick = e => {
      e.stopPropagation();
      const m = $('#routeMenu');
      if (m.classList.contains('open')) { m.classList.remove('open'); return; }
      const r = e.currentTarget.getBoundingClientRect();
      m.style.top = (r.bottom + 4) + 'px';
      m.style.left = r.left + 'px';
      m.style.right = 'auto';
      m.classList.add('open');
    };
    $('#routeMenu').addEventListener('click', e => {
      const k = e.target.dataset && e.target.dataset.rp; if (!k) return;
      $('#routeMenu').classList.remove('open');
      snapshot();
      if (k === 'fromsel') {
        const l = selLayer();
        if (!l || l.type !== 'path') { showHint('Selecciona una capa de trazado para convertirla en ruta'); return; }
        addRoute(l.attrs.d, l.name);
      } else {
        const r = addRoute(presetRoute(k), ROUTE_NAMES[k]);
        if (S.selSet.size) assignRoute(r);
      }
      refreshPanels(); applyFrame(S.T);
    });

    /* ---- Origen de reglas arrastrables (estilo Photoshop/Illustrator) ---- */
    (() => {
      const corner = $('#rulerCorner');
      const guideH = $('#rulerOriginH');
      const guideV = $('#rulerOriginV');
      let dragging = false;

      function showGuides(screenX, screenY) {
        // screenX, screenY son posiciones relativas al área (ya sin las 22px de regla)
        guideH.style.top = (screenY + 22) + 'px';
        guideV.style.left = (screenX + 22) + 'px';
        guideH.style.display = 'block';
        guideV.style.display = 'block';
      }
      function hideGuides() {
        guideH.style.display = 'none';
        guideV.style.display = 'none';
      }

      corner.addEventListener('pointerdown', e => {
        e.preventDefault();
        e.stopPropagation(); // evitar que el área robe el pointer capture
        dragging = true;
        corner.setPointerCapture(e.pointerId);
        corner.style.cursor = 'crosshair';
        // Mostrar guías desde la posición inicial (esquina)
        showGuides(0, 0);
      });

      corner.addEventListener('pointermove', e => {
        if (!dragging) return;
        const r = area.getBoundingClientRect();
        // Posición del cursor relativa al área del lienzo (sin las 22px de regla)
        const px = e.clientX - r.left - 22;
        const py = e.clientY - r.top - 22;
        showGuides(px, py);
        // Convertir posición de pantalla a coordenadas del lienzo: donde el cursor apunta
        // El origen nuevo = posición canvas del cursor = (px - S.panX + 22) / S.zoom
        // Pero queremos que la regla muestre 0 en ese punto, así que:
        // valor_en_regla = (coord_canvas) - rulerOX = 0  →  rulerOX = coord_canvas
        S.rulerOX = (px - S.panX + 22) / S.zoom;
        S.rulerOY = (py - S.panY + 22) / S.zoom;
        drawRulers();
        renderProps();
      });

      corner.addEventListener('pointerup', e => {
        if (!dragging) return;
        dragging = false;
        corner.style.cursor = '';
        hideGuides();
        drawRulers();
        renderProps();
      });

      corner.addEventListener('dblclick', () => {
        S.rulerOX = 0; S.rulerOY = 0;
        drawRulers();
        renderProps();
        showHint('Origen de reglas restablecido a (0, 0)');
      });
    })();

    /* ---- Guías de diseño sobre el lienzo (estilo PowerPoint) ---- */
    let activeGuideDragId = null;
    const guideTip = $('#guideTooltip');

    function showGuideTip(x, y, text, isDeleting) {
      if (!guideTip) return;
      guideTip.textContent = text;
      guideTip.style.left = x + 'px';
      guideTip.style.top = y + 'px';
      guideTip.style.display = 'block';
      if (isDeleting) guideTip.classList.add('deleting');
      else guideTip.classList.remove('deleting');
    }

    function hideGuideTip() {
      if (!guideTip) return;
      guideTip.style.display = 'none';
    }

    function renderGuides() {
      const container = $('#guidesContainer');
      if (!container) return;
      if (!doc.guides) doc.guides = [];

      const existingMap = new Map();
      container.querySelectorAll('.canvas-guide').forEach(el => {
        existingMap.set(el.dataset.id, el);
      });

      const currentIds = new Set(doc.guides.map(g => g.id));
      existingMap.forEach((el, id) => {
        if (!currentIds.has(id)) el.remove();
      });

      doc.guides.forEach(g => {
        let el = existingMap.get(g.id);
        if (!el) {
          el = document.createElement('div');
          el.className = 'canvas-guide canvas-guide-' + g.type;
          el.dataset.id = g.id;
          const line = document.createElement('div');
          line.className = 'guide-line';
          el.appendChild(line);
          bindGuideDrag(el, g);
          container.appendChild(el);
        }

        if (activeGuideDragId === g.id) return;

        if (g.hidden || S.guidesHidden) {
          el.style.display = 'none';
          return;
        } else {
          el.style.display = 'flex';
        }

        const isLocked = !!(g.locked || S.guidesLocked);
        const canDrag = !isLocked && S.tool === 'select';
        el.style.pointerEvents = canDrag ? 'auto' : 'none';
        el.classList.toggle('locked', isLocked);

        if (g.type === 'h') {
          const screenY = S.panY + g.pos * S.zoom;
          el.style.top = screenY + 'px';
          el.style.left = '0';
          el.style.right = '0';
        } else {
          const screenX = S.panX + g.pos * S.zoom;
          el.style.left = screenX + 'px';
          el.style.top = '0';
          el.style.bottom = '0';
        }
      });
    }

    function bindGuideDrag(el, g) {
      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        if (g.locked || S.guidesLocked || S.tool !== 'select') return;
        e.preventDefault();
        e.stopPropagation();
        activeGuideDragId = g.id;
        el.setPointerCapture(e.pointerId);
        el.classList.add('dragging');

        let newCanvasPos = g.pos;

        function onMove(ev) {
          const r = area.getBoundingClientRect();
          const pt = svgPt(ev);

          if (g.type === 'h') {
            const screenY = ev.clientY - r.top;
            newCanvasPos = Math.round(pt.y);
            el.style.top = screenY + 'px';

            const shouldDelete = (screenY <= 22);
            if (shouldDelete) {
              el.classList.add('deleting');
              showGuideTip(ev.clientX - r.left, screenY, '🗑️ Soltar para eliminar', true);
            } else {
              el.classList.remove('deleting');
              showGuideTip(ev.clientX - r.left, screenY, `Y: ${fmt(newCanvasPos - S.rulerOY)} px`, false);
            }
          } else {
            const screenX = ev.clientX - r.left;
            newCanvasPos = Math.round(pt.x);
            el.style.left = screenX + 'px';

            const shouldDelete = (screenX <= 22);
            if (shouldDelete) {
              el.classList.add('deleting');
              showGuideTip(screenX, ev.clientY - r.top, '🗑️ Soltar para eliminar', true);
            } else {
              el.classList.remove('deleting');
              showGuideTip(screenX, ev.clientY - r.top, `X: ${fmt(newCanvasPos - S.rulerOX)} px`, false);
            }
          }
        }

        function onUp(ev) {
          try { el.releasePointerCapture(ev.pointerId); } catch (err) { }
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          el.removeEventListener('pointercancel', onUp);
          el.classList.remove('dragging', 'deleting');
          hideGuideTip();
          activeGuideDragId = null;

          const r = area.getBoundingClientRect();
          const isBackInRuler = (g.type === 'h') ? (ev.clientY - r.top <= 22) : (ev.clientX - r.left <= 22);

          if (isBackInRuler) {
            snapshot();
            doc.guides = doc.guides.filter(item => item.id !== g.id);
            renderGuides();
            renderGuidesPanel();
            showHint('Guía eliminada');
          } else {
            if (g.pos !== newCanvasPos) {
              snapshot();
              g.pos = newCanvasPos;
              renderGuides();
              renderGuidesPanel();
              const axis = (g.type === 'h') ? 'Y' : 'X';
              const origin = (g.type === 'h') ? S.rulerOY : S.rulerOX;
              showHint(`Guía ${axis}: ${fmt(newCanvasPos - origin)} px`);
            } else {
              renderGuides();
            }
          }
        }

        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onUp);
        onMove(e);
      });

      // Atajos de conveniencia: doble clic o clic derecho para eliminar la guía
      el.addEventListener('dblclick', e => {
        if (g.locked || S.guidesLocked || S.tool !== 'select') return;
        e.preventDefault();
        e.stopPropagation();
        snapshot();
        doc.guides = doc.guides.filter(item => item.id !== g.id);
        renderGuides();
        renderGuidesPanel();
        showHint('Guía eliminada');
      });

      el.addEventListener('contextmenu', e => {
        if (g.locked || S.guidesLocked || S.tool !== 'select') return;
        e.preventDefault();
        e.stopPropagation();
        snapshot();
        doc.guides = doc.guides.filter(item => item.id !== g.id);
        renderGuides();
        renderGuidesPanel();
        showHint('Guía eliminada');
      });
    }

    // Creación de guías arrastrando desde la regla horizontal
    const rulerXEl = $('#rulerX');
    if (rulerXEl) {
      rulerXEl.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        rulerXEl.setPointerCapture(e.pointerId);

        const guideId = 'g_' + uid();
        const dragEl = document.createElement('div');
        dragEl.className = 'canvas-guide canvas-guide-h dragging';
        const line = document.createElement('div');
        line.className = 'guide-line';
        dragEl.appendChild(line);
        dragEl.style.left = '0';
        dragEl.style.right = '0';
        area.appendChild(dragEl);

        let currentCanvasY = 0;

        function onMove(ev) {
          const r = area.getBoundingClientRect();
          const screenY = ev.clientY - r.top;
          dragEl.style.top = screenY + 'px';

          const pt = svgPt(ev);
          currentCanvasY = Math.round(pt.y);
          const rulerVal = fmt(currentCanvasY - S.rulerOY);

          const isDeleting = (screenY <= 22);
          if (isDeleting) {
            dragEl.classList.add('deleting');
            showGuideTip(ev.clientX - r.left, screenY, '🗑️ Soltar para cancelar', true);
          } else {
            dragEl.classList.remove('deleting');
            showGuideTip(ev.clientX - r.left, screenY, `Y: ${rulerVal} px`, false);
          }
        }

        function onUp(ev) {
          try { rulerXEl.releasePointerCapture(ev.pointerId); } catch (err) { }
          rulerXEl.removeEventListener('pointermove', onMove);
          rulerXEl.removeEventListener('pointerup', onUp);
          rulerXEl.removeEventListener('pointercancel', onUp);
          dragEl.remove();
          hideGuideTip();

          const r = area.getBoundingClientRect();
          const screenY = ev.clientY - r.top;
          if (screenY > 22) {
            snapshot();
            if (!doc.guides) doc.guides = [];
            doc.guides.push({ id: guideId, type: 'h', pos: currentCanvasY, locked: false, hidden: false });
            renderGuides();
            renderGuidesPanel();
            showHint(`Guía horizontal colocada en Y: ${fmt(currentCanvasY - S.rulerOY)} px`);
          }
        }

        rulerXEl.addEventListener('pointermove', onMove);
        rulerXEl.addEventListener('pointerup', onUp);
        rulerXEl.addEventListener('pointercancel', onUp);
        onMove(e);
      });
    }

    // Creación de guías arrastrando desde la regla vertical
    const rulerYEl = $('#rulerY');
    if (rulerYEl) {
      rulerYEl.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        rulerYEl.setPointerCapture(e.pointerId);

        const guideId = 'g_' + uid();
        const dragEl = document.createElement('div');
        dragEl.className = 'canvas-guide canvas-guide-v dragging';
        const line = document.createElement('div');
        line.className = 'guide-line';
        dragEl.appendChild(line);
        dragEl.style.top = '0';
        dragEl.style.bottom = '0';
        area.appendChild(dragEl);

        let currentCanvasX = 0;

        function onMove(ev) {
          const r = area.getBoundingClientRect();
          const screenX = ev.clientX - r.left;
          dragEl.style.left = screenX + 'px';

          const pt = svgPt(ev);
          currentCanvasX = Math.round(pt.x);
          const rulerVal = fmt(currentCanvasX - S.rulerOX);

          const isDeleting = (screenX <= 22);
          if (isDeleting) {
            dragEl.classList.add('deleting');
            showGuideTip(screenX, ev.clientY - r.top, '🗑️ Soltar para cancelar', true);
          } else {
            dragEl.classList.remove('deleting');
            showGuideTip(screenX, ev.clientY - r.top, `X: ${rulerVal} px`, false);
          }
        }

        function onUp(ev) {
          try { rulerYEl.releasePointerCapture(ev.pointerId); } catch (err) { }
          rulerYEl.removeEventListener('pointermove', onMove);
          rulerYEl.removeEventListener('pointerup', onUp);
          rulerYEl.removeEventListener('pointercancel', onUp);
          dragEl.remove();
          hideGuideTip();

          const r = area.getBoundingClientRect();
          const screenX = ev.clientX - r.left;
          if (screenX > 22) {
            snapshot();
            if (!doc.guides) doc.guides = [];
            doc.guides.push({ id: guideId, type: 'v', pos: currentCanvasX, locked: false, hidden: false });
            renderGuides();
            renderGuidesPanel();
            showHint(`Guía vertical colocada en X: ${fmt(currentCanvasX - S.rulerOX)} px`);
          }
        }

        rulerYEl.addEventListener('pointermove', onMove);
        rulerYEl.addEventListener('pointerup', onUp);
        rulerYEl.addEventListener('pointercancel', onUp);
        onMove(e);
      });
    }

    /* ---------------- Panel de Guiadores ---------------- */
    function renderGuidesPanel() {
      const el = $('#guidesList'); if (!el) return;
      el.innerHTML = '';
      if (!doc.guides) doc.guides = [];

      const btnLockAll = $('#btnGuideLockAll');
      if (btnLockAll) {
        const anyLocked = doc.guides.some(g => g.locked) || S.guidesLocked;
        const allLocked = doc.guides.length > 0 && doc.guides.every(g => g.locked);
        btnLockAll.textContent = (allLocked || S.guidesLocked) ? '🔒' : '🔓';
        btnLockAll.title = (allLocked || S.guidesLocked) ? 'Desbloquear todos los guiadores' : 'Bloquear todos los guiadores con candado';
        btnLockAll.classList.toggle('active', !!(allLocked || S.guidesLocked));
      }
      const btnVisAll = $('#btnGuideVisAll');
      if (btnVisAll) {
        const allHidden = S.guidesHidden || (doc.guides.length > 0 && doc.guides.every(g => g.hidden));
        btnVisAll.textContent = allHidden ? '🚫' : '👁';
        btnVisAll.title = allHidden ? 'Mostrar todos los guiadores' : 'Ocultar todos los guiadores';
        btnVisAll.classList.toggle('active', !!allHidden);
      }

      if (!doc.guides.length) {
        el.innerHTML = '<div class="empty-note" style="padding:8px 10px">Sin guiadores. Arrastra desde las reglas o pulsa ＋H / ＋V para añadir.</div>';
        return;
      }

      doc.guides.forEach((g, i) => {
        const item = document.createElement('div');
        item.className = 'guide-item' + (g.locked ? ' is-locked' : '') + (g.hidden ? ' is-hidden' : '');
        item.dataset.id = g.id;

        const isH = g.type === 'h';
        const axisLabel = isH ? 'Y' : 'X';
        const originOffset = isH ? S.rulerOY : S.rulerOX;
        const rulerVal = fmt(g.pos - originOffset);

        item.innerHTML = `
          <span class="guide-badge ${isH ? 'badge-h' : 'badge-v'}" title="Guiador ${isH ? 'Horizontal' : 'Vertical'}">${g.type.toUpperCase()}</span>
          <div class="gpos-wrap">
            <span style="color:var(--txt2);font-size:11px;font-weight:600">${axisLabel}:</span>
            <input type="number" step="1" class="guide-pos-input" value="${rulerVal}" title="Posición en px (relativa a la regla)">
            <span style="color:var(--txt2);font-size:10px">px</span>
          </div>
          <button class="mini${g.locked ? ' active' : ''}" data-ga="lock" title="${g.locked ? 'Desbloquear guiador' : 'Bloquear guiador con candado'}">${g.locked ? '🔒' : '🔓'}</button>
          <button class="mini${g.hidden ? ' active' : ''}" data-ga="vis" title="${g.hidden ? 'Mostrar guiador' : 'Ocultar guiador'}">${g.hidden ? '🚫' : '👁'}</button>
          <button class="mini" data-ga="del" title="Eliminar este guiador">🗑</button>
        `;

        const inp = item.querySelector('.guide-pos-input');
        inp.onchange = () => {
          const val = parseFloat(inp.value) || 0;
          snapshot();
          g.pos = Math.round(val + originOffset);
          renderGuides();
          renderGuidesPanel();
        };

        item.onclick = e => {
          const a = e.target.dataset.ga;
          if (a === 'lock') {
            snapshot();
            g.locked = !g.locked;
            renderGuides();
            renderGuidesPanel();
            showHint(g.locked ? 'Guiador bloqueado 🔒' : 'Guiador desbloqueado 🔓');
            return;
          }
          if (a === 'vis') {
            snapshot();

    /* Ramer–Douglas–Peucker: conserva solo los nodos pivote donde la curva
       cambia significativamente de dirección. epsilon en unidades del documento. */
    function rdp(pts, eps, lo, hi) {
      if (hi - lo < 2) return;
      const ax = pts[lo][0], ay = pts[lo][1];
      const bx = pts[hi][0], by = pts[hi][1];
      const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1e-9;
      let maxD = 0, maxI = lo;
      for (let i = lo + 1; i < hi; i++) {
        const px = pts[i][0] - ax, py = pts[i][1] - ay;
        const d = Math.abs(px * dy - py * dx) / len;
        if (d > maxD) { maxD = d; maxI = i; }
      }
      if (maxD > eps) {
        pts[maxI]._keep = true;
        rdp(pts, eps, lo, maxI);
        rdp(pts, eps, maxI, hi);
      }
    }
    function simplifyPts(pts, eps) {
      if (pts.length <= 2) return pts;

      const pre = [pts[0]];
      for (const p of pts) { const q = pre[pre.length - 1]; if (Math.hypot(p[0]-q[0],p[1]-q[1]) > eps * 0.25) pre.push(p); }
      if (pre.length <= 2) return pre;
      // RDP con epsilon adaptativo
      pre[0]._keep = true; pre[pre.length - 1]._keep = true;
      rdp(pre, eps, 0, pre.length - 1);
      return pre.filter(p => p._keep);

      let d = `M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
        d += ` C${fmt(p1[0] + (p2[0] - p0[0]) / 6)} ${fmt(p1[1] + (p2[1] - p0[1]) / 6)} ${fmt(p2[0] - (p3[0] - p1[0]) / 6)} ${fmt(p2[1] - (p3[1] - p1[1]) / 6)} ${fmt(p2[0])} ${fmt(p2[1])}`;
      }

    }

        ref = { x: Math.min(...bs.map(b => b.x)), y: Math.min(...bs.map(b => b.y)) };
        ref.w = Math.max(...bs.map(b => b.x + b.w)) - ref.x;

          } else {
            S.nodeEdit = null;
          }
        }
      }
      S.selKf = null;
      paintLayerSelection();
      renderProps(); renderTimeline();
      drawOverlay();
    }

    /* ---------------- Panel de propiedades y Tipografía ---------------- */
    const SYSTEM_FONTS = [
      'sans-serif', 'serif', 'monospace',
      'Arial', 'Helvetica', 'Verdana', 'Tahoma', 'Trebuchet MS',
      'Segoe UI', 'Georgia', 'Times New Roman', 'Garamond', 'Palatino',
      'Courier New', 'Lucida Console', 'Impact', 'Comic Sans MS', 'Brush Script MT'
    ];
    const POPULAR_GOOGLE_FONTS = [
      // Sans-Serif populares
      'Roboto', 'Open Sans', 'Montserrat', 'Poppins', 'Lato', 'Inter',
      'Oswald', 'Raleway', 'Nunito', 'Rubik', 'Fira Sans', 'Work Sans',
      // Serif elegantes
      'Playfair Display', 'Merriweather', 'Lora', 'PT Serif', 'Cinzel', 'Cormorant Garamond',
      // Titulares / Display con personalidad
      'Bebas Neue', 'Anton', 'Bangers', 'Orbitron', 'Righteous', 'Press Start 2P', 'Abril Fatface',
      // Cursivas / Manuscritas
      'Pacifico', 'Dancing Script', 'Lobster', 'Caveat', 'Satisfy', 'Kalam', 'Permanent Marker', 'Sacramento',
      // Monospace
      'Fira Code', 'Source Code Pro', 'Space Mono'
    ];
    const loadedGoogleFonts = new Set();
    const customLoadedGoogleFonts = [];
    const opentypeCache = {};

    function loadGoogleFont(fontName) {
      if (!fontName) return;
      const clean = fontName.trim();
      if (!clean || SYSTEM_FONTS.includes(clean)) return;
      if (!loadedGoogleFonts.has(clean)) {
        const id = 'gfont-' + clean.toLowerCase().replace(/[^a-z0-9]/g, '-');
        if (!document.getElementById(id)) {
          const link = document.createElement('link');
          link.id = id;
          link.rel = 'stylesheet';
          link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(clean)}:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap`;
          document.head.appendChild(link);
        }
        loadedGoogleFonts.add(clean);
      }
      if (!POPULAR_GOOGLE_FONTS.includes(clean) && !customLoadedGoogleFonts.includes(clean)) {
        customLoadedGoogleFonts.push(clean);
      }
      preloadOpentypeFont(clean);
    }

    async function fetchOpentypeFont(fontName) {
      if (opentypeCache[fontName]) return opentypeCache[fontName];
      if (typeof opentype === 'undefined') return null;
      const slug = fontName.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const url = `https://cdn.jsdelivr.net/npm/@fontsource/${slug}@5.0.8/files/${slug}-latin-400-normal.woff`;
      try {
        const res = await fetch(url);
        if (res.ok) {
          const buf = await res.arrayBuffer();
          const font = opentype.parse(buf);
          opentypeCache[fontName] = font;
          return font;
        }
      } catch (e) { }
      return null;
    }

    function preloadOpentypeFont(fontName) {
      if (!fontName || opentypeCache[fontName]) return;
      fetchOpentypeFont(fontName).catch(() => {});
    }

    // Pre-cargar Roboto como fuente vectorial estándar
    setTimeout(() => { preloadOpentypeFont('Roboto'); }, 500);

    /* Conversión de texto a trazado SVG (OpenType con curvas Bézier + Canvas Marching Squares fallback) */
    async function textToPathD(a) {
      const text = (a.text != null && a.text !== '') ? String(a.text) : 'Texto';
      const fs = +a.fs || 28;
      const ff = a.ff || 'sans-serif';
      const fw = a.fw || 'normal';
      const fst = a.fst ? 'italic' : 'normal';
      const anchor = a.anchor || 'start';
      const x = +a.x || 0;
      const y = +a.y || 0;
      const ls = +a.ls || 0;

      // 1. Intentar con opentype.js para curvas Bézier exactas
      if (typeof opentype !== 'undefined') {
        let font = await fetchOpentypeFont(ff);
        if (!font && ff.toLowerCase() !== 'roboto' && !SYSTEM_FONTS.includes(ff)) {
          font = await fetchOpentypeFont('Roboto');
        }
        if (font) {
          const lines = text.split('\n');
          const lineHeight = fs * 1.25;
          const dParts = [];
          lines.forEach((line, idx) => {
            let lx = x;
            const ly = y + idx * lineHeight;
            const width = font.getAdvanceWidth(line, fs, { letterSpacing: ls });
            if (anchor === 'middle') lx -= width / 2;
            else if (anchor === 'end') lx -= width;

            const path = font.getPath(line, lx, ly, fs, { letterSpacing: ls });
            const pd = path.toPathData(2);
            if (pd) dParts.push(pd);
          });
          const fullD = dParts.join(' ').trim();
          if (fullD && fullD.length > 5) return fullD;
        }
      }

      // 2. Fallback de trazado por contorno Canvas (para fuentes locales de sistema y modo offline)
      return canvasTextToPathD(text, x, y, fs, ff, fw, fst, anchor, ls);
    }

    function canvasTextToPathD(text, x, y, fs, ff, fw, fst, anchor, ls) {
      const lines = String(text || '').split('\n');
      const scale = 2;
      const scaledFs = fs * scale;
      const fontSpec = `${fst === 'italic' ? 'italic ' : ''}${fw === 'bold' || +fw >= 600 ? 'bold ' : (fw && fw !== 'normal' ? fw + ' ' : '')}${scaledFs}px "${ff}", sans-serif`;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.font = fontSpec;

      const lineHeight = scaledFs * 1.25;
      let maxW = 50;
      const lineMetrics = lines.map(line => {
        const w = ctx.measureText(line).width + (ls ? (line.length - 1) * ls * scale : 0);
        if (w > maxW) maxW = w;
        return w;
      });

      const pad = Math.ceil(scaledFs * 0.8);
      const W = Math.ceil(maxW + pad * 2);
      const H = Math.ceil(lines.length * lineHeight + pad * 2);
      canvas.width = Math.max(10, Math.min(4000, W));
      canvas.height = Math.max(10, Math.min(4000, H));

      ctx.font = fontSpec;
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'alphabetic';

      const baseLineY = pad + scaledFs * 0.85;
      lines.forEach((line, i) => {
        let lx = pad;
        if (anchor === 'middle') lx = pad + (maxW - lineMetrics[i]) / 2;
        else if (anchor === 'end') lx = pad + (maxW - lineMetrics[i]);
        const ly = baseLineY + i * lineHeight;
        ctx.fillText(line, lx, ly);
      });

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const cW = canvas.width, cH = canvas.height;

      const val = (px, py) => {
        if (px < 0 || px >= cW || py < 0 || py >= cH) return 0;
        return data[(py * cW + px) * 4 + 3] > 120 ? 1 : 0;
      };

      const segments = [];
      for (let py = 0; py < cH - 1; py++) {
        for (let px = 0; px < cW - 1; px++) {
          const tl = val(px, py), tr = val(px + 1, py), br = val(px + 1, py + 1), bl = val(px, py + 1);
          const state = (tl << 3) | (tr << 2) | (br << 1) | bl;
          if (state === 0 || state === 15) continue;
          const top = [px + 0.5, py], right = [px + 1, py + 0.5], bottom = [px + 0.5, py + 1], left = [px, py + 0.5];
          switch (state) {
            case 1: segments.push([left, bottom]); break;
            case 2: segments.push([bottom, right]); break;
            case 3: segments.push([left, right]); break;
            case 4: segments.push([top, right]); break;
            case 5: segments.push([left, top]); segments.push([bottom, right]); break;
            case 6: segments.push([top, bottom]); break;
            case 7: segments.push([left, top]); break;
            case 8: segments.push([top, left]); break;
            case 9: segments.push([top, bottom]); break;
            case 10: segments.push([top, right]); segments.push([left, bottom]); break;
            case 11: segments.push([top, right]); break;
            case 12: segments.push([right, left]); break;
            case 13: segments.push([bottom, right]); break;
            case 14: segments.push([left, bottom]); break;
          }
        }
      }

      const segs = segments.map(s => ({ p1: s[0], p2: s[1], used: false }));
      const map = new Map();
      const key = p => `${Math.round(p[0] * 2)},${Math.round(p[1] * 2)}`;
      segs.forEach((s, idx) => {
        const k1 = key(s.p1), k2 = key(s.p2);
        if (!map.has(k1)) map.set(k1, []);
        map.get(k1).push({ idx, end: 1 });
        if (!map.has(k2)) map.set(k2, []);
        map.get(k2).push({ idx, end: 2 });
      });

      const rings = [];
      for (let i = 0; i < segs.length; i++) {
        if (segs[i].used) continue;
        segs[i].used = true;
        const ring = [segs[i].p1, segs[i].p2];
        let cur = segs[i].p2;
        while (true) {
          const candidates = map.get(key(cur)) || [];
          let foundNext = false;
          for (const c of candidates) {
            if (!segs[c.idx].used) {
              segs[c.idx].used = true;
              const nextPt = (c.end === 1) ? segs[c.idx].p2 : segs[c.idx].p1;
              ring.push(nextPt);
              cur = nextPt;
              foundNext = true;
              break;
            }
          }
          if (!foundNext) break;
          if (Math.hypot(cur[0] - ring[0][0], cur[1] - ring[0][1]) < 0.8) break;
        }
        if (ring.length >= 4) rings.push(ring);
      }

      function rdp(pts, eps) {
        if (pts.length <= 2) return pts;
        let dmax = 0, idx = 0;
        const end = pts.length - 1;
        for (let i = 1; i < end; i++) {
          const dx = pts[end][0] - pts[0][0], dy = pts[end][1] - pts[0][1];
          const mag = Math.hypot(dx, dy);
          const d = mag < 1e-5 ? Math.hypot(pts[i][0] - pts[0][0], pts[i][1] - pts[0][1]) :
            Math.abs(dy * pts[i][0] - dx * pts[i][1] + pts[end][0] * pts[0][1] - pts[end][1] * pts[0][0]) / mag;
          if (d > dmax) { idx = i; dmax = d; }
        }
        if (dmax > eps) {
          return rdp(pts.slice(0, idx + 1), eps).slice(0, -1).concat(rdp(pts.slice(idx), eps));
        }
        return [pts[0], pts[end]];
      }

      let anchorOffsetX = 0;
      if (anchor === 'middle') anchorOffsetX = -maxW / (2 * scale);
      else if (anchor === 'end') anchorOffsetX = -maxW / scale;

      let d = '';
      for (const ring of rings) {
        const simp = rdp(ring, 0.8);
        if (simp.length < 3) continue;
        const startX = +(x + anchorOffsetX + (simp[0][0] - pad) / scale).toFixed(2);
        const startY = +(y + (simp[0][1] - baseLineY) / scale).toFixed(2);
        d += `M${startX} ${startY}`;
        for (let i = 1; i < simp.length; i++) {
          const px = +(x + anchorOffsetX + (simp[i][0] - pad) / scale).toFixed(2);
          const py = +(y + (simp[i][1] - baseLineY) / scale).toFixed(2);
          d += ` L${px} ${py}`;
        }
        d += ' Z ';
      }
      return d.trim();
    }

    function getUsedGoogleFonts() {
      const gfonts = new Set();
      for (const l of doc.layers) {
        if (l.type === 'text' && l.attrs && l.attrs.ff) {
          const ff = l.attrs.ff;
          if (!SYSTEM_FONTS.includes(ff)) gfonts.add(ff);
        }
      }
      return [...gfonts];
    }

    function googleFontsExportDefs() {
      const fonts = getUsedGoogleFonts();
      if (!fonts.length) return '';
      return `<defs><style>\n${fonts.map(f => `@import url('https://fonts.googleapis.com/css2?family=${encodeURIComponent(f)}:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&display=swap');`).join('\n')}\n</style></defs>`;
    }

    // Filtrar propiedades aplicables en el timeline según el tipo de capa
    function applicableAnimProps(layer) {
      const la = anims[layer.id] || {};
      return ANIM_PROPS.filter(([prop]) => {
        if (la[prop] && la[prop].length) return true;
        if (layer.type === 'text') {
          // El texto no tiene animación de trazo 'draw' ni morphing 'geom' (hasta convertirse a trazado)
          if (prop === 'draw' || prop === 'geom') return false;
        } else if (layer.type === 'image') {
          if (prop === 'fill' || prop === 'draw' || prop === 'geom') return false;
        } else if (layer.type === 'line') {
          if (prop === 'fill' || prop === 'geom') return false;
        } else if (layer.type === 'raw') {
          if (prop === 'draw' || prop === 'geom') return false;
        }
        return true;
      });
    }

    const FONTS = [...SYSTEM_FONTS, ...POPULAR_GOOGLE_FONTS];
    function kBtn(prop) {
      const l = selLayer(); if (!l) return '';
      const ks = keysOf(l.id, prop);
      const onkey = ks && ks.some(k => Math.abs(k.t - S.T) < 1e-4);
      const cls = 'kbtn' + (onkey ? ' onkey' : (ks ? ' animated' : ''));
      return `<button class="${cls}" data-kprop="${prop}" title="Añadir/quitar keyframe en ${PROP_LABEL[prop]} (t=${S.T.toFixed(2)}s)">◆</button>`;
    }
    /* ---- Conversión coordenadas SVG ↔ coordenadas de regla ---- */
    // axis: 'x' resta rulerOX, 'y' resta rulerOY
    function toRuler(v, axis) { return axis === 'x' ? v - S.rulerOX : v - S.rulerOY; }
    function fromRuler(v, axis) { return axis === 'x' ? v + S.rulerOX : v + S.rulerOY; }
    // Solo los attrs de geometría son coordenadas absolutas; tx/ty son offsets relativos de transform
    const RULER_PROPS = {};  // tx, ty son desplazamientos relativos → no se convierten al origen de regla
    const RULER_ATTRS = { x: 'x', y: 'y', cx: 'x', cy: 'y', x1: 'x', y1: 'y', x2: 'x', y2: 'y' };

    function numRow(label, prop, val, step) {
      const axis = RULER_PROPS[prop];
      const display = axis ? toRuler(val, axis) : val;
      return `<div class="prow"><label>${label}</label>
    <input type="number" step="${step || 1}" data-prop="${prop}"${axis ? ` data-ruler-axis="${axis}"` : ''} value="${+(+display).toFixed(2)}">${kBtn(prop)}</div>`;
    }
    function attrRow(label, attr, val, step) {
      const axis = RULER_ATTRS[attr];
      const display = axis ? toRuler(val, axis) : val;
      return `<div class="prow"><label>${label}</label>
    <input type="number" step="${step || 1}" data-attr="${attr}"${axis ? ` data-ruler-axis="${axis}"` : ''} value="${+(+display).toFixed(2)}"></div>`;
    }
    // Fila de solo lectura: posición efectiva en lienzo (geometría + transform), relativa al origen de reglas
    function effPosRow(label, svgVal, axis, tx, ty) {
      const offset = axis === 'x' ? tx : ty;
      const effective = svgVal + offset;
      const display = toRuler(effective, axis);
      return `<div class="prow" title="Posición real en lienzo = geometría + desplazamiento de transformación" style="opacity:.75">
    <label style="color:var(--txt2);font-size:10px">${label} efectivo</label>
    <input type="number" value="${+(+display).toFixed(2)}" readonly style="color:var(--accent2);cursor:default;opacity:.85"></div>`;
    }
    function renderProps() {
      const body = $('#propsBody'); const l = selLayer();
      if (!l) { body.innerHTML = '<div class="empty-note">Selecciona un elemento para editar sus propiedades.<br><br>Atajos: V selección · A nodos · R rectángulo · E elipse · L línea · G polígono · P pluma · T texto · H mano · Espacio reproducir · Supr eliminar · Shift+clic selección múltiple.</div>'; bindPgroupToggles(); return; }
      const p = effProps(l, S.T), a = l.attrs;
      const multi = S.selSet.size > 1 ? ` <span style="color:var(--accent2)">(+${S.selSet.size - 1} más)</span>` : '';
      const pg = (id, label, extra = '') => `<div class="pgroup" data-pgid="${id}"><span class="pgroup-chev">&#x25be;</span><span class="pgroup-title">${label}${extra ? '&nbsp;' + extra : ''}</span></div><div class="pgroup-body" id="pg_${id}">`;
      const pgEnd = `</div>`;

      let h = `<div class="prow"><label>Nombre</label><input type="text" id="propName" value="${esc(l.name)}">${multi}</div>`;
      h += pg('xform', 'Transformación');
      h += numRow('Pos. X', 'tx', p.tx) + numRow('Pos. Y', 'ty', p.ty) + numRow('Rotación', 'rot', p.rot)
        + numRow('Escala X', 'sx', p.sx, 0.05) + numRow('Escala Y', 'sy', p.sy, 0.05)
        + numRow('Sesgo X', 'skx', p.skx) + numRow('Sesgo Y', 'sky', p.sky)
        + numRow('Opacidad', 'opacity', p.opacity, 0.05);
      h += `<div class="prow"><label>Rápido</label>
    <button class="mini" data-a="fliph" title="Voltear horizontal">⇋</button>
    <button class="mini" data-a="flipv" title="Voltear vertical">⇵</button>
    <button class="mini" data-a="rotl" title="Girar −90°">⟲</button>
    <button class="mini" data-a="rotr" title="Girar +90°">⟳</button></div>`;
      const [ocx, ocy] = ctr(l);
      h += `<div class="prow"><label>Origen</label>
    <input type="number" data-org="x" value="${+toRuler(ocx,'x').toFixed(1)}" title="Origen X (rotación/escala) — relativo al origen de reglas">
    <input type="number" data-org="y" value="${+toRuler(ocy,'y').toFixed(1)}" title="Origen Y — relativo al origen de reglas">
    <button class="mini" data-a="centerorg" title="Centrar origen">⌖</button></div>`;

      h += pgEnd;

      h += pg('appear', 'Apariencia');
      if (l.type !== 'line' && l.type !== 'raw' && l.type !== 'image')
        h += `<div class="prow"><label>Relleno</label><input type="color" data-cprop="fill" value="${hexRgb(p.fill) ? rgbHex(hexRgb(p.fill)) : '#7c5cff'}">
        <button class="mini" data-a="nofill" title="Sin relleno">∅</button>${kBtn('fill')}</div>`;
      if (l.type !== 'raw' && l.type !== 'image') {
        const hasStroke = !!(a.stroke && a.stroke !== 'none');
        h += `<div class="prow"><label>Trazo</label><input type="color" data-cattr="stroke" value="${hexRgb(a.stroke || '') ? rgbHex(hexRgb(a.stroke)) : '#000000'}">
        <button class="mini${!hasStroke ? ' active' : ''}" data-a="nostroke" title="Sin trazo">∅</button>${l.type === 'line' ? kBtn('fill') : ''}</div>`;
        h += attrRow('Grosor', 'sw', a.sw !== undefined ? a.sw : (hasStroke ? 1 : 0), 0.5);
        if (l.type !== 'text') h += numRow('Dibujo %', 'draw', p.draw, 1);
      }
      h += pgEnd;

      if (l.type === 'text') {
        h += pg('typography', 'Texto y Tipografía');
        const curFont = a.ff || 'sans-serif';
        const isCustom = !POPULAR_GOOGLE_FONTS.includes(curFont) && !SYSTEM_FONTS.includes(curFont) && !customLoadedGoogleFonts.includes(curFont);
        const allCustom = [...customLoadedGoogleFonts, ...(isCustom ? [curFont] : [])];

          + attrRow('Tamaño', 'fs', a.fs || 28)

              <optgroup label="Fuentes de Google">
                ${POPULAR_GOOGLE_FONTS.map(f => `<option value="${f}"${curFont === f ? ' selected' : ''}>${f}</option>`).join('')}
                ${allCustom.map(f => `<option value="${f}"${curFont === f ? ' selected' : ''}>${f} ★</option>`).join('')}
              </optgroup>
              <optgroup label="Fuentes del Sistema">
                ${SYSTEM_FONTS.map(f => `<option value="${f}"${curFont === f ? ' selected' : ''}>${f}</option>`).join('')}
              </optgroup>

          + `<div class="prow" style="margin-top:2px;gap:4px">

              <button class="mini" id="btnAddGFont" title="Cargar y aplicar fuente de Google Fonts" style="padding:2px 8px;white-space:nowrap">＋ Cargar</button>
            </div>`
          + `<div class="prow"><label>Estilo</label>
             <button class="mini${(a.fw === 'bold' || +a.fw >= 600) ? ' active' : ''}" data-a="bold" title="Negrita" style="font-weight:bold">B</button>

          + `<div class="prow"><label>Peso</label><select data-sattr="fw">${['100', '200', '300', 'normal', '500', '600', 'bold', '800', '900'].map(w => `<option value="${w}"${(a.fw || 'normal') === w ? ' selected' : ''}>${w}</option>`).join('')}</select></div>`
          + attrRow('Espaciado', 'ls', a.ls || 0, 0.5)
          + `<div class="prow"><label>Anclaje</label><select data-sattr="anchor">

          + `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">

        h += pgEnd;
      } else {

        if (keysOf(l.id, 'geom')) h += `<div class="empty-note" style="padding:2px 0 6px">Geometría animada (morphing): cada edición de forma clava keyframe en t=${S.T.toFixed(2)}s.</div>`;

            + effPosRow('Cx', a.cx, 'x', p.tx, p.ty) + effPosRow('Cy', a.cy, 'y', p.tx, p.ty); break;
          case 'line': h += attrRow('X1', 'x1', a.x1) + attrRow('Y1', 'y1', a.y1) + attrRow('X2', 'x2', a.x2) + attrRow('Y2', 'y2', a.y2)
            + effPosRow('X1', a.x1, 'x', p.tx, p.ty) + effPosRow('Y1', a.y1, 'y', p.tx, p.ty)
            + effPosRow('X2', a.x2, 'x', p.tx, p.ty) + effPosRow('Y2', a.y2, 'y', p.tx, p.ty); break;
          case 'polygon':
            h += attrRow('Centro X', 'cx', a.cx) + attrRow('Centro Y', 'cy', a.cy) + attrRow('Radio', 'r', a.r) + attrRow('Lados', 'sides', a.sides || 5, 1)
              + `<div class="prow"><label>Estrella</label><input type="checkbox" data-battr="star"${a.star ? ' checked' : ''}></div>`
              + attrRow('Radio int.', 'ir', a.ir === undefined ? 0.5 : a.ir, 0.05); break;
        case 'path':
          if (S.tool === 'node' && S.nodeEdit && S.nodeEdit.sel) {
            const ne = S.nodeEdit;
            const sub = ne.subs[ne.sel.si];
            const n = sub ? sub.nodes[ne.sel.ni] : null;
            if (n) {
              const isStartOpen = !sub.closed && ne.sel.ni === 0;
              const isEndOpen = !sub.closed && ne.sel.ni === sub.nodes.length - 1;
              const lenIn = n.hin ? Math.hypot(n.hin.x - n.x, n.hin.y - n.y) : 0;
              const lenOut = n.hout ? Math.hypot(n.hout.x - n.x, n.hout.y - n.y) : 0;
              const hasIn = lenIn >= 2;
              const hasOut = lenOut >= 2;
              const nature = (!hasIn && !hasOut) ? 'corner' : (n.smooth ? 'smooth' : 'independent');

              h += `<div style="background:rgba(124,92,255,.08); border:1px solid rgba(124,92,255,.2); border-radius:6px; padding:6px 8px; margin-bottom:10px">
            <div style="font-weight:600; font-size:11px; color:var(--accent2); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center">
              <span>PUNTO #${ne.sel.ni + 1} de ${sub.nodes.length} ${sub.closed ? '(cerrado)' : '(abierto)'}</span>
              <div style="display:flex; gap:3px">
                <button class="mini" data-na="prevnode" title="Punto anterior" style="padding:1px 6px">◀</button>
                <button class="mini" data-na="nextnode" title="Punto siguiente" style="padding:1px 6px">▶</button>
              </div>
            </div>
            <div class="prow" style="margin-bottom:6px"><label style="width:70px">Tipo nodo</label>
              <div style="display:flex; gap:3px; flex:1">
                <button class="mini${nature === 'corner' ? ' active' : ''}" data-na="nature" data-val="corner" title="Vértice recto: sin handles (segmentos rectos)">∡ Recto</button>
                <button class="mini${nature === 'smooth' ? ' active' : ''}" data-na="nature" data-val="smooth" title="Suave: handles alineados a 180° (curva continua)">⌒ Suave</button>
                <button class="mini${nature === 'independent' ? ' active' : ''}" data-na="nature" data-val="independent" title="Independiente: handles desacoplados (curvas libres)">⎇ Indep.</button>
              </div>
            </div>
            <div class="prow" style="margin-bottom:6px"><label style="width:70px">Posición</label>
              <div style="display:flex; gap:6px; flex:1; align-items:center">
                <span style="color:var(--txt2); font-size:11px">X</span>
                <input type="number" step="0.5" id="inpNodeX" value="${+n.x.toFixed(2)}" style="width:60px">
                <span style="color:var(--txt2); font-size:11px">Y</span>
                <input type="number" step="0.5" id="inpNodeY" value="${+n.y.toFixed(2)}" style="width:60px">
              </div>
            </div>`;

              if (!isStartOpen) {
                h += `<div class="prow" style="margin-bottom:4px"><label style="width:70px; font-size:11px">Entrada</label>
              <span style="color:${hasIn ? 'var(--accent2)' : 'var(--txt2)'}; font-size:11px; flex:1">${hasIn ? 'Curvo (con handle)' : (lenIn > 0 ? 'Colapsado (0px)' : 'Recto (sin handle)')}</span>
              <button class="mini" data-na="tghin" title="${hasIn ? 'Quitar handle de entrada para que el segmento anterior sea recto' : 'Añadir/desplegar handle de entrada para curvar el segmento anterior'}">${hasIn ? '✕ Quitar' : '＋ Curvar'}</button>
            </div>`;
                if (n.hin) {
                  h += `<div style="margin-left:72px; margin-bottom:5px; font-size:10px; color:${hasIn ? 'var(--txt2)' : '#ff5470'}">
                Longitud: ${+lenIn.toFixed(1)}px (dx:${+(n.hin.x - n.x).toFixed(1)}, dy:${+(n.hin.y - n.y).toFixed(1)}) ${!hasIn ? '— haz clic en ＋ Curvar para desplegar' : ''}
              </div>`;
                }
              } else {
                h += `<div class="prow" style="margin-bottom:4px"><label style="width:70px; font-size:11px">Entrada</label>
              <span style="color:var(--txt2); font-size:11px; flex:1; font-style:italic">Inicio del trazo</span>
            </div>`;
              }

              if (!isEndOpen) {
                h += `<div class="prow" style="margin-bottom:4px"><label style="width:70px; font-size:11px">Salida</label>
              <span style="color:${hasOut ? 'var(--accent2)' : 'var(--txt2)'}; font-size:11px; flex:1">${hasOut ? 'Curvo (con handle)' : (lenOut > 0 ? 'Colapsado (0px)' : 'Recto (sin handle)')}</span>
              <button class="mini" data-na="tghout" title="${hasOut ? 'Quitar handle de salida para que el segmento siguiente sea recto' : 'Añadir/desplegar handle de salida para curvar el segmento siguiente'}">${hasOut ? '✕ Quitar' : '＋ Curvar'}</button>
            </div>`;
                if (n.hout) {
                  h += `<div style="margin-left:72px; margin-bottom:5px; font-size:10px; color:${hasOut ? 'var(--txt2)' : '#ff5470'}">
                Longitud: ${+lenOut.toFixed(1)}px (dx:${+(n.hout.x - n.x).toFixed(1)}, dy:${+(n.hout.y - n.y).toFixed(1)}) ${!hasOut ? '— haz clic en ＋ Curvar para desplegar' : ''}
              </div>`;
                }
              } else {
                h += `<div class="prow" style="margin-bottom:4px"><label style="width:70px; font-size:11px">Salida</label>
              <span style="color:var(--txt2); font-size:11px; flex:1; font-style:italic">Fin del trazo</span>
            </div>`;
              }

              h += `<div class="prow" style="margin-top:6px; margin-bottom:2px"><label style="width:70px"></label>
              <button class="mini" data-na="delnode" title="Eliminar este punto (Supr)" style="color:#ff5470">🗑 Eliminar punto</button>
            </div>
          </div>`;
            }
          } else if (S.tool === 'node' && S.nodeEdit) {
            const sub0 = S.nodeEdit.subs && S.nodeEdit.subs[0];
            const ptsCount = sub0 ? sub0.nodes.length : 0;
            h += `<div style="background:rgba(124,92,255,.06); border:1px dashed rgba(124,92,255,.3); border-radius:6px; padding:8px; margin-bottom:10px">
              <div style="color:var(--accent2); font-weight:600; margin-bottom:4px">Selecciona un punto para cambiar su naturaleza:</div>
              <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:4px">
                ${Array.from({ length: ptsCount }, (_, i) => `<button class="mini" data-na="picknode" data-idx="${i}" style="padding:2px 8px">Punto #${i + 1}</button>`).join('')}
              </div>
            </div>`;
          }
          h += `<div class="prow"><label>Ruta d</label><input type="text" data-tattr="d" value="${esc(a.d)}"></div>`
            + `<div class="prow"><label></label><button class="mini${S.tool === 'node' ? ' active' : ''}" data-a="nodes">✒ Editar nodos (A)</button>
          <button class="mini" data-a="smooth">〰 Suavizar</button>
          <button class="mini" data-a="tosimpleshapes" title="Convertir a formas simples: separa bloques en capas distintas">☵ Formas simples</button></div>`; break;
        case 'image':
          h += attrRow('X', 'x', a.x) + attrRow('Y', 'y', a.y) + attrRow('Ancho', 'w', a.w) + attrRow('Alto', 'h', a.h)
            + `<div class="prow"><label>Modo calco</label><input type="checkbox" id="chkTracingRef"${l.isReference ? ' checked' : ''} title="Referencia para calcar a mano"></div>`
            + `<div class="prow"><label>Excluir export.</label><input type="checkbox" id="chkExcludeExport"${l.excludeFromExport !== false ? ' checked' : ''} title="No incluir en exportación final"></div>`
            + `<div class="prow"><label>Ajustar</label>
           <button class="mini" data-a="imgcenter" title="Centrar en el lienzo">Centrar</button>
           <button class="mini" data-a="imgfit" title="Ajustar al lienzo manteniendo proporción">Ajustar</button>
           <button class="mini" data-a="imgreset" title="Restablecer tamaño original">1:1</button></div>`; break;
          case 'raw': h += `<div class="empty-note" style="padding:4px 0">Grupo: se transforma y anima como conjunto. Usa Objeto → Desagrupar para separarlo.</div>`; break;
        }
        h += pgEnd;
      }

      const paths = doc.layers.filter(x => x.type === 'path' && x.id !== l.id);
      h += pg('motion', 'Trayectoria de movimiento');
      h += `<div class="prow"><label>Trazado</label><select id="motionSel">
      <option value="">— ninguna —</option>
      ${doc.routes.map(x => `<option value="${x.id}"${l.motion && l.motion.srcId === x.id ? ' selected' : ''}>➰ ${esc(x.name)}</option>`).join('')}
      ${paths.map(x => `<option value="${x.id}"${l.motion && l.motion.srcId === x.id ? ' selected' : ''}>✎ ${esc(x.name)}</option>`).join('')}
    </select></div>`;
      if (l.motion && l.motion.d) {
        h += `<div class="prow"><label>Orientar</label><input type="checkbox" id="motionOrient"${l.motion.orient ? ' checked' : ''} title="Rotar siguiendo la dirección del trazado"></div>`
          + numRow('Progreso %', 'mp', p.mp, 1)
          + `<div class="empty-note" style="padding:2px 0">Anima "Trayecto %" con keyframes (0 → 100) para recorrer el trazado.</div>`;
      }
      h += pgEnd;

      if (doc.scenes.length) {
        h += pg('scene', 'Escena');
        h += `<div class="prow"><label>Escena</label><select id="sceneSel">
        <option value="">🌐 global</option>
        ${doc.scenes.map(s => `<option value="${s.id}"${l.scene === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}
      </select></div>`;
        h += pgEnd;
      }

      h += pg('fx', 'Efectos de vídeo');
      h += `<div class="prow"><label>Efecto</label><select id="fxSel" style="max-width:150px">${Object.entries(FX).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="prow"><label>Duración</label><input type="number" id="fxDur" value="1" min="0.1" step="0.1" style="width:52px">
    <button class="mini" id="fxApply" title="Genera keyframes editables desde el tiempo actual">Aplicar en t=${S.T.toFixed(2)}s</button></div>`;
      h += pgEnd;

      body.innerHTML = h;

      const scs = $('#sceneSel');
      if (scs) scs.onchange = () => { snapshot(); l.scene = scs.value || null; renderScenesPanel(); applyFrame(S.T); };
      $('#fxApply').onclick = () => applyEffect($('#fxSel').value, Math.max(0.1, +$('#fxDur').value || 1));

      body.querySelectorAll('[data-prop]').forEach(inp => {
        inp.oninput = () => {
          editSnap();
          const raw = parseFloat(inp.value) || 0;
          const axis = inp.dataset.rulerAxis;
          writeProp(l, inp.dataset.prop, axis ? fromRuler(raw, axis) : raw);
          applyFrame(S.T); renderTimeline();
        };
      });
      body.querySelectorAll('[data-attr]').forEach(inp => {
        inp.oninput = () => {
          editSnap();
          const raw = parseFloat(inp.value) || 0;
          const axis = inp.dataset.rulerAxis;
          l.attrs[inp.dataset.attr] = axis ? fromRuler(raw, axis) : raw;
          if (inp.dataset.attr === 'sw') {
            if ((!l.attrs.stroke || l.attrs.stroke === 'none') && raw > 0) {
              const strokeInp = body.querySelector('[data-cattr="stroke"]');
              l.attrs.stroke = (strokeInp && strokeInp.value) ? strokeInp.value : '#000000';
              const noStrokeBtn = body.querySelector('[data-a="nostroke"]');
              if (noStrokeBtn) noStrokeBtn.classList.remove('active');
            }
          }
          keyGeom(l); render();
        };
      });
      body.querySelectorAll('[data-tattr]').forEach(inp => {
        inp.oninput = () => { editSnap(); l.attrs[inp.dataset.tattr] = inp.value; keyGeom(l); render(); };
      });
      body.querySelectorAll('[data-sattr]').forEach(sel => {
        sel.onchange = () => {
          editSnap();
          l.attrs[sel.dataset.sattr] = sel.value;
          if (sel.dataset.sattr === 'ff') loadGoogleFont(sel.value);
          render(); renderProps();
        };
      });
      const btnAddGFont = $('#btnAddGFont');
      const inpAddGFont = $('#inpAddGFont');
      if (btnAddGFont && inpAddGFont) {
        const doLoadGFont = () => {
          const val = inpAddGFont.value.trim();
          if (!val) return;
          loadGoogleFont(val);
          editSnap();
          l.attrs.ff = val;
          render();
          renderProps();
          showHint(`Google Font "${val}" cargada y aplicada`);
        };
        btnAddGFont.onclick = doLoadGFont;
        inpAddGFont.onkeydown = e => { if (e.key === 'Enter') doLoadGFont(); };
      }
      body.querySelectorAll('[data-battr]').forEach(cb => {
        cb.onchange = () => { editSnap(); l.attrs[cb.dataset.battr] = cb.checked; keyGeom(l); render(); };
      });
      body.querySelectorAll('[data-cprop]').forEach(inp => {
        inp.oninput = () => { editSnap(); writeProp(l, 'fill', inp.value); if (!keysOf(l.id, 'fill')) render(); else applyFrame(S.T); renderTimeline(); };
      });
      body.querySelectorAll('[data-cattr]').forEach(inp => {
        const updateColor = () => {
          editSnap();
          l.attrs[inp.dataset.cattr] = inp.value;
          if (inp.dataset.cattr === 'stroke') {
            if (!l.attrs.sw || l.attrs.sw <= 0) {
              l.attrs.sw = 1;
              const swInp = body.querySelector('[data-attr="sw"]');
              if (swInp) swInp.value = '1';
            }
            const noStrokeBtn = body.querySelector('[data-a="nostroke"]');
            if (noStrokeBtn) noStrokeBtn.classList.remove('active');
          }
          render();
        };
        inp.oninput = updateColor;
        inp.onchange = updateColor;
        inp.addEventListener('click', () => {
          if (inp.dataset.cattr === 'stroke' && (!l.attrs.stroke || l.attrs.stroke === 'none')) {
            updateColor();
          }
        });
      });
      body.querySelectorAll('[data-kprop]').forEach(b => { b.onclick = () => toggleKey(l, b.dataset.kprop); });
      body.querySelectorAll('[data-org]').forEach(inp => {
        inp.onchange = () => {
          editSnap();
          const [x, y] = ctr(l);
          const axis = inp.dataset.org === 'x' ? 'x' : 'y';
          // El origen se guarda en coords SVG; el usuario ingresa en coords de regla
          const svgVal = fromRuler(+inp.value || 0, axis);
          l.origin = { x: inp.dataset.org === 'x' ? svgVal : x, y: inp.dataset.org === 'y' ? svgVal : y };
          applyFrame(S.T);
        };
      });
      const acts = {
        nofill: () => { snapshot(); l.attrs.fill = 'none'; render(); renderProps(); },
        nostroke: () => { snapshot(); l.attrs.stroke = ''; render(); renderProps(); },
        fliph: () => flipSel('h'), flipv: () => flipSel('v'), rotl: () => rotateSel(-90), rotr: () => rotateSel(90),
        centerorg: centerOrigin, smooth: smoothSelection, tosimpleshapes: convertToSimpleShapes,
        topath: () => convertToPath(l),
        nodes: () => {
          setTool('node');
          const l = selLayer();
          if (l) enterNodeEdit(l);
          refreshPanels();
          drawOverlay();
        },
        bold: () => { snapshot(); l.attrs.fw = (l.attrs.fw === 'bold' || +l.attrs.fw >= 600) ? 'normal' : 'bold'; render(); renderProps(); },
        italic: () => { snapshot(); l.attrs.fst = !l.attrs.fst; render(); renderProps(); },
        under: () => { snapshot(); l.attrs.td = !l.attrs.td; render(); renderProps(); },
        imgcenter: () => {
          snapshot();
          l.attrs.x = Math.round((doc.w - l.attrs.w) / 2);
          l.attrs.y = Math.round((doc.h - l.attrs.h) / 2);
          l.base.tx = 0; l.base.ty = 0;
          render(); renderProps();
        },
        imgfit: () => {
          snapshot();
          const nw = l.attrs.origW || l.attrs.w || 100;
          const nh = l.attrs.origH || l.attrs.h || 100;
          const sc = Math.min(doc.w / nw, doc.h / nh);
          l.attrs.w = Math.round(nw * sc);
          l.attrs.h = Math.round(nh * sc);
          l.attrs.x = Math.round((doc.w - l.attrs.w) / 2);
          l.attrs.y = Math.round((doc.h - l.attrs.h) / 2);
          l.base.tx = 0; l.base.ty = 0;
          render(); renderProps();
        },
        imgreset: () => {
          snapshot();
          if (l.attrs.origW && l.attrs.origH) {
            l.attrs.w = l.attrs.origW;
            l.attrs.h = l.attrs.origH;
          }
          l.base.sx = 1; l.base.sy = 1;
          render(); renderProps();
        }
      };
      body.querySelectorAll('[data-a]').forEach(b => { b.onclick = () => acts[b.dataset.a] && acts[b.dataset.a](); });
      body.querySelectorAll('[data-na]').forEach(b => {
        b.onclick = () => {
          const ne = S.nodeEdit; if (!ne) return;
          const na = b.dataset.na;
          if (na === 'picknode') {
            const idx = +b.dataset.idx;
            ne.sel = { si: 0, ni: idx };
            renderProps(); drawOverlay();
            return;
          }
          if (!ne.sel) return;
          if (na === 'nature') setNodeNature(ne.sel.si, ne.sel.ni, b.dataset.val);
          else if (na === 'tghin') toggleNodeHandle(ne.sel.si, ne.sel.ni, 'hin');
          else if (na === 'tghout') toggleNodeHandle(ne.sel.si, ne.sel.ni, 'hout');
          else if (na === 'delnode') deleteSelNode();
          else if (na === 'prevnode') {
            const sub = ne.subs[ne.sel.si];
            const nextNi = (ne.sel.ni - 1 + sub.nodes.length) % sub.nodes.length;
            ne.sel = { si: ne.sel.si, ni: nextNi };
            renderProps(); drawOverlay();
          }
          else if (na === 'nextnode') {
            const sub = ne.subs[ne.sel.si];
            const nextNi = (ne.sel.ni + 1) % sub.nodes.length;
            ne.sel = { si: ne.sel.si, ni: nextNi };
            renderProps(); drawOverlay();
          }
        };
      });
      const inNx = body.querySelector('#inpNodeX'), inNy = body.querySelector('#inpNodeY');
      if (inNx && inNy) {
        inNx.onchange = () => { const ne = S.nodeEdit; if (ne && ne.sel) setNodePos(ne.sel.si, ne.sel.ni, parseFloat(inNx.value) || 0, parseFloat(inNy.value) || 0); };
        inNy.onchange = () => { const ne = S.nodeEdit; if (ne && ne.sel) setNodePos(ne.sel.si, ne.sel.ni, parseFloat(inNx.value) || 0, parseFloat(inNy.value) || 0); };
      }
      const ctrRef = $('#chkTracingRef');
      if (ctrRef) ctrRef.onchange = e => {
        snapshot();
        l.isReference = e.target.checked;
        if (l.isReference) {
          l.excludeFromExport = true;
          if (l.base.opacity > 0.6) l.base.opacity = 0.5;
        }
        renderLayersPanel(); renderProps(); applyFrame(S.T);
      };
      const cee = $('#chkExcludeExport');
      if (cee) cee.onchange = e => {
        snapshot();
        l.excludeFromExport = e.target.checked;
        renderProps();
      };
      const ms = $('#motionSel');
      if (ms) ms.onchange = () => {
        snapshot();
        if (!ms.value) { l.motion = null; }
        else {
          const rt = getRoute(ms.value), src = rt || getLayer(ms.value);
          l.motion = { srcId: src.id, d: rt ? rt.d : src.attrs.d, orient: true };
          if (!keysOf(l.id, 'mp')) { setKeyAt(l, 'mp', 0, 0); setKeyAt(l, 'mp', doc.dur, 100); }
        }
        refreshPanels(); applyFrame(S.T);
      };
      const mo = $('#motionOrient');
      if (mo) mo.onchange = () => { snapshot(); l.motion.orient = mo.checked; applyFrame(S.T); };
      $('#propName').onchange = e => { l.name = e.target.value; renderLayersPanel(); renderTimeline(); };
      bindPgroupToggles();
    }

    function toggleKey(l, prop) {
      snapshot();
      const ks = keysOf(l.id, prop);
      const idx = ks ? ks.findIndex(k => Math.abs(k.t - S.T) < 1e-4) : -1;
      if (idx >= 0) {
        const cur = valAt(l, prop, S.T);
        removeKey(l, prop, idx);
        if (!keysOf(l.id, prop)) setBase(l, prop, cur);
      } else {
        setKeyAt(l, prop, S.T, valAt(l, prop, S.T));
        S.expanded[l.id] = true;
      }
      refreshPanels(); applyFrame(S.T);
    }

    /* ---------------- Herramientas y gestos ---------------- */
    $$('.toolbtn[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
    function setTool(t) {
      if (S.penActive) finishPen(false);
      if (t !== 'node') S.nodeEdit = null;
      S.tool = t;
      $$('.toolbtn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
      area.className = ''; area.classList.add('tool-' + t);
      if (t === 'node') {
        let l = selLayer();
        if (l && !l.locked) {
          if (l.type === 'raw') {
            l = convertToPath(l);
          }
          if (l && ['path', 'rect', 'ellipse', 'polygon', 'line', 'text'].includes(l.type)) {
            if (!S.nodeEdit || S.nodeEdit.id !== l.id) enterNodeEdit(l);
          } else {
            S.nodeEdit = null;
          }
        } else {
          S.nodeEdit = null;
        }
      }
      drawOverlay();
      renderGuides();
      const hints = {

    /* ---------------- Importación (SVG, Lottie y Bitmaps/Calco) ---------------- */
    const imgBtn = $('#btnLayerAddImage');
    if (imgBtn) imgBtn.onclick = () => $('#fileImportImage').click();
    $('#fileImportImage').onchange = async e => {
      for (const f of [...e.target.files]) await importBitmap(f);
      e.target.value = '';
    };
    function importBitmap(file, customName) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const dataUrl = ev.target.result;
          const img = new Image();
          img.onload = () => {
            snapshot();
            const natW = img.naturalWidth || 400;
            const natH = img.naturalHeight || 300;
            let targetW = natW, targetH = natH;
            const maxW = Math.max(100, doc.w * 0.9);
            const maxH = Math.max(100, doc.h * 0.9);
            if (targetW > maxW || targetH > maxH) {
              const scale = Math.min(maxW / targetW, maxH / targetH);
              targetW = Math.round(targetW * scale);
              targetH = Math.round(targetH * scale);
            }
            const x = Math.round((doc.w - targetW) / 2);
            const y = Math.round((doc.h - targetH) / 2);
            const name = customName || (file && file.name ? file.name.replace(/\.[^/.]+$/, '') : 'Calco');
            const l = addLayer('image', {
              x, y, w: targetW, h: targetH,
              origW: natW, origH: natH,
              href: dataUrl,
              preserveAspectRatio: 'none'
            }, name);
            const idx = doc.layers.indexOf(l);
            if (idx > 0) {
              doc.layers.splice(idx, 1);
              doc.layers.unshift(l);
            }
            l.isReference = true;
            l.excludeFromExport = true;
            l.base.opacity = 0.5;
            l.locked = true;
            selectOnly(null);
            refresh();
            showHint(`Imagen «${l.name}» añadida al fondo como calco [CALCO] (bloqueada 🔒 al 50% de opacidad).`);
            resolve(l);
          };
          img.onerror = () => { alert('No se pudo cargar la imagen.'); reject(); };
          img.src = dataUrl;
        };
        reader.onerror = () => { alert('Error al leer el archivo de imagen.'); reject(); };
        reader.readAsDataURL(file);
      });
    }
    function importFile(f) {
      if (/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name) || (f.type && f.type.startsWith('image/') && !f.type.includes('svg'))) {
        return importBitmap(f);
      }
      return f.text().then(txt => {
        const t = txt.trim();
        if (t.startsWith('PK')) { alert(`${f.name}: es un dotLottie (.lottie, un ZIP). Descomprímelo y usa el .json interior.`); return; }
        if (t.startsWith('{')) importLottie(txt, f.name);
        else importSVG(txt, f.name);
      }).catch(() => alert('No se pudo leer ' + f.name));
    }
    $('#fileImport').onchange = async e => {
      for (const f of [...e.target.files]) await importFile(f);
      e.target.value = '';
    };
    area.addEventListener('dragover', e => e.preventDefault());
    area.addEventListener('drop', async e => {
      e.preventDefault();

        if (/\.(svg|json)$/i.test(f.name)) await importFile(f);
        else if (/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name) || (f.type && f.type.startsWith('image/'))) await importBitmap(f);
      }
    });
    window.addEventListener('paste', async e => {

      // Intentar primero pegar imagen del portapapeles del sistema
      if (items) {
        for (const it of items) {
          if (it.type && it.type.indexOf('image') !== -1) {
            const f = it.getAsFile();
            if (f) { e.preventDefault(); await importBitmap(f, 'Calco pegado'); return; }

    });
    function importSVG(txt, fname) {
      const p = new DOMParser().parseFromString(txt, 'image/svg+xml');
      const err = p.querySelector('parsererror');
      const root = p.documentElement;
      if (err || root.nodeName.toLowerCase() !== 'svg') { alert('El archivo no es un SVG válido.'); return; }
      snapshot();
      let vb = root.getAttribute('viewBox'), ox = 0, oy = 0, iw = 0, ih = 0;
      if (vb) { const v = vb.trim().split(/[\s,]+/).map(Number); ox = v[0]; oy = v[1]; iw = v[2]; ih = v[3]; }
      else { iw = parseFloat(root.getAttribute('width')) || 0; ih = parseFloat(root.getAttribute('height')) || 0; }
      if (!doc.layers.length && iw && ih) { doc.w = Math.round(iw); doc.h = Math.round(ih); }
      root.querySelectorAll(':scope > defs, :scope > style').forEach(n => {
        doc.defs += (n.nodeName.toLowerCase() === 'defs') ? n.innerHTML : n.outerHTML;
        n.remove();
      });
      const skip = new Set(['title', 'desc', 'metadata', 'script']);
      let n = 0;
      [...root.children].forEach(ch => {
        if (skip.has(ch.nodeName.toLowerCase())) return;
        if (ox || oy) ch.setAttribute('transform', `translate(${-ox} ${-oy}) ` + (ch.getAttribute('transform') || ''));
        const l = addLayer('raw', {}, (fname ? fname.replace(/\.svg$/i, '') : 'importado') + (n ? ' ' + (n + 1) : ''));
        l.raw = ch.outerHTML; n++;
        selectOnly(l.id);
      });
      if (!n) { alert('El SVG no contiene elementos visibles.'); }
      refresh(); zoomFit();
      showHint(`Importadas ${n} capa(s) desde ${fname || 'SVG'} — sin restricciones`);
    }


    /* ---------------- Importación Lottie (capas de formas y precomposiciones) ---------------- */
    function importLottie(txt, fname) {
      let j;
      try { j = JSON.parse(txt); } catch (e) { alert('El archivo no es JSON válido.'); return; }
      if (!Array.isArray(j.layers)) { alert('El JSON no parece una animación Lottie (falta "layers").'); return; }
      snapshot();
      const fr = j.fr || 30, ip = j.ip || 0, op = (j.op !== undefined ? j.op : ip + fr * 3);
      if (!doc.layers.length && j.w && j.h) { doc.w = Math.round(j.w); doc.h = Math.round(j.h); }
      doc.dur = Math.max(0.1, +(((op - ip) / fr).toFixed(3)));
      const toT = f => clamp(+(((f - ip) / fr).toFixed(4)), 0, doc.dur);
      const num = v => Array.isArray(v) ? +v[0] : +v;
      const num2 = (v, i) => Array.isArray(v) ? +v[i] : +v;
      const isAnim = v => !!v && (v.a === 1 || (Array.isArray(v.k) && typeof v.k[0] === 'object' && v.k[0] !== null && v.k[0].t !== undefined));
      const sVal = v => {
        if (v == null) return null;
        if (!isAnim(v)) return v.k;
        const first = v.k[0];
        return first.s !== undefined ? first.s : first.e;
      };
      function getPathData(ks) {
        let pk = sVal(ks);
        if (Array.isArray(pk) && pk[0] && pk[0].v) pk = pk[0];
        return pk;
      }
      let warn = 0;
      function easeName(k) {
        if (k.h) return 'step';
        if (!k.o || !k.i) return 'linear';
        const P = [num(k.o.x), num(k.o.y), num(k.i.x), num(k.i.y)];
        const cands = { linear: [0, 0, 1, 1], easeIn: [.42, 0, 1, 1], easeOut: [0, 0, .58, 1], easeInOut: [.42, 0, .58, 1], expoIn: [.7, 0, .84, 0], expoOut: [.16, 1, .3, 1] };
        let best = 'linear', bd = 1e9;
        for (const n in cands) {
          const c = cands[n];
          const d = c.reduce((s2, cv, q) => s2 + (cv - P[q]) * (cv - P[q]), 0);
          if (d < bd) { bd = d; best = n; }
        }
        return best;
      }
      function eachKey(v, cb) {
        for (let q = 0; q < v.k.length; q++) {
          const k = v.k[q];
          let sv = k.s;
          if (sv === undefined) { const pk = v.k[q - 1]; if (pk && pk.e !== undefined) sv = pk.e; else continue; }
          if (k.ti || k.to) warn++; // tangentes espaciales: se interpola en recta
          cb(toT(k.t), sv, easeName(k));
        }
      }
      function lotColor(c) {
        if (!c) return '#7c5cff';
        const k = sVal(c);
        if (!Array.isArray(k)) return '#7c5cff';
        return rgbHex([k[0] * 255, k[1] * 255, k[2] * 255]);
      }
      function lottiePathToD(pk, m) {
        const V = pk.v || [], I = pk.i || [], O = pk.o || [];
        if (V.length < 2) return '';
        const tp = (x, y) => { if (!m) return [x, y]; const p = m.transformPoint(new DOMPoint(x, y)); return [p.x, p.y]; };
        const P = V.map(p => tp(p[0], p[1]));
        const Ci = V.map((p, q) => tp(p[0] + (I[q] ? I[q][0] : 0), p[1] + (I[q] ? I[q][1] : 0)));
        const Co = V.map((p, q) => tp(p[0] + (O[q] ? O[q][0] : 0), p[1] + (O[q] ? O[q][1] : 0)));
        let d = `M${fmt(P[0][0])} ${fmt(P[0][1])}`;
        const n = pk.c ? V.length : V.length - 1;
        for (let q = 0; q < n; q++) {
          const r = (q + 1) % V.length;
          d += ` C${fmt(Co[q][0])} ${fmt(Co[q][1])} ${fmt(Ci[r][0])} ${fmt(Ci[r][1])} ${fmt(P[r][0])} ${fmt(P[r][1])}`;
        }
        if (pk.c) d += ' Z';
        return d;
      }
      function layerKsMatrix(ks) {
        let m = new DOMMatrix();
        if (!ks) return m;
        const a = ks.a ? sVal(ks.a) || [0, 0] : [0, 0];
        const p = ks.p ? (ks.p.s ? [num(sVal(ks.p.x)), num(sVal(ks.p.y))] : sVal(ks.p) || [0, 0]) : [0, 0];
        const s = ks.s ? sVal(ks.s) || [100, 100] : [100, 100];
        const r = ks.r ? num(sVal(ks.r)) || 0 : (ks.rz ? num(sVal(ks.rz)) || 0 : 0);
        m = m.translate(num2(p, 0), num2(p, 1));
        if (r) m = m.rotate(r);
        m = m.scale(num2(s, 0) / 100, num2(s, 1) / 100);
        m = m.translate(-num2(a, 0), -num2(a, 1));
        return m;
      }
      function groupMatrix(tr, m) {
        if (!tr) return m;
        if (isAnim(tr.p) || isAnim(tr.s) || isAnim(tr.r) || isAnim(tr.a)) warn++;
        const p = tr.p ? sVal(tr.p) || [0, 0] : [0, 0];
        const a = tr.a ? sVal(tr.a) || [0, 0] : [0, 0];
        const s = tr.s ? sVal(tr.s) || [100, 100] : [100, 100];
        const r = tr.r ? num(sVal(tr.r)) || 0 : 0;

        gm = gm.translate(num2(p, 0), num2(p, 1));
        if (r) gm = gm.rotate(r);
        gm = gm.scale(num2(s, 0) / 100, num2(s, 1) / 100);
        gm = gm.translate(-num2(a, 0), -num2(a, 1));

      const assetsMap = new Map();
      (j.assets || []).forEach(a => { if (a && a.id) assetsMap.set(a.id, a); });

      function getCompLayerMatrix(layers, layerInd) {
        const layer = layers.find(l => l.ind === layerInd);

      let made = [];
      function bakeOrAdd(type, attrs, nm, m, st2) {
        const full = { ...attrs, fill: st2.fill !== undefined ? st2.fill : '#7c5cff', stroke: st2.stroke || '', sw: st2.sw || 1 };
        if (!m) {

          if (c[0] === 'Z') return ['Z'];

      function walkShapes(items, style, m, name) {
