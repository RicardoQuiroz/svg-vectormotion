          }
          else if (it.ty === 'gf' || it.ty === 'gs') { if (st2.fill === undefined) st2.fill = '#7c5cff'; warn++; }
          else if (it.ty === 'tm' || it.ty === 'rp' || it.ty === 'rd') warn++;
        }
        for (const it of items) {
          if (it.ty === 'gr') {
            const tr = (it.it || []).find(x => x.ty === 'tr');
            const subItems = [...(it.it || [])].reverse().filter(x => x.ty !== 'tr');
            const subMadeStart = made.length;
            walkShapes(subItems, st2, groupMatrix(tr, m), it.nm || name);
            if (tr && isAnim(tr.s)) {
              for (let qi = subMadeStart; qi < made.length; qi++) {
                addKeys2v(made[qi], 'sx', 'sy', tr.s, v => [num2(v, 0) / 100, num2(v, 1) / 100]);
              }
            }
          }
          else if (it.ty === 'sh') {
            const pk = getPathData(it.ks);
            if (pk && pk.v) {
              const d = lottiePathToD(pk, m);
              if (d) {
                const l = addLayer('path', { d, fill: st2.fill !== undefined ? st2.fill : 'none', stroke: st2.stroke || '', sw: st2.sw || 1 }, it.nm || name || 'trazado');
                if (st2.opacity !== undefined && st2.opacity < 1) setBase(l, 'opacity', st2.opacity);
                if (isAnim(it.ks) && Array.isArray(it.ks.k) && it.ks.k.length > 1) {
                  eachKey(it.ks, (t, sv, e) => {
                    let kpk = sv;
                    if (Array.isArray(kpk) && kpk[0] && kpk[0].v) kpk = kpk[0];
                    if (kpk && kpk.v) {
                      const kd = lottiePathToD(kpk, m);
                      if (kd) setKeyAt(l, 'geom', t, { tp: 'path', at: { d: kd, fill: l.attrs.fill, stroke: l.attrs.stroke, sw: l.attrs.sw } }, e);

                }
                made.push(l);

          }
          else if (it.ty === 'rc') {
            if (isAnim(it.p) || isAnim(it.s)) warn++;
            const p = sVal(it.p) || [0, 0], s2 = sVal(it.s) || [0, 0];
            bakeOrAdd('rect', { x: num2(p, 0) - num2(s2, 0) / 2, y: num2(p, 1) - num2(s2, 1) / 2, w: num2(s2, 0), h: num2(s2, 1), rx: num(sVal(it.r)) || 0 }, it.nm || name || 'rect', m, st2);
          }
          else if (it.ty === 'el') {
            if (isAnim(it.p) || isAnim(it.s)) warn++;

            bakeOrAdd('ellipse', { cx: num2(p, 0), cy: num2(p, 1), rx: num2(s2, 0) / 2, ry: num2(s2, 1) / 2 }, it.nm || name || 'elipse', m, st2);

          else if (it.ty === 'sr') {

      function addKeys(l, prop, v, map) {
        if (v == null) return;
        if (!isAnim(v)) { setBase(l, prop, map(v.k)); return; }

      function addKeys2v(l, pa, pb, v, map) {
        if (v == null) return;
        if (!isAnim(v)) { const mv = map(v.k); setBase(l, pa, mv[0]); setBase(l, pb, mv[1]); return; }

        l.origin = { x: ax, y: ay };

        if (ks.p) {
          if (ks.p.s) {
            addKeys(l, 'tx', ks.p.x, v => { let px = num(v); if (parentM) { const pt = parentM.transformPoint(new DOMPoint(px, ay)); px = pt.x; } return px - ax; });
            addKeys(l, 'ty', ks.p.y, v => { let py = num(v); if (parentM) { const pt = parentM.transformPoint(new DOMPoint(ax, py)); py = pt.y; } return py - ay; });

            addKeys2v(l, 'tx', 'ty', ks.p, v => {
              let px = num2(v, 0), py = num2(v, 1);

              return [px - ax, py - ay];
            });
          }
        }
        if (ks.r) addKeys(l, 'rot', ks.r, v => num(v));
        if (ks.s) addKeys2v(l, 'sx', 'sy', ks.s, v => [num2(v, 0) / 100, num2(v, 1) / 100]);
        if (ks.o) addKeys(l, 'opacity', ks.o, v => num(v) / 100);
        if (ks.sk && num(sVal(ks.sk))) addKeys(l, 'skx', ks.sk, v => num(v));
      }

      let total = 0, skipped = 0;
      function processLayers(layers, parentM) {
        [...layers].reverse().forEach(L => {
          if (L.td) return; // Definiciones de máscara track-matte no visibles
          const compM = getCompLayerMatrix(layers, L.ind);
          const totalM = parentM ? parentM.multiply(compM) : compM;

          if (L.ty === 0) {

            if (asset && Array.isArray(asset.layers)) {

            } else skipped++;
            return;
          }
          if (L.ty !== 4) { skipped++; return; }

          made = [];
          const layerOp = L.ks && L.ks.o ? (num(sVal(L.ks.o)) ?? 100) / 100 : 1;
          const hasKsAnim = L.ks && (isAnim(L.ks.p) || isAnim(L.ks.s) || isAnim(L.ks.r) || isAnim(L.ks.o) || isAnim(L.ks.sk));

          if (hasKsAnim && L.parent === undefined) {
            walkShapes([...(L.shapes || [])].reverse(), { opacity: layerOp }, parentM, L.nm);
            if (!made.length) { skipped++; return; }
            for (const l of made) applyKs(l, L.ks, parentM);
          } else {
            walkShapes([...(L.shapes || [])].reverse(), { opacity: layerOp }, totalM, L.nm);
            if (!made.length) { skipped++; return; }
          }

          if (made.length === 1 && L.nm) made[0].name = L.nm;
          total += made.length;
        });
      }

      processLayers(j.layers, null);
      refresh(); zoomFit();
      if (!total) { alert('No se encontraron capas de formas importables en el archivo Lottie.'); return; }
      showHint(`Lottie: ${total} capa(s) importadas de ${fname || 'archivo'}${skipped ? ` · ${skipped} omitidas` : ''}${warn ? ` · ${warn} rasgos aproximados` : ''}`);
    }

    /* ---------------- Refresco global ---------------- */
    function refreshPanels() { renderLayersPanel(); renderScenesPanel(); renderRoutesPanel(); renderGuidesPanel(); renderProps(); renderTimeline(); }
    function refresh() {
      render();
      renderGuides();
      $('#docW').value = doc.w; $('#docH').value = doc.h; $('#docBg').value = doc.bg; $('#docDur').value = doc.dur;
      refreshPanels();
    }

    /* ================================================================
       Línea de tiempo, keyframes y reproducción
       ================================================================ */
    let PPS = 140; const TPAD = 10; // píxeles por segundo (zoom del timeline), margen izquierdo

    function tlWidth() {
      let maxT = doc.dur;
      for (const id in anims) for (const p in anims[id]) for (const k of anims[id][p]) maxT = Math.max(maxT, k.t);
      return maxT * PPS + TPAD + 80;
    }
    function renderRuler() {
      const r = $('#tRuler'); const w = tlWidth();
      r.style.width = w + 'px';
      let h = '';
      const step = doc.dur > 12 ? 1 : 0.5;
      for (let t = 0; t <= w / PPS; t += step) {
        h += `<div class="rmark" style="left:${TPAD + t * PPS}px">${(+t.toFixed(2))}s</div>`;
      }
      // bandas de escenas
      const SCENE_COLORS = ['#1565C0', '#F57F17', '#6A1B9A', '#2E7D32', '#AD1457', '#00838F'];
      let acc = 0;
      doc.scenes.forEach((s, i) => {
        h += `<div class="sceneBand" style="left:${TPAD + acc * PPS}px;width:${s.dur * PPS}px;background:${SCENE_COLORS[i % SCENE_COLORS.length]}" title="${esc(s.name)}"></div>`;
        acc += s.dur;
      });
      // bucle A-B
      if (S.abA != null && S.abB != null) {
        const a = Math.min(S.abA, S.abB), b = Math.max(S.abA, S.abB);
        h += `<div class="abBand" style="left:${TPAD + a * PPS}px;width:${(b - a) * PPS}px" title="Bucle A-B (Alt+clic para quitar)"></div>`;
      } else if (S.abA != null) {
        h += `<div class="abBand" style="left:${TPAD + S.abA * PPS}px;width:2px" title="Punto A (Alt+clic fija B)"></div>`;
      }
      // marca y tirador arrastrable de fin de duración
      h += `<div id="durMarker" class="dur-marker" style="left:${TPAD + doc.dur * PPS}px" title="Duración: ${doc.dur.toFixed(2)}s (Arrastra para cambiar duración)">
        <div class="dur-handle" title="Arrastra para cambiar la duración máxima">
          <span style="font-size:10px;pointer-events:none;line-height:1">⇥</span>
          <span style="pointer-events:none;line-height:1">${doc.dur.toFixed(1)}s</span>
        </div>
        <div class="dur-line"></div>
      </div>`;
      r.innerHTML = h;
      $('#rulerPlayhead').style.left = (TPAD + S.T * PPS - $('#tTracksWrap').scrollLeft) + 'px';
    }
    function kfDiamond(id, prop, k, idx) {
      const sel = S.selKf && S.selKf.id === id && S.selKf.prop === prop && S.selKf.idx === idx;
      return `<div class="kf${sel ? ' selected' : ''}" data-id="${id}" data-prop="${prop}" data-idx="${idx}" style="left:${TPAD + k.t * PPS}px" title="${PROP_LABEL[prop]} @ ${k.t.toFixed(2)}s (${easeLabel(k.ease)})"></div>`;
    }
    function renderTimeline() {
      renderRuler();
      const names = $('#tNames'), tracks = $('#tTracks');
      const w = tlWidth();
      let nh = '', th = '';
      [...doc.layers].reverse().forEach(l => {
        const la = anims[l.id] || {};
        const hasAnim = Object.keys(la).length > 0;
        const exp = S.expanded[l.id];
        nh += `<div class="tname-row layer-row${l.id === S.sel ? ' selected' : ''}" data-lid="${l.id}">
      <span class="tl-chevron" title="${exp ? 'Colapsar propiedades' : 'Expandir propiedades'}">${exp ? '▾' : '▸'}</span>
      <span class="tl-lname" style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(l.name)}</span>
      ${hasAnim ? '<span title="Capa animada" style="color:var(--kf);font-size:11px;margin-right:2px">◆</span>' : ''}</div>`;
        // fila de capa: agregado de keyframes
        let agg = '';
        if (hasAnim && !exp) {
          const ts = new Set();
          for (const p in la) la[p].forEach(k => ts.add(+k.t.toFixed(3)));
          const arr = [...ts].sort((a, b) => a - b);
          if (arr.length > 1) agg += `<div class="kf-span" style="left:${TPAD + arr[0] * PPS}px;width:${(arr[arr.length - 1] - arr[0]) * PPS}px"></div>`;
          arr.forEach(t => agg += `<div class="kf" data-lid="${l.id}" data-agg="${t}" style="left:${TPAD + t * PPS}px;pointer-events:none;opacity:.7"></div>`);
        }
        th += `<div class="trow layer-row" data-lid="${l.id}" style="width:${w}px">${agg}</div>`;
        if (exp) {
          for (const [prop, label] of applicableAnimProps(l)) {
            const ks = la[prop];
            nh += `<div class="tname-row prop-row" data-lid="${l.id}"><span style="flex:1">${label}</span>
          <button class="mini" data-addkf="${l.id}:${prop}" title="Keyframe en t actual">◆+</button></div>`;
            let kh = '';
            if (ks && ks.length) {
              if (ks.length > 1) kh += `<div class="kf-span" style="left:${TPAD + ks[0].t * PPS}px;width:${(ks[ks.length - 1].t - ks[0].t) * PPS}px"></div>`;
              ks.forEach((k, i) => kh += kfDiamond(l.id, prop, k, i));
            }
            th += `<div class="trow" data-track="${l.id}:${prop}" style="width:${w}px">${kh}</div>`;
          }
        }
      });
      names.innerHTML = nh;
      tracks.innerHTML = th + '<div id="playhead"></div>';
      tracks.style.width = w + 'px';
      positionPlayhead();
      names.scrollTop = $('#tTracksWrap').scrollTop;

      names.querySelectorAll('.layer-row').forEach(d => {
        d.onclick = e => {
          const id = d.dataset.lid;
          if (!id) return;
          const isChevron = e.target.closest('.tl-chevron');
          if (isChevron) {
            S.expanded[id] = !S.expanded[id];
            if (S.sel !== id) selectLayer(id, false);
            else renderTimeline();
            return;
          }
          if (S.sel === id) {
            S.expanded[id] = !S.expanded[id];
            renderTimeline();
          } else {
            S.expanded[id] = true;
            selectLayer(id, false);
          }
        };
        d.ondblclick = e => {
          if (e.target.closest('button, .tl-chevron')) return;
          const id = d.dataset.lid;
          if (!id) return;
          if (!S.expanded[id]) {
            S.expanded[id] = true;
            renderTimeline();
          }
        };
      });
      names.querySelectorAll('.prop-row').forEach(pr => {
        pr.onclick = e => {
          if (e.target.closest('button')) return;
          const lid = pr.dataset.lid;
          if (lid && S.sel !== lid) selectLayer(lid, false);
        };
      });
      names.querySelectorAll('[data-addkf]').forEach(b => {
        b.onclick = e => {
          e.stopPropagation();
          const [id, prop] = b.dataset.addkf.split(':');
          const l = getLayer(id); if (!l) return;
          snapshot(); setKeyAt(l, prop, S.T, valAt(l, prop, S.T));
          refreshPanels();
        };
      });
    }
    function positionPlayhead() {
      const ph = $('#playhead');
      if (ph) ph.style.left = (TPAD + S.T * PPS) + 'px';
      $('#rulerPlayhead').style.left = (TPAD + S.T * PPS - $('#tTracksWrap').scrollLeft) + 'px';
      $('#timeLabel').textContent = S.T.toFixed(2) + 's';
      if (typeof updateTlZoomHud === 'function') updateTlZoomHud();
    }
    function setTime(t, updateUI) {
      S.T = clamp(t, 0, Math.max(doc.dur, t > doc.dur ? t : doc.dur));
      S.T = Math.max(0, t);
      applyFrame(S.T);
      positionPlayhead();
      if (updateUI !== false && !S.playing) { renderProps(); }
    }

    /* --- scrub en la regla y en las pistas --- */
    function getSnapTime(rawT, thresholdPx = 8) {
      const thresholdSec = thresholdPx / PPS;
      let bestT = rawT;
      let minDiff = thresholdSec;
      for (const id in anims) {
        const la = anims[id];
        if (!la) continue;
        for (const prop in la) {
          const ks = la[prop];
          if (!ks) continue;
          for (const k of ks) {
            const diff = Math.abs(k.t - rawT);
            if (diff < minDiff) {
              minDiff = diff;
              bestT = k.t;
            }
          }
        }
      }
      if (Math.abs(rawT) < minDiff) {
        minDiff = Math.abs(rawT);
        bestT = 0;
      }
      if (Math.abs(doc.dur - rawT) < minDiff) {
        minDiff = Math.abs(doc.dur - rawT);
        bestT = doc.dur;
      }
      return bestT;
    }

    function scrubFromEvent(e, el) {
      const r = el.getBoundingClientRect();
      const x = e.clientX - r.left + (el === $('#tRulerWrap') ? $('#tTracksWrap').scrollLeft : el.scrollLeft || 0);
      let t = Math.max(0, (x - TPAD) / PPS);
      if (!e.shiftKey) {
        t = getSnapTime(t, 8);
      }
      setTime(t, false);
    }
    let scrubbing = false;
    let durDrag = null;
    $('#tRulerWrap').addEventListener('pointerdown', e => {
      if (e.target.closest('#tlRightControls')) return;
      const dh = e.target.closest('.dur-handle');
      if (dh) {
        e.preventDefault();
        e.stopPropagation();
        durDrag = { startX: e.clientX, origDur: doc.dur };
        $('#tRulerWrap').setPointerCapture(e.pointerId);
        return;
      }
      if (e.altKey) {
        const r = $('#tRulerWrap').getBoundingClientRect();
        const t = Math.max(0, (e.clientX - r.left + $('#tTracksWrap').scrollLeft - TPAD) / PPS);
        if (S.abA == null) { S.abA = +t.toFixed(3); }
        else if (S.abB == null) { S.abB = +t.toFixed(3); if (S.abB < S.abA) [S.abA, S.abB] = [S.abB, S.abA]; }
        else { S.abA = null; S.abB = null; }
        renderRuler();
        showHint(S.abA == null ? 'Bucle A-B eliminado' : (S.abB == null ? 'Punto A fijado — Alt+clic para fijar B' : 'Bucle A-B activo: la reproducción queda confinada al tramo'));
        return;
      }
      scrubbing = true; $('#tRulerWrap').setPointerCapture(e.pointerId);
      scrubFromEvent(e, $('#tRulerWrap'));
    });
    $('#tNames').addEventListener('wheel', e => {
      e.preventDefault();
      $('#tTracksWrap').scrollTop += e.deltaY;
    }, { passive: false });
    $('#tRulerWrap').addEventListener('wheel', e => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        tlZoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX);
        return;
      }
      $('#tTracksWrap').scrollLeft += e.deltaY;
    }, { passive: false });
    $('#tTracksWrap').addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        tlZoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX);
        return;
      }
    }, { passive: false });
    $('#tRulerWrap').addEventListener('pointermove', e => {
      if (durDrag) {
        const r = $('#tRulerWrap').getBoundingClientRect();
        const x = e.clientX - r.left + $('#tTracksWrap').scrollLeft;
        let newDur = Math.max(0.1, +((x - TPAD) / PPS).toFixed(2));
        if (!e.shiftKey) {
          const step = 0.5;
          const snapped = Math.round(newDur / step) * step;
          if (Math.abs(snapped - newDur) < (8 / PPS)) newDur = +snapped.toFixed(2);
        }
        doc.dur = Math.max(0.1, newDur);
        const dd = $('#docDur'); if (dd) dd.value = doc.dur.toFixed(2);
        renderTimeline();
        return;
      }
      if (scrubbing) scrubFromEvent(e, $('#tRulerWrap'));
    });
    $('#tRulerWrap').addEventListener('pointerup', e => {
      if (durDrag) {
        snapshot();
        durDrag = null;
        if (S.T > doc.dur) setTime(doc.dur);
        renderTimeline();
        return;
      }
      scrubbing = false; renderProps(); renderTimeline();
    });

    /* --- interacción con keyframes --- */
    let kfDrag = null;
    $('#tTracksWrap').addEventListener('pointerdown', e => {
      const kf = e.target.closest('.kf');
      if (kf && kf.dataset.prop !== undefined) {
        e.preventDefault();
        const { id, prop } = kf.dataset; const idx = +kf.dataset.idx;
        S.selKf = { id, prop, idx };
        snapshot();
        kfDrag = { id, prop, idx, startX: e.clientX, el: kf, t0: anims[id][prop][idx].t, moved: false };
        $('#tTracksWrap').setPointerCapture(e.pointerId);
        renderTimeline(); showKfPopup();
        return;
      }
      // clic en pista vacía o en playhead → mover playhead
      if (e.target.classList.contains('trow') || e.target.id === 'tTracks' || e.target.id === 'playhead' || e.target.closest('#playhead')) {
        hideKfPopup(); S.selKf = null;
        scrubbing = true;
        $('#tTracksWrap').setPointerCapture(e.pointerId);
        scrubFromEvent(e, { getBoundingClientRect: () => $('#tTracks').getBoundingClientRect() });
        renderTimeline();
      }
    });
    $('#tTracksWrap').addEventListener('pointermove', e => {
      if (kfDrag) {
        const dt = (e.clientX - kfDrag.startX) / PPS;
        const ks = anims[kfDrag.id][kfDrag.prop];
        const k = ks[kfDrag.idx]; if (!k) return;
        k.t = Math.max(0, +(kfDrag.t0 + dt).toFixed(3));
        kfDrag.moved = true;
        ks.sort((a, b) => a.t - b.t);
        kfDrag.idx = ks.indexOf(k);
        S.selKf.idx = kfDrag.idx;
        renderTimeline(); applyFrame(S.T); showKfPopup();
        return;
      }
      if (scrubbing) scrubFromEvent(e, { getBoundingClientRect: () => $('#tTracks').getBoundingClientRect() });
    });
    $('#tTracksWrap').addEventListener('pointerup', () => {
      if (kfDrag && !kfDrag.moved) undoStack.pop(); // clic simple: no gastar undo
      kfDrag = null;
      if (scrubbing) { scrubbing = false; renderProps(); }
    });
    $('#tTracksWrap').addEventListener('scroll', () => {
      $('#tNames').scrollTop = $('#tTracksWrap').scrollTop;
      $('#tRuler').style.transform = `translateX(${-$('#tTracksWrap').scrollLeft}px)`;
      positionPlayhead();
    });

    /* --- popup de easing --- */
    function showKfPopup() {
      if (!S.selKf) return hideKfPopup();
      const ks = keysOf(S.selKf.id, S.selKf.prop); if (!ks || !ks[S.selKf.idx]) return hideKfPopup();
      const k = ks[S.selKf.idx];
      const kfEl = $(`#tTracks .kf.selected`);
      const pop = $('#kfEasing');
      pop.classList.add('open');
      if (kfEl) {
        const r = kfEl.getBoundingClientRect();
        const popW = pop.offsetWidth || 260;
        const popH = pop.offsetHeight || 42;
        let left = r.right + 12;
        if (left + popW > window.innerWidth - 10) {
          left = Math.max(10, r.left - popW - 12);
        }
        let top = r.top + (r.height / 2) - (popH / 2);
        top = Math.max(10, Math.min(window.innerHeight - popH - 10, top));
        pop.style.left = left + 'px';
        pop.style.top = top + 'px';
      }
      $('#kfEasingSel').value = (k.ease && k.ease.cb) ? 'custom' : (k.ease || 'linear');
      $('#kfTime').value = k.t.toFixed(2);
      drawCurveEd();
    }
    function hideKfPopup() { $('#kfEasing').classList.remove('open'); }
    $('#kfEasingSel').onchange = e => {
      if (!S.selKf) return;
      const k = keysOf(S.selKf.id, S.selKf.prop)[S.selKf.idx];
      if (!k) return;
      snapshot();
      if (e.target.value === 'custom') { k.ease = { cb: [0.5, 0, 0.5, 1] }; }
      else k.ease = e.target.value;
      drawCurveEd(); applyFrame(S.T);
    };
    $('#kfTime').onchange = e => {
      if (!S.selKf) return;
      const ks = keysOf(S.selKf.id, S.selKf.prop); const k = ks[S.selKf.idx];
      if (k) { snapshot(); k.t = Math.max(0, +e.target.value || 0); ks.sort((a, b) => a.t - b.t); S.selKf.idx = ks.indexOf(k); renderTimeline(); applyFrame(S.T); showKfPopup(); }
    };
    function deleteSelKf() {
      if (!S.selKf) return;
      const l = getLayer(S.selKf.id); if (!l) return;
      snapshot();
      const cur = valAt(l, S.selKf.prop, S.T);
      removeKey(l, S.selKf.prop, S.selKf.idx);
      if (!keysOf(l.id, S.selKf.prop)) setBase(l, S.selKf.prop, cur);
      S.selKf = null; hideKfPopup();
      refreshPanels(); applyFrame(S.T);
    }
    $('#kfDelete').onclick = deleteSelKf;

    /* --- reproducción --- */
    let rafId = null, lastTs = 0;
    function togglePlay() { S.playing ? stopPlay() : startPlay(); }
    function startPlay() {
      S.playing = true; $('#btnPlay').textContent = '⏸'; $('#btnPlay').classList.add('active');
      if (S.T >= doc.dur) S.T = 0;
      lastTs = performance.now();
      const tick = ts => {
        if (!S.playing) return;
        const dt = (ts - lastTs) / 1000 * (S.speed || 1); lastTs = ts;
        let t = S.T + dt;
        const useAB = S.abA != null && S.abB != null && S.abB > S.abA;
        const a = useAB ? S.abA : 0, b = useAB ? Math.min(S.abB, doc.dur) : doc.dur;
        if (t >= b) {
          if (S.loop || useAB) t = a + (t - b) % ((b - a) || 1e-9);
          else { setTime(doc.dur); stopPlay(); return; }
        }
        S.T = t; applyFrame(t); positionPlayhead();
        rafId = requestAnimationFrame(tick);
      };
      if (S.abA != null && S.abB != null && (S.T < S.abA || S.T >= S.abB)) S.T = S.abA;
      rafId = requestAnimationFrame(tick);
    }
    function stopPlay() {
      S.playing = false; $('#btnPlay').textContent = '▶'; $('#btnPlay').classList.remove('active');
      if (rafId) cancelAnimationFrame(rafId);
      renderProps();
    }
    $('#btnPlay').onclick = togglePlay;
    $('#btnToStart').onclick = () => setTime(0);
    $('#btnLoop').onclick = function () { S.loop = !S.loop; this.style.opacity = S.loop ? 1 : .4; };
    $('#speedSel').onchange = e => { S.speed = +e.target.value || 1; };
    function updateTlZoomHud() {
      const el = $('#tlZoomPct');
      if (el) el.textContent = Math.round((PPS / 100) * 100) + '%';
    }
    function tlZoom(f) {
      const w = $('#tTracksWrap'), mid = (w.scrollLeft + w.clientWidth / 2 - TPAD) / PPS;
      PPS = clamp(Math.round(PPS * f), 18, 800);
      renderTimeline();
      w.scrollLeft = Math.max(0, mid * PPS + TPAD - w.clientWidth / 2);
      positionPlayhead();
      updateTlZoomHud();
    }
    function tlZoomAt(f, clientX) {
      const w = $('#tTracksWrap');
      const r = w.getBoundingClientRect();
      const mouseX = (clientX != null) ? (clientX - r.left + w.scrollLeft) : (w.scrollLeft + w.clientWidth / 2);
      const timeAtMouse = Math.max(0, (mouseX - TPAD) / PPS);
      const oldPPS = PPS;
      PPS = clamp(Math.round(PPS * f), 18, 800);
      if (PPS === oldPPS) return;
      renderTimeline();
      if (clientX != null) {
        w.scrollLeft = Math.max(0, TPAD + timeAtMouse * PPS - (clientX - r.left));
      } else {
        w.scrollLeft = Math.max(0, TPAD + timeAtMouse * PPS - w.clientWidth / 2);
      }
      positionPlayhead();
      updateTlZoomHud();
    }
    function tlZoomFit() {
      const w = $('#tTracksWrap');
      const availW = w.clientWidth - TPAD - 70;
      if (availW > 50 && doc.dur > 0) {
        PPS = clamp(Math.floor(availW / doc.dur), 18, 800);
        renderTimeline();
        w.scrollLeft = 0;
        positionPlayhead();
        updateTlZoomHud();
      }
    }
    $('#tlZoomIn').onclick = () => tlZoom(1.25);
    $('#tlZoomOut').onclick = () => tlZoom(1 / 1.25);
    const btnTlFit = $('#tlZoomFit');
    if (btnTlFit) btnTlFit.onclick = tlZoomFit;

    /* --- altura del timeline (arrastrable y recordada) --- */
    (function () {
      const h = $('#tlResize'); if (!h) return;
      let drag = null;
      h.addEventListener('pointerdown', e => {
        const rows = getComputedStyle(document.body).gridTemplateRows.split(' ');
        drag = { y: e.clientY, h: parseFloat(rows[2]) || 240 };
        h.setPointerCapture(e.pointerId); e.preventDefault();
      });
      h.addEventListener('pointermove', e => {
        if (!drag) return;
        const nh = clamp(drag.h + (drag.y - e.clientY), 140, 600);
        document.body.style.gridTemplateRows = `44px 1fr ${nh}px`;
      });
      h.addEventListener('pointerup', e => {
        if (!drag) return;
        const rows = getComputedStyle(document.body).gridTemplateRows.split(' ');
        saveUI({ tlh: parseFloat(rows[2]) || 240 });
        drag = null; updateView(); renderTimeline();
      });
    })();

    /* --- editor de curvas cubic-bezier --- */
    function selKfObj() {
      if (!S.selKf) return null;
      const ks = keysOf(S.selKf.id, S.selKf.prop);
      return ks ? ks[S.selKf.idx] : null;
    }
    function drawCurveEd() {
      const k = selKfObj(), svg = $('#curveSvg');
      if (!k || !(k.ease && k.ease.cb)) { $('#curveEd').style.display = 'none'; return; }
      $('#curveEd').style.display = 'block';
      const [x1, y1, x2, y2] = k.ease.cb;
      const W = 180, H = 140, PX = 18, PY = 30;
      const X = v => PX + v * (W - 2 * PX), Y = v => H - PY - v * (H - 2 * PY);
      svg.innerHTML = `
    <rect x="${PX}" y="${PY}" width="${W - 2 * PX}" height="${H - 2 * PY}" fill="none" stroke="#33363f"/>

      const fps = clamp(parseInt(prompt('Velocidad de fotogramas (FPS recomendado: 20):', '20')) || 20, 5, 50);
      const scale = clamp(parseFloat(prompt('Escala de exportación (1 = tamaño real, 0.5 = más ligero):', '1')) || 1, 0.1, 4);
      const withBg = confirm('¿Incluir el color de fondo del lienzo en el GIF?\nAceptar = con fondo (' + doc.bg + ') · Cancelar = transparente');

      const dur = Math.max(0.1, doc.dur || 3);
      const totalFrames = Math.max(1, Math.round(dur * fps));
      const delayCs = Math.max(2, Math.round(100 / fps));
      const W = Math.round(doc.w * scale), H = Math.round(doc.h * scale);

      const enc = new SimpleGifEncoder(W, H, { loop: 0 });
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      showHint(`Preparando exportación a GIF: ${totalFrames} fotogramas...`);
      await new Promise(r => setTimeout(r, 20));

      for (let i = 0; i < totalFrames; i++) {
        const T = i / fps;
        let s = svgOpen();
        if (withBg) s += `<rect width="${doc.w}" height="${doc.h}" fill="${doc.bg}"/>`;
        if (doc.defs) s += `<defs>${doc.defs}</defs>`;
        for (const l of doc.layers) { if (shouldExportLayer(l)) s += staticLayerStr(l, T); }
        s += '</svg>';

        await new Promise((resolve, reject) => {
          const url = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml' }));
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(img, 0, 0, W, H);
            URL.revokeObjectURL(url);
            const imgData = ctx.getImageData(0, 0, W, H);
            enc.addFrame(imgData.data, delayCs, !withBg);
            resolve();
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Error en fotograma ' + (i + 1)));
          };
          img.src = url;
        });

        if ((i + 1) % 5 === 0 || i === totalFrames - 1) {
          showHint(`Exportando GIF: fotograma ${i + 1} de ${totalFrames} (${Math.round((i + 1) / totalFrames * 100)}%)...`);
          await new Promise(r => setTimeout(r, 0));
        }
      }

      showHint('Codificando archivo GIF compatible con PowerPoint...');
      await new Promise(r => setTimeout(r, 20));
      const gifBytes = enc.finish();
      const blob = new Blob([gifBytes], { type: 'image/gif' });
      download('animacion.gif', blob, 'image/gif');
      showHint(`¡GIF exportado! ${totalFrames} cuadros (${(gifBytes.length / 1024).toFixed(1)} KB) — compatible con PowerPoint`);
    }

    /* ---- Proyecto ---- */
    function saveProject() {
      download('proyecto.vectormotion.json', projectJSON(), 'application/json');
    }
    function openProject() { $('#fileProject').click(); }
    $('#fileProject').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then(txt => {
        const s = JSON.parse(txt);
        if (!s.doc) { alert('Archivo de proyecto no válido.'); return; }
        snapshot();
        loadProjectData(s);
      }).catch(() => alert('No se pudo leer el proyecto.'));
      e.target.value = '';
    };

    /* ---- Código GSAP (para desarrolladores que usan GSAP) ---- */
    const GSAP_EASE = {
      linear: 'none', easeIn: 'power1.in', easeOut: 'power1.out', easeInOut: 'power1.inOut',
      step: 'steps(1)', expoIn: 'expo.in', expoOut: 'expo.out', backIn: 'back.in(1.7)', backOut: 'back.out(1.7)',
      elasticIn: 'elastic.in(1,0.3)', elasticOut: 'elastic.out(1,0.3)', bounceIn: 'bounce.in', bounceOut: 'bounce.out'
    };
    const GSAP_PROP = { tx: 'x', ty: 'y', rot: 'rotation', sx: 'scaleX', sy: 'scaleY', skx: 'skewX', sky: 'skewY', opacity: 'opacity' };
    const gsapEase = e => (e && e.cb) ? 'power2.inOut' : (GSAP_EASE[e] || 'none');
    function exportGSAP() {
      let body = '', i = 0, needMotion = false;
      const lines = [];
      for (const l of doc.layers) {
        if (!shouldExportLayer(l)) continue;
        const la = anims[l.id] || {};
        const hasMotion = !!(l.motion && l.motion.d);
        const animated = Object.keys(la).length > 0 || hasMotion;
        const gid = 'vm' + (i++);
        if (!animated) { body += staticLayerStr(l, 0); continue; }
        body += `<g id="${gid}">${layerMarkupAt(l, 0, !!la.fill)}</g>`;
        const [cx, cy] = ctr(l); const p0 = effProps(l, 0);
        lines.push(`// --- ${l.name} ---`);
        lines.push(`const ${gid}=document.getElementById("${gid}");`);
        lines.push(`gsap.set(${gid},{svgOrigin:"${fmt(cx)} ${fmt(cy)}",x:${fmt(p0.tx)},y:${fmt(p0.ty)},rotation:${fmt(p0.rot)},scaleX:${fmt(p0.sx)},scaleY:${fmt(p0.sy)},skewX:${fmt(p0.skx)},skewY:${fmt(p0.sky)},opacity:${fmt(p0.opacity)}});`);
        for (const prop in la) {
          if (prop === 'mp') continue;
          if (prop === 'geom') { lines.push(`// Morphing de geometría: no incluido en la exportación GSAP (usa la exportación JS o CSS)`); continue; }
          const ks = la[prop].filter(k => k.t <= doc.dur);
          if (!ks.length) continue;
          if (prop === 'draw') {
            lines.push(`gsap.set(${gid}.firstElementChild,{attr:{pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':${fmt(1 - clamp(ks[0].v, 0, 100) / 100)}}});`);
            for (let j = 0; j < ks.length - 1; j++) {
              const a = ks[j], b = ks[j + 1];
              lines.push(`tl.to(${gid}.firstElementChild,{duration:${fmt(b.t - a.t)},attr:{'stroke-dashoffset':${fmt(1 - clamp(b.v, 0, 100) / 100)}},ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
            }
            continue;
          }
          if (prop === 'fill') {
            const attr = l.type === 'line' ? 'stroke' : 'fill';
            lines.push(`gsap.set(${gid}.firstElementChild,{${attr}:"${ks[0].v}"});`);
            for (let j = 0; j < ks.length - 1; j++) {
              const a = ks[j], b = ks[j + 1];
              lines.push(`tl.to(${gid}.firstElementChild,{duration:${fmt(b.t - a.t)},${attr}:"${b.v}",ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
            }
            continue;
          }
          const gp = GSAP_PROP[prop]; if (!gp) continue;
          lines.push(`gsap.set(${gid},{${gp}:${fmt(ks[0].v)}});`);
          for (let j = 0; j < ks.length - 1; j++) {
            const a = ks[j], b = ks[j + 1];
            lines.push(`tl.to(${gid},{duration:${fmt(b.t - a.t)},${gp}:${fmt(b.v)},ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
          }
        }
        if (hasMotion) {
          needMotion = true;
          const mk = (la.mp || []).filter(k => k.t <= doc.dur);
          lines.push(`// Trayectoria de movimiento (nota: motionPath controla x/y; evita combinarla con tweens de x/y en el mismo tramo)`);
          if (mk.length > 1) {
            for (let j = 0; j < mk.length - 1; j++) {
              const a = mk[j], b = mk[j + 1];
              lines.push(`tl.to(${gid},{duration:${fmt(b.t - a.t)},motionPath:{path:"${l.motion.d}",start:${fmt(clamp(a.v, 0, 100) / 100)},end:${fmt(clamp(b.v, 0, 100) / 100)},autoRotate:${!!l.motion.orient},alignOrigin:[0.5,0.5]},ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
            }
          } else {
            lines.push(`tl.to(${gid},{duration:${fmt(doc.dur)},motionPath:{path:"${l.motion.d}",autoRotate:${!!l.motion.orient},alignOrigin:[0.5,0.5]},ease:"none"},0);`);
          }
        }
      }
      const html = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Animación GSAP — VectorMotion</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#16171c}</style>
</head>
<body>
${svgOpen()}${googleFontsExportDefs()}${doc.defs ? `<defs>${doc.defs}</defs>` : ''}${body}</svg>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"><\/script>
${needMotion ? `<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/MotionPathPlugin.min.js"><\/script>\n` : ''}<script>
${needMotion ? 'gsap.registerPlugin(MotionPathPlugin);\n' : ''}// Timeline generada por VectorMotion — duración ${doc.dur}s, bucle infinito
const tl=gsap.timeline({repeat:-1});
${lines.join('\n')}
<\/script>
</body>
</html>`;
      download('animacion-gsap.html', html, 'text/html');
    }

    /* ---- Menús superiores: Importar y Exportar ---- */
    $('#btnImport').onclick = e => { e.stopPropagation(); const m = $('#importMenu'); const isOpen = m.classList.contains('open'); closeTopMenus(); if (!isOpen) m.classList.add('open'); };
    $('#btnExport').onclick = e => { e.stopPropagation(); const m = $('#exportMenu'); const isOpen = m.classList.contains('open'); closeTopMenus(); if (!isOpen) m.classList.add('open'); };
    window.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeTopMenus(); });

    $('#importMenu').addEventListener('click', e => {
      const b = e.target.closest('[data-import-type]'); if (!b) return;
      closeTopMenus();
      const type = b.dataset.importType;
      if (type === 'project') {
        openProject();
      } else if (type === 'vector') {
        const inp = $('#fileImport');
        inp.accept = '.svg,.json,.lottie';
        inp.click();
      } else if (type === 'bitmap') {
        const inp = $('#fileImportImage');
        inp.accept = '.png,.jpg,.jpeg,.webp,.gif,.bmp,image/*';
        inp.click();
      } else if (type === 'all') {
        const inp = $('#fileImport');
        inp.accept = '.svg,.json,.lottie,.png,.jpg,.jpeg,.webp,.gif,.bmp,image/*,application/json';
        inp.click();
      }
    });

    $('#exportMenu').addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.export; if (!a) return;
      closeTopMenus();
      const acts = { svg: exportStatic, css: exportCSS, smil: exportSMIL, js: exportJS, gsap: exportGSAP, png: exportPNG, gif: exportGIF, project: saveProject };
      if (acts[a]) acts[a]();
    });

    /* ================================================================
       Inicio
       ================================================================ */
    setTool('select');
    computeDocDur();
    refresh();
    zoomFit();
    loadUI();
    tryRestoreBackup();
    window.addEventListener('resize', () => updateView());
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => { updateView(); }).observe(area);
    }
    showHint('Dibuja (R/E/L/G/P/T), importa cualquier SVG o imagen de calco, anima con keyframes y trayectorias — exportación libre');
  </script>
</body>

</html>
