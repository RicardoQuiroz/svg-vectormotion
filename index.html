function toggleKey(l,prop){
  snapshot();
  const ks=keysOf(l.id,prop);
  const idx=ks?ks.findIndex(k=>Math.abs(k.t-S.T)<1e-4):-1;
  if(idx>=0){
    const cur=valAt(l,prop,S.T);
    removeKey(l,prop,idx);
    if(!keysOf(l.id,prop)) setBase(l,prop,cur);
  } else {
    setKeyAt(l,prop,S.T,valAt(l,prop,S.T));
  }
  refreshPanels(); applyFrame(S.T);
}

$$('.toolbtn[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function setTool(t){
  if(S.penActive) finishPen(false);
  if(t!=='node') S.nodeEdit=null;
  S.tool=t;
  $$('.toolbtn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  area.className=''; area.classList.add('tool-'+t);
  if(t==='node'){

    if(l&&!S.nodeEdit) enterNodeEdit(l);
  }
  drawOverlay();
  const hints={pen:'Pluma: clic añade nodos · clic y ARRASTRA crea curvas · clic en el 1er punto cierra · Enter termina · Esc cancela',
    route:'Ruta de animación: con el objeto seleccionado, arrastra para dibujar su trayectoria a mano alzada',
    node:'Nodos: arrastra anclas y manejadores · doble clic en ancla = esquina/curva · doble clic en el trazado inserta nodo · Alt rompe simetría · Supr elimina',
    rect:'Arrastra para dibujar un rectángulo (Shift = cuadrado)',
    ellipse:'Arrastra para dibujar una elipse (Shift = círculo)',
    polygon:'Arrastra desde el centro para crear un polígono (cambia lados/estrella en Propiedades)',
    line:'Arrastra para dibujar una línea', text:'Haz clic donde quieras colocar el texto',
    hand:'Arrastra para mover la vista'};
  showHint(hints[t]||'');
}
let hintTimer;
function showHint(msg){
  const h=$('#hint');
  if(!msg){h.classList.remove('show');return;}
  h.textContent=msg; h.classList.add('show');
  clearTimeout(hintTimer); hintTimer=setTimeout(()=>h.classList.remove('show'),4500);
}

let gesture=null;
area.addEventListener('pointerdown',e=>{
  if(e.target.closest('#zoomHud'))return;
  const pt=svgPt(e);
  if(e.button===1 || spaceDown || S.tool==='hand'){
    gesture={kind:'pan',sx:e.clientX,sy:e.clientY,px:S.panX,py:S.panY};
    area.classList.add('panning'); area.setPointerCapture(e.pointerId); e.preventDefault(); return;
  }
  if(e.button!==0) return;
  area.setPointerCapture(e.pointerId);

  if(S.tool==='node'){
    const ne=S.nodeEdit;
    const nh=e.target.closest('[data-nh]');
    const nd=e.target.closest('[data-nd]');
    if(ne&&nh){
      const [si,ni,which]=nh.dataset.nh.split(':');
      snapshot();
      ne.sel={si:+si,ni:+ni};
      gesture={kind:'nhandle',si:+si,ni:+ni,which};
      drawOverlay();
      return;
    }
    if(ne&&nd){
      const [si,ni]=nd.dataset.nd.split(':').map(Number);
      ne.sel={si,ni};
      if(e.detail>=2){ toggleNodeSmooth(si,ni); return; }
      snapshot();
      const q=neMatrix().inverse().transformPoint(new DOMPoint(pt.x,pt.y));
      const n=ne.subs[si].nodes[ni];
      gesture={kind:'nanchor',si,ni,ox:q.x-n.x,oy:q.y-n.y,moved:false};
      drawOverlay();
      return;
    }
    if(ne&&ne.routeId&&e.target.dataset&&e.target.dataset.rpath){
      if(e.detail>=2) insertNodeAt(pt);
      return;
    }
    const g=e.target.closest('g.layer');
    if(g){
      const l2=getLayer(g.dataset.id);
      if(ne&&!ne.routeId&&l2&&l2.id===ne.id){ if(e.detail>=2) insertNodeAt(pt); return; }
      if(l2&&!l2.locked) enterNodeEdit(l2);
    }
    return;
  }
  if(S.tool==='select'){
    const hEl=e.target.closest('[data-handle]');
    const hd=hEl&&hEl.dataset.handle;
    const l=selLayer();
    if(hd&&l){
      snapshot();
      const p=effProps(l,S.T);
      if(hd==='rotate'){
        const [cx,cy]=ctr(l);
        const cw=layerMatrix(l,S.T).transformPoint(new DOMPoint(cx,cy));
        gesture={kind:'rotate',l,cw,rot0:p.rot,a0:Math.atan2(pt.y-cw.y,pt.x-cw.x)*180/Math.PI};
      } else if(hd==='origin'){
        gesture={kind:'origin',l,mi:layerMatrix(l,S.T).inverse()};
      } else {
        const ci=+hEl.dataset.corner, bb=l._bb;
        const [cx,cy]=ctr(l);
        const corner=[[bb.x,bb.y],[bb.x+bb.width,bb.y],[bb.x+bb.width,bb.y+bb.height],[bb.x,bb.y+bb.height]][ci];
        let mNoScale=new DOMMatrix();
        const mm=motionAt(l,S.T);
        if(mm){ mNoScale=mNoScale.translate(mm.x-cx,mm.y-cy); if(mm.ang)mNoScale=mNoScale.translate(cx,cy).rotate(mm.ang).translate(-cx,-cy); }
        mNoScale=mNoScale.translate(p.tx,p.ty).translate(cx,cy).rotate(p.rot);
        gesture={kind:'scale',l,m1i:mNoScale.inverse(),d0:[corner[0]-cx,corner[1]-cy],sx0:p.sx,sy0:p.sy};
      }
      return;
    }
    const g=e.target.closest('g.layer');
    if(g){
      const l2=getLayer(g.dataset.id);
      if(l2&&!l2.locked){
        if(e.shiftKey||e.ctrlKey||e.metaKey) selectLayer(l2.id,true);
        else if(!S.selSet.has(l2.id)){ selectOnly(l2.id); refreshPanels(); drawOverlay(); }
        else { S.sel=l2.id; refreshPanels(); drawOverlay(); }
        snapshot();
        const starts=selLayers().filter(x=>!x.locked).map(x=>{
          const px=effProps(x,S.T);
          return {l:x,tx0:px.tx,ty0:px.ty};
        });
        gesture={kind:'move',starts,sx:pt.x,sy:pt.y,moved:false};
      }
      return;
    }
    if(S.sel){ selectOnly(null); refreshPanels(); drawOverlay(); }
    return;
  }
  if(['rect','ellipse','line','polygon'].includes(S.tool)){
    snapshot();
    const sp=snapPt(pt);
    gesture={kind:'draw',tool:S.tool,sx:sp.x,sy:sp.y,l:null};
    return;
  }
  if(S.tool==='text'){
    const txt=prompt('Texto:','Hola');
    if(txt!=null&&txt!==''){
      snapshot();
      const sp=snapPt(pt);
      const l=addLayer('text',{x:sp.x,y:sp.y,text:txt,fs:28,ff:'sans-serif',fill:'#7c5cff'},'Texto');
      selectOnly(l.id); setTool('select'); refresh();
    }
    return;
  }
  if(S.tool==='route'){
    if(!S.selSet.size){ showHint('Selecciona primero el objeto que seguirá la ruta'); }
    gesture={kind:'routedraw',pts:[[pt.x,pt.y]]};
    return;
  }
  if(S.tool==='pen'){
    const sp=snapPt(pt);
    if(S.penActive&&S.penPts.length>2){
      const f=S.penPts[0];
      if(Math.hypot(sp.x-f.x,sp.y-f.y)<8/S.zoom){ finishPen(true); return; }
    }
    S.penActive=true;
    const node={x:sp.x,y:sp.y,hin:null,hout:null,smooth:true};
    S.penPts.push(node);
    gesture={kind:'penpull',node};
    drawOverlay();
    return;
  }
});
area.addEventListener('pointermove',e=>{
  if(!gesture)return;
  const pt=svgPt(e);
  switch(gesture.kind){
    case 'pan':
      S.panX=gesture.px+(e.clientX-gesture.sx); S.panY=gesture.py+(e.clientY-gesture.sy);
      updateView(); break;
    case 'move':{
      const dx=pt.x-gesture.sx, dy=pt.y-gesture.sy;
      gesture.moved=true;
      for(const s of gesture.starts){
        writeProp(s.l,'tx',snapV(s.tx0+dx)); writeProp(s.l,'ty',snapV(s.ty0+dy));
      }
      applyFrame(S.T); break;
    }
    case 'rotate':{
      const g=gesture, ang=Math.atan2(pt.y-g.cw.y,pt.x-g.cw.x)*180/Math.PI;
      let r=g.rot0+(ang-g.a0);
      if(e.shiftKey) r=Math.round(r/15)*15;
      writeProp(g.l,'rot',r); applyFrame(S.T); break;
    }
    case 'scale':{
      const g=gesture, q=g.m1i.transformPoint(new DOMPoint(pt.x,pt.y));
      let nsx=Math.abs(g.d0[0])>0.01? q.x/g.d0[0] : g.sx0;
      let nsy=Math.abs(g.d0[1])>0.01? q.y/g.d0[1] : g.sy0;
      if(e.shiftKey){ const u=Math.max(Math.abs(nsx),Math.abs(nsy)); nsx=Math.sign(nsx||1)*u; nsy=Math.sign(nsy||1)*u; }
      writeProp(g.l,'sx',nsx); writeProp(g.l,'sy',nsy); applyFrame(S.T); break;
    }
    case 'origin':{
      const q=gesture.mi.transformPoint(new DOMPoint(pt.x,pt.y));
      gesture.l.origin={x:snapV(q.x),y:snapV(q.y)};
      drawOverlay(); break;
    }
    case 'nanchor':{
      const ne=S.nodeEdit; if(!ne)break;
      const q=neMatrix().inverse().transformPoint(new DOMPoint(pt.x,pt.y));
      const n=ne.subs[gesture.si].nodes[gesture.ni];
      const nx=snapV(q.x-gesture.ox), ny=snapV(q.y-gesture.oy);
      const dx=nx-n.x, dy=ny-n.y;
      if(!dx&&!dy)break;
      gesture.moved=true;
      n.x=nx; n.y=ny;
      if(n.hin){n.hin.x+=dx;n.hin.y+=dy;}
      if(n.hout){n.hout.x+=dx;n.hout.y+=dy;}
      commitNodes(); break;
    }
    case 'nhandle':{
      const ne=S.nodeEdit; if(!ne)break;
      const q=neMatrix().inverse().transformPoint(new DOMPoint(pt.x,pt.y));
      const n=ne.subs[gesture.si].nodes[gesture.ni];
      const w=gesture.which, o=w==='hin'?'hout':'hin';
      n[w]={x:q.x,y:q.y};
      if(e.altKey) n.smooth=false;
      if(n.smooth&&n[o]){
        const vx=n.x-q.x, vy=n.y-q.y;
        const dd=Math.hypot(vx,vy)||1;
        const len=Math.hypot(n[o].x-n.x,n[o].y-n.y)||dd;
        n[o]={x:n.x+vx/dd*len, y:n.y+vy/dd*len};
      }
      commitNodes(); break;
    }
    case 'routedraw':{
      const ps=gesture.pts, q=ps[ps.length-1];
      if(Math.hypot(pt.x-q[0],pt.y-q[1])>3/S.zoom){ ps.push([pt.x,pt.y]); drawOverlay(); }
      break;
    }
    case 'penpull':{
      const n=gesture.node;
      if(Math.hypot(pt.x-n.x,pt.y-n.y)>2/S.zoom){
        n.hout={x:pt.x,y:pt.y};
        n.hin={x:2*n.x-pt.x,y:2*n.y-pt.y};
        drawOverlay();
      }
      break;
    }
    case 'draw':{
      const g=gesture; const sp=snapPt(pt);
      let x1=g.sx,y1=g.sy,x2=sp.x,y2=sp.y;
      if(e.shiftKey&&g.tool!=='line'&&g.tool!=='polygon'){ const s=Math.max(Math.abs(x2-x1),Math.abs(y2-y1)); x2=x1+Math.sign(x2-x1||1)*s; y2=y1+Math.sign(y2-y1||1)*s; }
      if(!g.l){
        if(Math.hypot(x2-x1,y2-y1)<2) break;
        if(g.tool==='rect') g.l=addLayer('rect',{x:0,y:0,w:0,h:0,rx:0,fill:'#7c5cff',stroke:'',sw:1},'Rectángulo');
        else if(g.tool==='ellipse') g.l=addLayer('ellipse',{cx:0,cy:0,rx:0,ry:0,fill:'#00c2a8',stroke:'',sw:1},'Elipse');
        else if(g.tool==='polygon') g.l=addLayer('polygon',{cx:g.sx,cy:g.sy,r:0,sides:5,star:false,ir:0.5,fill:'#ffb454',stroke:'',sw:1},'Polígono');
        else g.l=addLayer('line',{x1:0,y1:0,x2:0,y2:0,stroke:'#ff5470',sw:3},'Línea');
        selectOnly(g.l.id);
      }
      const a=g.l.attrs;
      if(g.tool==='rect'){ a.x=Math.min(x1,x2); a.y=Math.min(y1,y2); a.w=Math.abs(x2-x1); a.h=Math.abs(y2-y1); }
      else if(g.tool==='ellipse'){ a.cx=(x1+x2)/2; a.cy=(y1+y2)/2; a.rx=Math.abs(x2-x1)/2; a.ry=Math.abs(y2-y1)/2; }
      else if(g.tool==='polygon'){ a.r=Math.hypot(x2-x1,y2-y1); }
      else { a.x1=x1; a.y1=y1; a.x2=x2; a.y2=y2; }
      render(); break;
    }
  }
});
area.addEventListener('pointerup',e=>{
  if(!gesture)return;
  if(gesture.kind==='pan') area.classList.remove('panning');
  if(gesture.kind==='draw'){
    if(gesture.l){ setTool('select'); refresh(); }
    else undoStack.pop();
  }
  if(gesture.kind==='routedraw'){
    const pts=simplifyPts(gesture.pts,6/S.zoom);
    if(pts.length>=2){
      snapshot();
      const r=addRoute(smoothPtsToD(pts));
      if(S.selSet.size) assignRoute(r,selLayers());
      renderRoutesPanel();
      setTool('select');
    }
    drawOverlay();
  }
  if(['move','rotate','scale','origin'].includes(gesture.kind)){ refreshPanels(); renderTimeline(); }
  if(['nanchor','nhandle'].includes(gesture.kind)) refreshPanels();
  gesture=null;
});
function finishPen(close){
  if(S.penPts.length>=2){
    snapshot();
    const d=subToD({nodes:S.penPts,closed:!!close});
    const l=addLayer('path',{d,fill:close?'#ffb454':'none',stroke:'#d6d8de',sw:2},'Trazado');
    selectOnly(l.id);
  }
  S.penPts=[]; S.penActive=false;
  setTool('select'); refresh();
}

/* ---------------- Teclado ---------------- */
let spaceDown=false;
window.addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'){
    if(e.key==='Enter'&&S.penActive){finishPen(false);}
    return;
  }
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) togglePlay(); spaceDown=true; return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='g'){ e.preventDefault(); e.shiftKey?ungroupSelection():groupSelection(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveNow(!fileHandle); return; }
  switch(e.key){
    case 'v':case 'V':setTool('select');break;
    case 'a':case 'A':setTool('node');break;
    case 'r':case 'R':setTool('rect');break;
    case 'e':case 'E':setTool('ellipse');break;
    case 'l':case 'L':setTool('line');break;
    case 'g':case 'G':setTool('polygon');break;
    case 'p':case 'P':setTool('pen');break;
    case 't':case 'T':setTool('text');break;
    case 'h':case 'H':setTool('hand');break;
    case 'm':case 'M':setTool('route');break;
    case 'Enter': if(S.penActive)finishPen(false); break;
    case 'Escape':
      if(S.penActive){S.penPts=[];S.penActive=false;drawOverlay();}
      else if(S.tool==='node'&&S.nodeEdit){ setTool('select'); }
      else if(S.selKf){S.selKf=null;hideKfPopup();renderTimeline();}
      else{selectOnly(null);refreshPanels();drawOverlay();}
      break;
    case 'Delete':case 'Backspace':
      if(S.tool==='node'&&S.nodeEdit&&S.nodeEdit.sel){ deleteSelNode(); }
      else if(S.selKf){ deleteSelKf(); }
      else deleteSelected();
      break;
    case 'ArrowUp':case 'ArrowDown':case 'ArrowLeft':case 'ArrowRight':{
      const ls=selLayers(); if(!ls.length)break;
      e.preventDefault(); editSnap();
      const d=e.shiftKey?10:1;
      for(const l of ls){
        const p=effProps(l,S.T);
        if(e.key==='ArrowUp')writeProp(l,'ty',p.ty-d);
        if(e.key==='ArrowDown')writeProp(l,'ty',p.ty+d);
        if(e.key==='ArrowLeft')writeProp(l,'tx',p.tx-d);
        if(e.key==='ArrowRight')writeProp(l,'tx',p.tx+d);
      }
      applyFrame(S.T); refreshPanels(); renderTimeline();
      break;
    }
  }
});
window.addEventListener('keyup',e=>{ if(e.code==='Space')spaceDown=false; });

/* ---------------- Importación SVG (sin restricciones) ---------------- */
$('#btnImport').onclick=()=>$('#fileImport').click();
function importFile(f){
  return f.text().then(txt=>{
    const t=txt.trim();
    if(t.startsWith('PK')){ alert(`${f.name}: es un dotLottie (.lottie, un ZIP). Descomprímelo y usa el .json interior.`); return; }
    if(t.startsWith('{')) importLottie(txt,f.name);
    else importSVG(txt,f.name);
  }).catch(()=>alert('No se pudo leer '+f.name));
}
$('#fileImport').onchange=async e=>{
  for(const f of [...e.target.files]) await importFile(f);
  e.target.value='';
};
area.addEventListener('dragover',e=>e.preventDefault());
area.addEventListener('drop',async e=>{
  e.preventDefault();
  for(const f of [...e.dataTransfer.files]) if(/\.(svg|json)$/i.test(f.name)) await importFile(f);
});
function importSVG(txt,fname){
  const p=new DOMParser().parseFromString(txt,'image/svg+xml');
  const err=p.querySelector('parsererror');
  const root=p.documentElement;
  if(err||root.nodeName.toLowerCase()!=='svg'){ alert('El archivo no es un SVG válido.'); return; }
  snapshot();
  let vb=root.getAttribute('viewBox'), ox=0, oy=0, iw=0, ih=0;
  if(vb){ const v=vb.trim().split(/[\s,]+/).map(Number); ox=v[0]; oy=v[1]; iw=v[2]; ih=v[3]; }
  else { iw=parseFloat(root.getAttribute('width'))||0; ih=parseFloat(root.getAttribute('height'))||0; }
  if(!doc.layers.length && iw&&ih){ doc.w=Math.round(iw); doc.h=Math.round(ih); }
  root.querySelectorAll(':scope > defs, :scope > style').forEach(n=>{
    doc.defs+=(n.nodeName.toLowerCase()==='defs')?n.innerHTML:n.outerHTML;
    n.remove();
  });
  const skip=new Set(['title','desc','metadata','script']);
  let n=0;
  [...root.children].forEach(ch=>{
    if(skip.has(ch.nodeName.toLowerCase()))return;
    if(ox||oy) ch.setAttribute('transform',`translate(${-ox} ${-oy}) `+(ch.getAttribute('transform')||''));
    const l=addLayer('raw',{},(fname?fname.replace(/\.svg$/i,''):'importado')+(n?' '+(n+1):''));
    l.raw=ch.outerHTML; n++;
    selectOnly(l.id);
  });
  if(!n){ alert('El SVG no contiene elementos visibles.'); }
  refresh(); zoomFit();
  showHint(`Importadas ${n} capa(s) desde ${fname||'SVG'} — sin restricciones`);
}


/* ---------------- Importación Lottie (subconjunto de capas de formas) ---------------- */
function importLottie(txt,fname){
  let j;
  try{ j=JSON.parse(txt); }catch(e){ alert('El archivo no es JSON válido.'); return; }
  if(!Array.isArray(j.layers)){ alert('El JSON no parece una animación Lottie (falta "layers").'); return; }
  snapshot();
  const fr=j.fr||30, ip=j.ip||0, op=(j.op!==undefined?j.op:ip+fr*3);
  if(!doc.layers.length && j.w && j.h){ doc.w=Math.round(j.w); doc.h=Math.round(j.h); }
  doc.dur=Math.max(0.1,+(((op-ip)/fr).toFixed(3)));
  const toT=f=>clamp(+(((f-ip)/fr).toFixed(4)),0,doc.dur);
  const num=v=>Array.isArray(v)?+v[0]:+v;
  const num2=(v,i)=>Array.isArray(v)?+v[i]:+v;
  const isAnim=v=>!!v&&(v.a===1||(Array.isArray(v.k)&&typeof v.k[0]==='object'&&v.k[0]!==null&&v.k[0].t!==undefined));
  const sVal=v=>v==null?null:(isAnim(v)?(v.k[0].s!==undefined?v.k[0].s:v.k[0].e):v.k);
  let warn=0;
  function easeName(k){
    if(k.h) return 'step';
    if(!k.o||!k.i) return 'linear';
    const P=[num(k.o.x),num(k.o.y),num(k.i.x),num(k.i.y)];
    const cands={linear:[0,0,1,1],easeIn:[.42,0,1,1],easeOut:[0,0,.58,1],easeInOut:[.42,0,.58,1],expoIn:[.7,0,.84,0],expoOut:[.16,1,.3,1]};
    let best='linear',bd=1e9;
    for(const n in cands){
      const c=cands[n];
      const d=c.reduce((s2,cv,q)=>s2+(cv-P[q])*(cv-P[q]),0);
      if(d<bd){bd=d;best=n;}
    }
    return best;
  }
  function eachKey(v,cb){
    for(let q=0;q<v.k.length;q++){
      const k=v.k[q];
      let sv=k.s;
      if(sv===undefined){ const pk=v.k[q-1]; if(pk&&pk.e!==undefined)sv=pk.e; else continue; }
      if(k.ti||k.to) warn++; // tangentes espaciales: se interpola en recta
      cb(toT(k.t),sv,easeName(k));
    }
  }
  function addKeys(l,prop,v,map){
    if(v==null)return;
    if(!isAnim(v)){ setBase(l,prop,map(v.k)); return; }
    eachKey(v,(t,sv,e)=>setKeyAt(l,prop,t,map(sv),e));
  }
  function addKeys2v(l,pa,pb,v,map){
    if(v==null)return;
    if(!isAnim(v)){ const mv=map(v.k); setBase(l,pa,mv[0]); setBase(l,pb,mv[1]); return; }
    eachKey(v,(t,sv,e)=>{ const mv=map(sv); setKeyAt(l,pa,t,mv[0],e); setKeyAt(l,pb,t,mv[1],e); });
  }
  function lotColor(c){
    if(!c)return '#7c5cff';
    const k=sVal(c);
    if(!Array.isArray(k))return '#7c5cff';
    return rgbHex([k[0]*255,k[1]*255,k[2]*255]);
  }
  function lottiePathToD(pk,m){
    const V=pk.v||[], I=pk.i||[], O=pk.o||[];
    if(V.length<2)return '';
    const tp=(x,y)=>{ if(!m)return [x,y]; const p=m.transformPoint(new DOMPoint(x,y)); return [p.x,p.y]; };
    const P=V.map(p=>tp(p[0],p[1]));
    const Ci=V.map((p,q)=>tp(p[0]+(I[q]?I[q][0]:0), p[1]+(I[q]?I[q][1]:0)));
    const Co=V.map((p,q)=>tp(p[0]+(O[q]?O[q][0]:0), p[1]+(O[q]?O[q][1]:0)));
    let d=`M${fmt(P[0][0])} ${fmt(P[0][1])}`;
    const n=pk.c?V.length:V.length-1;
    for(let q=0;q<n;q++){
      const r=(q+1)%V.length;
      d+=` C${fmt(Co[q][0])} ${fmt(Co[q][1])} ${fmt(Ci[r][0])} ${fmt(Ci[r][1])} ${fmt(P[r][0])} ${fmt(P[r][1])}`;
    }
    if(pk.c)d+=' Z';
    return d;
  }
  function groupMatrix(tr,m){
    if(!tr)return m;
    if(isAnim(tr.p)||isAnim(tr.s)||isAnim(tr.r)||isAnim(tr.a)) warn++;
    const p=tr.p?sVal(tr.p)||[0,0]:[0,0];
    const a=tr.a?sVal(tr.a)||[0,0]:[0,0];
    const s=tr.s?sVal(tr.s)||[100,100]:[100,100];
    const r=tr.r?num(sVal(tr.r))||0:0;
    return (m||new DOMMatrix()).translate(num2(p,0),num2(p,1)).rotate(r)
      .scale(num2(s,0)/100,num2(s,1)/100).translate(-num2(a,0),-num2(a,1));
  }
  let made=[];
  function bakeOrAdd(type,attrs,nm,m,st2){
    const full={...attrs,fill:st2.fill!==undefined?st2.fill:'#7c5cff',stroke:st2.stroke||'',sw:st2.sw||1};
    if(!m){ made.push(addLayer(type,full,nm)); return; }
    const cmds=shapeToD({type,attrs:full}).map(c=>{
      if(c[0]==='Z')return ['Z'];
      const o=[c[0]];
      for(let q=1;q<c.length;q+=2){ const pp=m.transformPoint(new DOMPoint(c[q],c[q+1])); o.push(pp.x,pp.y); }
      return o;
    });
    made.push(addLayer('path',{d:dToStr(cmds),fill:full.fill,stroke:full.stroke,sw:full.sw},nm));
  }
  function walkShapes(items,style,m,name){
    const st2={...style};
    for(const it of items){
      if(it.ty==='fl') st2.fill=lotColor(it.c);
      else if(it.ty==='st'){ st2.stroke=lotColor(it.c); st2.sw=num(sVal(it.w))||1; }
      else if(it.ty==='gf'||it.ty==='gs'){ if(st2.fill===undefined)st2.fill='#7c5cff'; warn++; }
      else if(it.ty==='tm'||it.ty==='rp'||it.ty==='rd') warn++;
    }
    for(const it of items){
      if(it.ty==='gr'){
        const tr=(it.it||[]).find(x=>x.ty==='tr');
        walkShapes((it.it||[]).filter(x=>x.ty!=='tr'),st2,groupMatrix(tr,m),it.nm||name);
      }
      else if(it.ty==='sh'){
        if(isAnim(it.ks)) warn++;
        const pk=sVal(it.ks);
        if(pk&&pk.v){
          const d=lottiePathToD(pk,m);
          if(d) made.push(addLayer('path',{d,fill:st2.fill!==undefined?st2.fill:'none',stroke:st2.stroke||'',sw:st2.sw||1},it.nm||name||'trazado'));
        }
      }
      else if(it.ty==='rc'){
        if(isAnim(it.p)||isAnim(it.s)) warn++;
        const p=sVal(it.p)||[0,0], s2=sVal(it.s)||[0,0];
        bakeOrAdd('rect',{x:num2(p,0)-num2(s2,0)/2,y:num2(p,1)-num2(s2,1)/2,w:num2(s2,0),h:num2(s2,1),rx:num(sVal(it.r))||0},it.nm||name||'rect',m,st2);
      }
      else if(it.ty==='el'){
        if(isAnim(it.p)||isAnim(it.s)) warn++;
        const p=sVal(it.p)||[0,0], s2=sVal(it.s)||[0,0];
        bakeOrAdd('ellipse',{cx:num2(p,0),cy:num2(p,1),rx:num2(s2,0)/2,ry:num2(s2,1)/2},it.nm||name||'elipse',m,st2);
      }
      else if(it.ty==='sr'){
        if(isAnim(it.p)||isAnim(it.or)) warn++;
        const p=sVal(it.p)||[0,0];
        const oR=num(sVal(it.or))||50, iR=it.ir?num(sVal(it.ir))||oR/2:oR/2;
        bakeOrAdd('polygon',{cx:num2(p,0),cy:num2(p,1),r:oR,sides:Math.round(num(sVal(it.pt))||5),star:it.sy===1,ir:clamp(iR/oR,0.05,1)},it.nm||name||'polígono',m,st2);
      }
    }
  }
  function applyKs(l,ks){
    const aR=ks.a?sVal(ks.a)||[0,0]:[0,0];
    const ax=num2(aR,0), ay=num2(aR,1);
    l.origin={x:ax,y:ay};
    if(ks.p){
      if(ks.p.s){ addKeys(l,'tx',ks.p.x,v=>num(v)-ax); addKeys(l,'ty',ks.p.y,v=>num(v)-ay); }
      else addKeys2v(l,'tx','ty',ks.p,v=>[num2(v,0)-ax,num2(v,1)-ay]);
    }
    if(ks.r) addKeys(l,'rot',ks.r,v=>num(v));
    if(ks.s) addKeys2v(l,'sx','sy',ks.s,v=>[num2(v,0)/100,num2(v,1)/100]);
    if(ks.o) addKeys(l,'opacity',ks.o,v=>num(v)/100);
    if(ks.sk&&num(sVal(ks.sk))) addKeys(l,'skx',ks.sk,v=>num(v));
  }
  let total=0, skipped=0;
  [...j.layers].reverse().forEach(L=>{
    if(L.ty!==4){ skipped++; return; }
    if(L.parent!==undefined) warn++;
    made=[];
    walkShapes(L.shapes||[],{},null,L.nm);
    if(!made.length){ skipped++; return; }
    for(const l of made) applyKs(l,L.ks||{});
    if(made.length===1&&L.nm) made[0].name=L.nm;
    total+=made.length;
  });
  refresh(); zoomFit();
  if(!total){ alert('No se encontraron capas de formas importables. Este Lottie usa solo tipos aún no soportados (precomposiciones, imágenes, texto...).'); return; }
  showHint(`Lottie: ${total} capa(s) importadas de ${fname||'archivo'}${skipped?` · ${skipped} omitidas`:''}${warn?` · ${warn} rasgos aproximados (grupos animados, degradados, trim, tangentes espaciales...)`:''}`);
}

/* ================================================================
   Línea de tiempo, keyframes y reproducción
   ================================================================ */
let PPS=140; const TPAD=10; // píxeles por segundo (zoom del timeline), margen izquierdo

function tlWidth(){
  let maxT=doc.dur;
  for(const id in anims) for(const p in anims[id]) for(const k of anims[id][p]) maxT=Math.max(maxT,k.t);
  return maxT*PPS+TPAD+80;
}
function renderRuler(){
  const r=$('#tRuler'); const w=tlWidth();
  r.style.width=w+'px';
  let h='';
  const step= doc.dur>12 ? 1 : 0.5;
  for(let t=0;t<=w/PPS;t+=step){
    h+=`<div class="rmark" style="left:${TPAD+t*PPS}px">${(+t.toFixed(2))}s</div>`;
  }
  // bandas de escenas
  const SCENE_COLORS=['#1565C0','#F57F17','#6A1B9A','#2E7D32','#AD1457','#00838F'];
  let acc=0;
  doc.scenes.forEach((s,i)=>{
    h+=`<div class="sceneBand" style="left:${TPAD+acc*PPS}px;width:${s.dur*PPS}px;background:${SCENE_COLORS[i%SCENE_COLORS.length]}" title="${esc(s.name)}"></div>`;
    acc+=s.dur;
  });
  // bucle A-B
  if(S.abA!=null&&S.abB!=null){
    const a=Math.min(S.abA,S.abB), b=Math.max(S.abA,S.abB);
    h+=`<div class="abBand" style="left:${TPAD+a*PPS}px;width:${(b-a)*PPS}px" title="Bucle A-B (Alt+clic para quitar)"></div>`;
  } else if(S.abA!=null){
    h+=`<div class="abBand" style="left:${TPAD+S.abA*PPS}px;width:2px" title="Punto A (Alt+clic fija B)"></div>`;
  }
  // marca de fin de duración
  h+=`<div style="position:absolute;left:${TPAD+doc.dur*PPS}px;top:0;bottom:0;border-left:2px solid var(--danger);opacity:.6" title="Fin de la animación"></div>`;
  r.innerHTML=h;
  $('#rulerPlayhead').style.left=(TPAD+S.T*PPS-$('#tTracksWrap').scrollLeft)+'px';
}
function kfDiamond(id,prop,k,idx){
  const sel=S.selKf&&S.selKf.id===id&&S.selKf.prop===prop&&S.selKf.idx===idx;
  return `<div class="kf${sel?' selected':''}" data-id="${id}" data-prop="${prop}" data-idx="${idx}" style="left:${TPAD+k.t*PPS}px" title="${PROP_LABEL[prop]} @ ${k.t.toFixed(2)}s (${easeLabel(k.ease)})"></div>`;
}
function renderTimeline(){
  renderRuler();
  const names=$('#tNames'), tracks=$('#tTracks');
  const w=tlWidth();
  let nh='', th='';
  [...doc.layers].reverse().forEach(l=>{
    const la=anims[l.id]||{};
    const hasAnim=Object.keys(la).length>0;
    const exp=S.expanded[l.id];
    nh+=`<div class="tname-row layer-row${l.id===S.sel?' selected':''}" data-lid="${l.id}">
      <span style="width:12px;display:inline-block">${hasAnim?(exp?'▾':'▸'):''}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(l.name)}</span>
      ${hasAnim?'<span title="Animada" style="color:var(--kf)">◆</span>':''}</div>`;
    // fila de capa: agregado de keyframes
    let agg='';
    if(hasAnim&&!exp){
      const ts=new Set();
      for(const p in la) la[p].forEach(k=>ts.add(+k.t.toFixed(3)));
      const arr=[...ts].sort((a,b)=>a-b);
      if(arr.length>1) agg+=`<div class="kf-span" style="left:${TPAD+arr[0]*PPS}px;width:${(arr[arr.length-1]-arr[0])*PPS}px"></div>`;
      arr.forEach(t=>agg+=`<div class="kf" data-lid="${l.id}" data-agg="${t}" style="left:${TPAD+t*PPS}px;pointer-events:none;opacity:.7"></div>`);
    }
    th+=`<div class="trow layer-row" data-lid="${l.id}" style="width:${w}px">${agg}</div>`;
    if(exp){
      for(const [prop,label] of ANIM_PROPS){
        const ks=la[prop];
        nh+=`<div class="tname-row prop-row"><span style="flex:1">${label}</span>
          <button class="mini" data-addkf="${l.id}:${prop}" title="Keyframe en t actual">◆+</button></div>`;
        let kh='';
        if(ks&&ks.length){
          if(ks.length>1) kh+=`<div class="kf-span" style="left:${TPAD+ks[0].t*PPS}px;width:${(ks[ks.length-1].t-ks[0].t)*PPS}px"></div>`;
          ks.forEach((k,i)=>kh+=kfDiamond(l.id,prop,k,i));
        }
        th+=`<div class="trow" data-track="${l.id}:${prop}" style="width:${w}px">${kh}</div>`;
      }
    }
  });
  names.innerHTML=nh;
  tracks.innerHTML=th+'<div id="playhead"></div>';
  tracks.style.width=w+'px';
  positionPlayhead();

  names.querySelectorAll('.layer-row').forEach(d=>{
    d.onclick=()=>{
      const id=d.dataset.lid;
      if(S.sel===id) S.expanded[id]=!S.expanded[id];
      else { S.sel=id; S.expanded[id]=true; }
      refreshPanels(); drawOverlay();
    };
  });
  names.querySelectorAll('[data-addkf]').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      const [id,prop]=b.dataset.addkf.split(':');
      const l=getLayer(id); if(!l)return;
      snapshot(); setKeyAt(l,prop,S.T,valAt(l,prop,S.T));
      refreshPanels();
    };
  });
}
function positionPlayhead(){
  const ph=$('#playhead');
  if(ph) ph.style.left=(TPAD+S.T*PPS)+'px';
  $('#rulerPlayhead').style.left=(TPAD+S.T*PPS-$('#tTracksWrap').scrollLeft)+'px';

function setTime(t,updateUI){

/* --- scrub en la regla y en las pistas --- */
function scrubFromEvent(e,el){
  const r=el.getBoundingClientRect();
  const x=e.clientX-r.left+(el===$('#tRulerWrap')?$('#tTracksWrap').scrollLeft:el.scrollLeft||0);
  setTime(Math.max(0,(x-TPAD)/PPS),false);
}
let scrubbing=false;
$('#tRulerWrap').addEventListener('pointerdown',e=>{
  if(e.altKey){
    const r=$('#tRulerWrap').getBoundingClientRect();
    const t=Math.max(0,(e.clientX-r.left+$('#tTracksWrap').scrollLeft-TPAD)/PPS);
    if(S.abA==null){ S.abA=+t.toFixed(3); }
    else if(S.abB==null){ S.abB=+t.toFixed(3); if(S.abB<S.abA)[S.abA,S.abB]=[S.abB,S.abA]; }
    else { S.abA=null; S.abB=null; }
    renderRuler();
    showHint(S.abA==null?'Bucle A-B eliminado':(S.abB==null?'Punto A fijado — Alt+clic para fijar B':'Bucle A-B activo: la reproducción queda confinada al tramo'));
    return;
  }
  scrubbing=true; $('#tRulerWrap').setPointerCapture(e.pointerId);

});
$('#tRulerWrap').addEventListener('wheel',e=>{
  e.preventDefault();
  $('#tTracksWrap').scrollLeft+=e.deltaY;
},{passive:false});
$('#tTracksWrap').addEventListener('wheel',e=>{

},{passive:false});
$('#tRulerWrap').addEventListener('pointermove',e=>{ if(scrubbing)scrubFromEvent(e,$('#tRulerWrap')); });

let kfDrag=null;
$('#tTracksWrap').addEventListener('pointerdown',e=>{
  const kf=e.target.closest('.kf');

});
$('#tTracksWrap').addEventListener('pointermove',e=>{
  if(kfDrag){

/* --- reproducción --- */
let rafId=null,lastTs=0;
function togglePlay(){ S.playing?stopPlay():startPlay(); }
function startPlay(){
  S.playing=true; $('#btnPlay').textContent='⏸'; $('#btnPlay').classList.add('active');
  if(S.T>=doc.dur) S.T=0;
  lastTs=performance.now();
  const tick=ts=>{
    if(!S.playing)return;
    const dt=(ts-lastTs)/1000*(S.speed||1); lastTs=ts;
    let t=S.T+dt;
    const useAB=S.abA!=null&&S.abB!=null&&S.abB>S.abA;
    const a=useAB?S.abA:0, b=useAB?Math.min(S.abB,doc.dur):doc.dur;
    if(t>=b){
      if(S.loop||useAB) t=a+(t-b)%((b-a)||1e-9);
      else { setTime(doc.dur); stopPlay(); return; }
    }
    S.T=t; applyFrame(t); positionPlayhead();
    rafId=requestAnimationFrame(tick);
  };
  if(S.abA!=null&&S.abB!=null&&(S.T<S.abA||S.T>=S.abB)) S.T=S.abA;
  rafId=requestAnimationFrame(tick);
}
function stopPlay(){
  S.playing=false; $('#btnPlay').textContent='▶'; $('#btnPlay').classList.remove('active');
  if(rafId)cancelAnimationFrame(rafId);
  renderProps();
}
$('#btnPlay').onclick=togglePlay;
$('#btnToStart').onclick=()=>setTime(0);
$('#btnLoop').onclick=function(){ S.loop=!S.loop; this.style.opacity=S.loop?1:.4; };
$('#speedSel').onchange=e=>{ S.speed=+e.target.value||1; };
function tlZoom(f){

  PPS=clamp(Math.round(PPS*f),18,800);

  w.scrollLeft=Math.max(0,mid*PPS+TPAD-w.clientWidth/2);
  positionPlayhead();
}

/* --- editor de curvas cubic-bezier --- */
function selKfObj(){
  if(!S.selKf)return null;
  const ks=keysOf(S.selKf.id,S.selKf.prop);
  return ks?ks[S.selKf.idx]:null;
}
function drawCurveEd(){
  const k=selKfObj(), svg=$('#curveSvg');
  if(!k||!(k.ease&&k.ease.cb)){ $('#curveEd').style.display='none'; return; }
  $('#curveEd').style.display='block';
  const [x1,y1,x2,y2]=k.ease.cb;
  const W=180,H=140,PX=18,PY=30;
  const X=v=>PX+v*(W-2*PX), Y=v=>H-PY-v*(H-2*PY);
  svg.innerHTML=`
    <rect x="${PX}" y="${PY}" width="${W-2*PX}" height="${H-2*PY}" fill="none" stroke="#33363f"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="#33363f" stroke-dasharray="3"/>
    <path d="M${X(0)} ${Y(0)} C${X(x1)} ${Y(y1)} ${X(x2)} ${Y(y2)} ${X(1)} ${Y(1)}" fill="none" stroke="#d6d8de" stroke-width="2"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(y1)}" stroke="#7c5cff"/>
    <line x1="${X(1)}" y1="${Y(1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="#e94560"/>
    <circle data-cp="1" cx="${X(x1)}" cy="${Y(y1)}" r="6" fill="#7c5cff" style="cursor:move"/>
    <circle data-cp="2" cx="${X(x2)}" cy="${Y(y2)}" r="6" fill="#e94560" style="cursor:move"/>`;
  svg.onpointerdown=e=>{
    const cp=e.target.dataset&&e.target.dataset.cp; if(!cp)return;
    svg.setPointerCapture(e.pointerId);
    const move=ev=>{
      const r=svg.getBoundingClientRect();
      const vx=clamp((ev.clientX-r.left-PX)/(W-2*PX),0,1);
      const vy=clamp((H-PY-(ev.clientY-r.top))/(H-2*PY),-0.6,1.6);
      const k2=selKfObj(); if(!k2||!k2.ease.cb)return;
      if(cp==='1'){ k2.ease.cb[0]=+vx.toFixed(3); k2.ease.cb[1]=+vy.toFixed(3); }
      else { k2.ease.cb[2]=+vx.toFixed(3); k2.ease.cb[3]=+vy.toFixed(3); }
      drawCurveEd(); applyFrame(S.T);
    };
    const up=()=>{ svg.removeEventListener('pointermove',move); svg.removeEventListener('pointerup',up); };
    svg.addEventListener('pointermove',move);
    svg.addEventListener('pointerup',up);
    e.preventDefault();
  };
}

/* ================================================================
   Exportación — sin restricciones, sin marcas de agua, sin límites
   ================================================================ */
function download(name,content,mime){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime||'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function svgOpen(id){ return `<svg xmlns="http://www.w3.org/2000/svg"${id?` id="${id}"`:''} width="${doc.w}" height="${doc.h}" viewBox="0 0 ${doc.w} ${doc.h}">`; }
function addDrawAttrs(l,T,mk){
  const p=valAt(l,'draw',T);
  if(!(keysOf(l.id,'draw')||p<100)||l.type==='text'||l.type==='raw')return mk;
  const attrs=` pathLength="1" stroke-dasharray="1" stroke-dashoffset="${fmt(1-clamp(p,0,100)/100)}"`;
  return mk.replace(/\/>/, attrs+'/>');
}
function layerMarkupAt(l,T,stripFill){
  let c;
  if(keysOf(l.id,'geom')){
    const gm=geomAt(l,T);
    c={type:gm.tp,attrs:JSON.parse(JSON.stringify(gm.at)),raw:l.raw};
  } else c=JSON.parse(JSON.stringify({type:l.type,attrs:l.attrs,raw:l.raw}));
  if(stripFill){
    if(c.type==='line') return addDrawAttrs(l,T,layerMarkup(c).replace(/ stroke="[^"]*"/,''));
    delete c.attrs.fill;
    return addDrawAttrs(l,T,layerMarkup(c));
  }
  if(keysOf(l.id,'fill')){
    const v=valAt(l,'fill',T);
    if(c.type==='line') c.attrs.stroke=v; else c.attrs.fill=v;
  }
  return addDrawAttrs(l,T,layerMarkup(c));
}
function exportTransform(l,T){
  const p=effProps(l,T); const [cx,cy]=ctr(l);
  let tr='';
  const m=motionAt(l,T);
  if(m) tr=`translate(${fmt(m.x-cx)} ${fmt(m.y-cy)})${m.ang?` rotate(${fmt(m.ang)} ${fmt(cx)} ${fmt(cy)})`:''} `;
  return (tr+transformStr(p,cx,cy)).trim();
}
function staticLayerStr(l,T){
  const sf=sceneFactorAt(l,T);
  if(sf.hidden)return '';
  const p=effProps(l,T);
  let tr='';
  if(sf.tx||sf.ty) tr+=`translate(${fmt(sf.tx)} ${fmt(sf.ty)}) `;
  if(sf.sc!==1) tr+=`translate(${fmt(doc.w/2)} ${fmt(doc.h/2)}) scale(${fmt(sf.sc)}) translate(${fmt(-doc.w/2)} ${fmt(-doc.h/2)}) `;
  tr+=exportTransform(l,T);
  tr=tr.trim();
  const op=p.opacity*sf.op;
  return `<g${tr?` transform="${tr}"`:''}${op!==1?` opacity="${fmt(op)}"`:''}>${layerMarkupAt(l,T)}</g>`;
}

/* ---- SVG estático (fotograma actual) ---- */
function exportStatic(){
  let s=svgOpen();
  if(doc.defs) s+=`<defs>${doc.defs}</defs>`;
  for(const l of doc.layers){ if(l.visible) s+=staticLayerStr(l,S.T); }
  s+='</svg>';
  download('imagen.svg',s,'image/svg+xml');
}

/* ---- utilidades de animación ---- */
function unionTimes(la,dense){
  const ts=new Set([0,doc.dur]);
  for(const p in la) la[p].forEach(k=>{ if(k.t<=doc.dur) ts.add(+k.t.toFixed(4)); });
  if(dense){ const n=50; for(let i=1;i<n;i++) ts.add(+(i*doc.dur/n).toFixed(4)); }
  return [...ts].sort((a,b)=>a-b);
}
const CSS_EASE={linear:'linear',easeIn:'ease-in',easeOut:'ease-out',easeInOut:'ease-in-out',step:'steps(1,end)'};
const BASIC_EASE=new Set(['linear','easeIn','easeOut','easeInOut','step']);
function usesAdvEase(la){
  for(const p in la){
    if(p==='geom')continue;
    for(const k of la[p]){
      const e=k.ease||'linear';
      if(typeof e==='object')continue;
      if(!BASIC_EASE.has(e)) return true;
    }
  }
  return false;
}
function denseTimes(){
  const n=clamp(Math.round(doc.dur*30),24,150), a=[];
  for(let i=0;i<=n;i++) a.push(+(i*doc.dur/n).toFixed(4));
  return a;
}
const SPLINE={linear:'0 0 1 1',easeIn:'0.42 0 1 1',easeOut:'0 0 0.58 1',easeInOut:'0.42 0 0.58 1',step:'0 0 1 1'};
function cssEase(e){ if(e&&e.cb)return `cubic-bezier(${e.cb.map(v=>+(+v).toFixed(3)).join(',')})`; return CSS_EASE[e]||'linear'; }
function smilSpline(e){
  if(e&&e.cb) return e.cb.map(v=>fmt(clamp(v,0,1))).join(' ');
  return SPLINE[e]||SPLINE.linear;
}
function sceneEnvPoints(l){
  if(!doc.scenes.length||!l.scene)return null;
  const i=doc.scenes.findIndex(s=>s.id===l.scene); if(i<0)return null;
  const s=doc.scenes[i], st=sceneStart(i), en=st+s.dur;
  const tdIn=(s.trans&&s.trans!=='cut')?Math.min(s.tdur||0,s.dur):0;
  const nx=doc.scenes[i+1];
  const tdOut=(nx&&nx.trans&&nx.trans!=='cut')?Math.min(nx.tdur||0,nx.dur):0;
  const ts=new Set([0,doc.dur]); const eps=0.002;
  const add=t=>{ if(t>=0&&t<=doc.dur)ts.add(+t.toFixed(4)); };
  add(st-eps); add(st);
  for(let k=0;k<=6;k++){ if(tdIn)add(st+tdIn*k/6); }
  add(en-eps); add(en);
  for(let k=0;k<=6;k++){ if(tdOut)add(en+tdOut*k/6); }
  add(en+tdOut); add(en+tdOut+eps);
  return [...ts].sort((a,b)=>a-b).map(t=>{
    const f=sceneFactorAt(l,t);
    return {t,op:f.hidden?0:f.op,tx:f.hidden?0:f.tx,ty:f.hidden?0:f.ty,sc:f.hidden?1:f.sc};
  });
}
function sceneCSS(l,gid){
  const env=sceneEnvPoints(l);
  if(!env)return {css:'',open:'',close:''};

/* ---- PNG ---- */
function exportPNG(){
  const scale=parseFloat(prompt('Escala de exportación (1 = tamaño real):','2'))||1;
  const withBg=confirm('¿Incluir el color de fondo del lienzo?\nAceptar = con fondo · Cancelar = transparente');
  let s=svgOpen();
  if(withBg) s+=`<rect width="${doc.w}" height="${doc.h}" fill="${doc.bg}"/>`;
  if(doc.defs) s+=`<defs>${doc.defs}</defs>`;
  for(const l of doc.layers){ if(l.visible) s+=staticLayerStr(l,S.T); }
  s+='</svg>';
  const img=new Image();
  const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=doc.w*scale; c.height=doc.h*scale;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>download('imagen.png',b,'image/png'),'image/png');
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); alert('No se pudo rasterizar el SVG.'); };
  img.src=url;
}

/* ---- Código GSAP (para desarrolladores que usan GSAP) ---- */
const GSAP_EASE={linear:'none',easeIn:'power1.in',easeOut:'power1.out',easeInOut:'power1.inOut',
  step:'steps(1)',expoIn:'expo.in',expoOut:'expo.out',backIn:'back.in(1.7)',backOut:'back.out(1.7)',
  elasticIn:'elastic.in(1,0.3)',elasticOut:'elastic.out(1,0.3)',bounceIn:'bounce.in',bounceOut:'bounce.out'};
const GSAP_PROP={tx:'x',ty:'y',rot:'rotation',sx:'scaleX',sy:'scaleY',skx:'skewX',sky:'skewY',opacity:'opacity'};
const gsapEase=e=>(e&&e.cb)?'power2.inOut':(GSAP_EASE[e]||'none');
function exportGSAP(){
  let body='', i=0, needMotion=false;
  const lines=[];
  for(const l of doc.layers){
    if(!l.visible)continue;
    const la=anims[l.id]||{};
    const hasMotion=!!(l.motion&&l.motion.d);
    const animated=Object.keys(la).length>0||hasMotion;
    const gid='vm'+(i++);
    if(!animated){ body+=staticLayerStr(l,0); continue; }
    body+=`<g id="${gid}">${layerMarkupAt(l,0,!!la.fill)}</g>`;
    const [cx,cy]=ctr(l); const p0=effProps(l,0);
    lines.push(`// --- ${l.name} ---`);
    lines.push(`const ${gid}=document.getElementById("${gid}");`);
    lines.push(`gsap.set(${gid},{svgOrigin:"${fmt(cx)} ${fmt(cy)}",x:${fmt(p0.tx)},y:${fmt(p0.ty)},rotation:${fmt(p0.rot)},scaleX:${fmt(p0.sx)},scaleY:${fmt(p0.sy)},skewX:${fmt(p0.skx)},skewY:${fmt(p0.sky)},opacity:${fmt(p0.opacity)}});`);
    for(const prop in la){
      if(prop==='mp')continue;
      if(prop==='geom'){ lines.push(`// Morphing de geometría: no incluido en la exportación GSAP (usa la exportación JS o CSS)`); continue; }
      const ks=la[prop].filter(k=>k.t<=doc.dur);
      if(!ks.length)continue;
      if(prop==='draw'){
        lines.push(`gsap.set(${gid}.firstElementChild,{attr:{pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':${fmt(1-clamp(ks[0].v,0,100)/100)}}});`);
        for(let j=0;j<ks.length-1;j++){
          const a=ks[j],b=ks[j+1];
          lines.push(`tl.to(${gid}.firstElementChild,{duration:${fmt(b.t-a.t)},attr:{'stroke-dashoffset':${fmt(1-clamp(b.v,0,100)/100)}},ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
        }
        continue;
      }
      if(prop==='fill'){
        const attr=l.type==='line'?'stroke':'fill';
        lines.push(`gsap.set(${gid}.firstElementChild,{${attr}:"${ks[0].v}"});`);
        for(let j=0;j<ks.length-1;j++){
          const a=ks[j],b=ks[j+1];
          lines.push(`tl.to(${gid}.firstElementChild,{duration:${fmt(b.t-a.t)},${attr}:"${b.v}",ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
        }
        continue;
      }
      const gp=GSAP_PROP[prop]; if(!gp)continue;
      lines.push(`gsap.set(${gid},{${gp}:${fmt(ks[0].v)}});`);
      for(let j=0;j<ks.length-1;j++){
        const a=ks[j],b=ks[j+1];
        lines.push(`tl.to(${gid},{duration:${fmt(b.t-a.t)},${gp}:${fmt(b.v)},ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
      }
    }
    if(hasMotion){
      needMotion=true;
      const mk=(la.mp||[]).filter(k=>k.t<=doc.dur);
      lines.push(`// Trayectoria de movimiento (nota: motionPath controla x/y; evita combinarla con tweens de x/y en el mismo tramo)`);
      if(mk.length>1){
        for(let j=0;j<mk.length-1;j++){
          const a=mk[j],b=mk[j+1];
          lines.push(`tl.to(${gid},{duration:${fmt(b.t-a.t)},motionPath:{path:"${l.motion.d}",start:${fmt(clamp(a.v,0,100)/100)},end:${fmt(clamp(b.v,0,100)/100)},autoRotate:${!!l.motion.orient},alignOrigin:[0.5,0.5]},ease:"${gsapEase(a.ease)}"},${fmt(a.t)});`);
        }
      } else {
        lines.push(`tl.to(${gid},{duration:${fmt(doc.dur)},motionPath:{path:"${l.motion.d}",autoRotate:${!!l.motion.orient},alignOrigin:[0.5,0.5]},ease:"none"},0);`);
      }
    }
  }
  const html=`<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Animación GSAP — VectorMotion</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#16171c}</style>
</head>
<body>
${svgOpen()}${doc.defs?`<defs>${doc.defs}</defs>`:''}${body}</svg>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"><\/script>
${needMotion?`<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/MotionPathPlugin.min.js"><\/script>\n`:''}<script>
${needMotion?'gsap.registerPlugin(MotionPathPlugin);\n':''}// Timeline generada por VectorMotion — duración ${doc.dur}s, bucle infinito
const tl=gsap.timeline({repeat:-1});
${lines.join('\n')}
<\/script>
</body>
</html>`;
  download('animacion-gsap.html',html,'text/html');
}
