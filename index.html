<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VectorMotion — Editor SVG y Animación</title>
<style>
:root{
  --bg:#16171c; --panel:#1f2128; --panel2:#25272f; --border:#33363f;
  --txt:#d6d8de; --txt2:#8b8e99; --accent:#7c5cff; --accent2:#00c2a8;
  --danger:#ff5470; --kf:#ffb454; --sel:#7c5cff;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden;}
body{
  font-family:'Segoe UI',system-ui,sans-serif; font-size:13px;
  background:var(--bg); color:var(--txt);
  display:grid;
  grid-template-rows:44px 1fr 240px;
  grid-template-columns:230px 1fr 250px;
  grid-template-areas:"top top top" "layers canvas props" "timeline timeline timeline";
}
button{
  background:var(--panel2); color:var(--txt); border:1px solid var(--border);
  border-radius:5px; padding:4px 9px; cursor:pointer; font-size:12.5px;
}
button:hover{background:#2e3039; border-color:#4a4d59;}
button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
button.danger:hover{background:var(--danger); border-color:var(--danger); color:#fff;}
input,select{
  background:#15161b; color:var(--txt); border:1px solid var(--border);
  border-radius:4px; padding:3px 6px; font-size:12.5px;
}
input[type=number]{width:58px;}
input[type=color]{width:28px; height:22px; padding:1px; cursor:pointer;}
input:focus,select:focus{outline:1px solid var(--accent);}
label{color:var(--txt2); font-size:12px;}

/* ---- Barra superior ---- */
#topbar{
  grid-area:top; display:flex; align-items:center; gap:6px; padding:0 10px;
  background:var(--panel); border-bottom:1px solid var(--border);
}
#topbar .logo{font-weight:700; color:#fff; margin-right:8px; letter-spacing:.3px;}
#topbar .logo span{color:var(--accent);}
.sep{width:1px; height:24px; background:var(--border); margin:0 4px;}
.toolbtn{width:32px; height:30px; padding:0; font-size:15px; display:flex; align-items:center; justify-content:center;}
.grow{flex:1;}
.menu-wrap{position:relative;}
.menu{
  position:absolute; top:34px; right:0; z-index:60; min-width:230px;
  background:var(--panel2); border:1px solid var(--border); border-radius:7px;
  box-shadow:0 8px 24px rgba(0,0,0,.5); display:none; padding:5px;
}
.menu.open{display:block;}
.menu.left{left:0; right:auto;}
.menu button{display:block; width:100%; text-align:left; border:none; background:none; padding:7px 10px; border-radius:5px;}
.menu button:hover{background:var(--accent); color:#fff;}
.menu hr{border:none; border-top:1px solid var(--border); margin:5px 0;}
/* Menú de rutas: posición fija para salir del contexto de overflow del panel */
#routeMenu{
  position:fixed; z-index:500; min-width:200px;
  max-height:60vh; overflow-y:auto;
}

/* ---- Panel de capas ---- */
#layersPanel{
  grid-area:layers; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  position:relative; /* necesario para el handle de redimensionado */
}
.panel-title{
  padding:8px 10px; font-size:11px; font-weight:600; letter-spacing:.8px;
  text-transform:uppercase; color:var(--txt2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
#layersList{flex:1; overflow-y:auto;}
.layer-item{
  display:flex; align-items:center; gap:6px; padding:6px 8px;
  border-bottom:1px solid #24262d; cursor:pointer; user-select:none;
}
.layer-item:hover{background:#24262e;}
.layer-item.selected{background:rgba(124,92,255,.18); box-shadow:inset 3px 0 0 var(--accent);}
.layer-item .lname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.layer-item .lname input{width:100%;}
.layer-item .icon{opacity:.75; width:16px; text-align:center;}
.mini{
  background:none; border:none; padding:2px 3px; font-size:12px; opacity:.6; width:auto;
}
.mini:hover{opacity:1; background:none;}

/* ---- Lienzo ---- */
#canvasArea{
  grid-area:canvas; position:relative; overflow:hidden; background:#101116;
  background-image:radial-gradient(#22242c 1px,transparent 1px); background-size:22px 22px;
}
#canvasWrap{position:absolute; transform-origin:0 0;}
#canvas{display:block; background:transparent; box-shadow:0 0 0 1px var(--border),0 10px 40px rgba(0,0,0,.5);}
#canvasArea.tool-rect,#canvasArea.tool-ellipse,#canvasArea.tool-line{cursor:crosshair;}
#canvasArea.tool-text{cursor:text;}
#canvasArea.tool-pen,#canvasArea.tool-polygon{cursor:crosshair;}
#canvasArea.tool-hand{cursor:grab;}
#canvasArea.panning{cursor:grabbing;}
#rulerX{position:absolute; top:0; left:22px; right:0; height:22px; width:calc(100% - 22px); z-index:6; pointer-events:none;}
#rulerY{position:absolute; top:22px; left:0; width:22px; height:calc(100% - 22px); z-index:6; pointer-events:none;}
#rulerCorner{
  position:absolute; top:0; left:0; width:22px; height:22px;
  background:var(--panel); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  z-index:8; cursor:crosshair; user-select:none;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
#rulerCorner:hover{background:#2a2c35;}
#rulerCorner::after{content:''; width:6px; height:6px; border-left:1px solid var(--accent2); border-bottom:1px solid var(--accent2); opacity:.7;}
/* Líneas guía de origen de reglas */
#rulerOriginH{
  position:absolute; left:22px; right:0; height:1px;
  background:var(--accent2); opacity:.7; z-index:9; pointer-events:none; display:none;
}
#rulerOriginV{
  position:absolute; top:22px; bottom:0; width:1px;
  background:var(--accent2); opacity:.7; z-index:9; pointer-events:none; display:none;
}
/* Handle de redimensionado del panel izquierdo */
#layerResizeHandle{
  position:absolute; top:0; right:-4px; width:8px; bottom:0;
  cursor:col-resize; z-index:20; background:transparent;
  transition:background .15s;
}
#layerResizeHandle:hover,#layerResizeHandle.dragging{
  background:rgba(124,92,255,.45);
}
#zoomHud{
  position:absolute; bottom:10px; left:10px; z-index:5; display:flex; gap:5px; align-items:center;
  background:rgba(31,33,40,.9); border:1px solid var(--border); border-radius:6px; padding:4px 8px;
}
#hint{
  position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5;
  background:rgba(31,33,40,.92); border:1px solid var(--border); border-radius:6px;
  padding:5px 12px; color:var(--txt2); font-size:12px; pointer-events:none;
  opacity:0; transition:opacity .25s;
}
#hint.show{opacity:1;}

/* ---- Panel de propiedades ---- */
#propsPanel{
  grid-area:props; background:var(--panel); border-left:1px solid var(--border);
  overflow-y:auto; display:flex; flex-direction:column;
}
#propsBody{padding:10px;}
.prow{display:flex; align-items:center; gap:6px; margin-bottom:7px; flex-wrap:wrap;}
.prow label{width:72px; flex-shrink:0;}
.prow input[type=text]{flex:1; min-width:60px;}
.pgroup{
  border-top:1px solid var(--border); margin-top:10px; padding-top:8px;
  font-size:11px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--txt2);
  margin-bottom:8px;
}
.kbtn{
  width:20px; height:20px; padding:0; border-radius:3px; font-size:11px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  color:var(--txt2); background:none; border:1px solid transparent;
}
.kbtn:hover{border-color:var(--kf); color:var(--kf); background:none;}
.kbtn.animated{color:var(--kf);}
.kbtn.onkey{background:var(--kf); color:#111; border-color:var(--kf);}
.empty-note{color:var(--txt2); padding:16px 12px; line-height:1.5;}

/* ---- Línea de tiempo ---- */
#timeline{
  grid-area:timeline; background:var(--panel); border-top:1px solid var(--border);
  display:grid; grid-template-rows:34px 1fr; grid-template-columns:230px 1fr;
  grid-template-areas:"tcontrols truler" "tnames ttracks"; overflow:hidden;
}
#tControls{
  grid-area:tcontrols; display:flex; align-items:center; gap:5px; padding:0 8px;
  border-right:1px solid var(--border); border-bottom:1px solid var(--border);
}
#tRulerWrap{grid-area:truler; position:relative; overflow:hidden; border-bottom:1px solid var(--border);}
#tNames{grid-area:tnames; overflow:hidden; border-right:1px solid var(--border);}
#tTracksWrap{grid-area:ttracks; position:relative; overflow:auto;}
#tRuler{position:absolute; top:0; left:0; height:100%;}
#tTracks{position:relative; min-height:100%;}
.trow{height:26px; display:flex; align-items:center; border-bottom:1px solid #24262d; position:relative;}
.trow.layer-row{background:#23252c; font-weight:600;}
.tname-row{
  height:26px; display:flex; align-items:center; gap:5px; padding:0 6px 0 10px;
  border-bottom:1px solid #24262d; white-space:nowrap; overflow:hidden; font-size:12px;
  cursor:default; user-select:none;
}
.tname-row.layer-row{background:#23252c; font-weight:600; cursor:pointer;}
.tname-row.prop-row{padding-left:24px; color:var(--txt2);}
.tname-row.selected{box-shadow:inset 3px 0 0 var(--accent);}
.kf{
  position:absolute; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px;
  background:var(--kf); transform:rotate(45deg); border:1px solid #1118; border-radius:2px;
  cursor:ew-resize; z-index:3;
}
.kf.selected{background:#fff; outline:2px solid var(--accent);}
.kf-span{position:absolute; top:50%; height:2px; margin-top:-1px; background:rgba(255,180,84,.35); z-index:1;}
#playhead{
  position:absolute; top:0; bottom:0; width:1px; background:var(--accent2); z-index:10; pointer-events:none;
}
#playhead::before{
  content:''; position:absolute; top:0; left:-5px; border:5px solid transparent;
  border-top:7px solid var(--accent2);
}
#rulerPlayhead{position:absolute; top:0; bottom:0; width:1px; background:var(--accent2); z-index:10; pointer-events:none;}
.rmark{position:absolute; top:0; height:100%; border-left:1px solid var(--border); color:var(--txt2); font-size:10px; padding:2px 0 0 4px;}
#timeLabel{font-variant-numeric:tabular-nums; color:var(--accent2); min-width:52px; text-align:center;}
#kfEasing{
  position:absolute; z-index:50; background:var(--panel2); border:1px solid var(--border);
  border-radius:6px; padding:6px; display:none; gap:5px; align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}
#kfEasing.open{display:flex;}

/* --- columna izquierda: secciones plegables --- */
.panel-title{cursor:pointer; user-select:none;}
.panel-title .chev{width:13px; display:inline-block; color:var(--txt2);}
.secBody{overflow-y:auto; min-height:0;}
#layersList{flex:1;}
#scenesList,#routesList{flex:0 1 auto; max-height:32%;}
.sec-collapsed{display:none !important;}
body.lcol-collapsed{grid-template-columns:26px 1fr 250px;}
body.lcol-collapsed #layersPanel>*:not(#colStrip){display:none !important;}
#colStrip{display:none; padding:5px 2px; text-align:center;}
body.lcol-collapsed #colStrip{display:block;}
.scene-card{border-bottom:1px solid #24262d; padding:6px 8px; font-size:12px; cursor:pointer;}
.scene-card.active{background:rgba(124,92,255,.14); box-shadow:inset 3px 0 0 var(--accent);}
.scene-card .prow2{display:flex; gap:4px; align-items:center; margin-top:4px; flex-wrap:wrap;}
.scene-card input[type=number]{width:48px;}
.route-item{display:flex; align-items:center; gap:4px; padding:5px 8px; border-bottom:1px solid #24262d; font-size:12px;}
.route-item:hover{background:#24262e;}
.route-item .rname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* --- timeline: asa, bandas, A-B --- */
#timeline{position:relative;}
#tlResize{position:absolute; left:0; right:0; top:-3px; height:7px; cursor:ns-resize; z-index:30;}
#tlResize:hover{background:rgba(124,92,255,.45);}
.sceneBand{position:absolute; top:0; height:5px; opacity:.85; pointer-events:none;}
.abBand{position:absolute; top:24px; height:9px; background:rgba(0,194,168,.35); border-left:2px solid var(--accent2); border-right:2px solid var(--accent2); pointer-events:none;}
/* --- editor de curvas --- */
#kfEasing{flex-wrap:wrap; max-width:270px;}
#curveEd{width:100%; display:none;}
#curveSvg{background:#15161b; border:1px solid var(--border); border-radius:5px; display:block; margin-top:5px;}
#canvasArea.tool-route{cursor:crosshair;}
::-webkit-scrollbar{width:14px; height:14px;}
::-webkit-scrollbar-thumb{background:#3a3d47; border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<!-- ============ BARRA SUPERIOR ============ -->
<div id="topbar">
  <div class="logo">Vector<span>Motion</span></div>
  <div class="sep"></div>
  <button class="toolbtn" data-tool="select" title="Seleccionar (V)">▲</button>
  <button class="toolbtn" data-tool="node" title="Edición de nodos Bézier (A): arrastra anclas y manejadores · doble clic en un ancla convierte esquina/curva · doble clic en el trazado inserta nodo · Alt rompe la simetría">✒</button>
  <button class="toolbtn" data-tool="rect" title="Rectángulo (R)">▭</button>
  <button class="toolbtn" data-tool="ellipse" title="Elipse (E)">◯</button>
  <button class="toolbtn" data-tool="line" title="Línea (L)">╱</button>
  <button class="toolbtn" data-tool="polygon" title="Polígono / Estrella (G): arrastra desde el centro">⬠</button>
  <button class="toolbtn" data-tool="pen" title="Pluma (P): clic para puntos, Enter termina, doble clic cierra">✎</button>
  <button class="toolbtn" data-tool="route" title="Ruta de animación (M): con un objeto seleccionado, dibuja a mano alzada su trayectoria">➰</button>
  <button class="toolbtn" data-tool="text" title="Texto (T)">T</button>
  <button class="toolbtn" data-tool="hand" title="Mano (H): arrastra para desplazar la vista">✋</button>
  <div class="sep"></div>
  <button id="btnUndo" class="toolbtn" title="Deshacer (Ctrl+Z)">↩</button>
  <button id="btnRedo" class="toolbtn" title="Rehacer (Ctrl+Y)">↪</button>
  <div class="sep"></div>
  <div class="menu-wrap">
    <button id="btnObj" title="Operaciones de objeto">Objeto ▾</button>
    <div class="menu left" id="objMenu">
      <button data-obj="group">Agrupar selección (Ctrl+G)</button>
      <button data-obj="ungroup">Desagrupar (Ctrl+Shift+G)</button>
      <button data-obj="union">Unión de formas</button>
      <hr>
      <button data-obj="fliph">Voltear horizontal</button>
      <button data-obj="flipv">Voltear vertical</button>
      <button data-obj="rotl">Girar −90°</button>
      <button data-obj="rotr">Girar +90°</button>
      <hr>
      <button data-obj="centerorigin">Centrar origen de transformación</button>
      <button data-obj="topath">Convertir a trazado (editable por nodos)</button>
      <button data-obj="smooth">Suavizar trazado (pluma → curvas)</button>
    </div>
  </div>
  <div class="menu-wrap">
    <button id="btnAlign" title="Alinear la selección (al lienzo, o entre sí con selección múltiple)">Alinear ▾</button>
    <div class="menu left" id="alignMenu">
      <button data-align="l">⇤ Izquierda</button>
      <button data-align="c">↔ Centro horizontal</button>
      <button data-align="r">⇥ Derecha</button>
      <hr>
      <button data-align="t">⤒ Arriba</button>
      <button data-align="m">↕ Centro vertical</button>
      <button data-align="b">⤓ Abajo</button>
    </div>
  </div>
  <div class="sep"></div>
  <button id="btnGrid" class="toolbtn" title="Mostrar cuadrícula">▦</button>
  <button id="btnSnap" class="toolbtn" title="Imán: ajustar a la cuadrícula">🧲</button>
  <input type="number" id="gridSize" min="2" value="20" style="width:46px" title="Tamaño de cuadrícula">
  <div class="sep"></div>
  <label>Lienzo</label>
  <input type="number" id="docW" min="1" title="Ancho">
  <span style="color:var(--txt2)">×</span>
  <input type="number" id="docH" min="1" title="Alto">
  <label>Fondo</label><input type="color" id="docBg" title="Color de fondo (solo vista)">
  <div class="grow"></div>
  <button id="btnAutoKey" title="Auto-keyframe: al editar con animación activa se crean claves automáticamente">⏺ Auto-clave</button>
  <div class="sep"></div>
  <button class="toolbtn" id="btnOnion" title="Papel cebolla: fantasmas de fotogramas vecinos">🧅</button>
  <button class="toolbtn" id="btnDetach" title="Lienzo desacoplable: espejo en ventana aparte (segunda pantalla)">🗗</button>
  <div class="sep"></div>
  <button id="btnSave" title="Guardar proyecto (Ctrl+S). La primera vez eliges archivo; después escribe en el mismo.">💾 Guardar</button>
  <label>Auto:</label>
  <select id="autoSel" title="Autoguardado al archivo elegido + copia de seguridad en el navegador">
    <option value="0">off</option><option value="30">30 s</option><option value="60">1 min</option>
    <option value="120">2 min</option><option value="300">5 min</option>
  </select>
  <div class="sep"></div>
  <button id="btnImport" title="Importar SVG o animaciones Lottie (.json), con selección múltiple y sin restricciones">📂 Importar SVG/Lottie</button>
  <div class="menu-wrap">
    <button id="btnExport" title="Exportar sin restricciones ni marcas de agua">⬇ Exportar ▾</button>
    <div class="menu" id="exportMenu">
      <button data-export="svg">SVG estático (fotograma actual)</button>
      <button data-export="css">SVG animado — CSS</button>
      <button data-export="smil">SVG animado — SMIL (nativo)</button>
      <button data-export="js">SVG animado — JavaScript</button>
      <button data-export="gsap">Código GSAP (HTML + timeline)</button>
      <button data-export="png">PNG (fotograma actual)</button>
      <hr>
      <button data-export="project">Guardar proyecto (.json)</button>
      <button data-export="openproject">Abrir proyecto (.json)</button>
    </div>
  </div>
  <input type="file" id="fileImport" accept=".svg,.json,.lottie,image/svg+xml,application/json" multiple style="display:none">
  <input type="file" id="fileProject" accept=".json,application/json" style="display:none">
</div>

<!-- ============ PANEL DE CAPAS ============ -->
<div id="layersPanel">
  <div id="layerResizeHandle" title="Arrastra para redimensionar el panel"></div>
  <div id="colStrip"><button class="mini" id="btnColR" title="Expandir columna">⏵</button></div>
  <div class="panel-title" data-sec="layersList"><span><span class="chev">▾</span>Capas</span>
    <span>
      <button class="mini" id="btnLayerUp" title="Subir capa">▲</button>
      <button class="mini" id="btnLayerDown" title="Bajar capa">▼</button>
      <button class="mini" id="btnLayerDup" title="Duplicar capa">⧉</button>
      <button class="mini" id="btnLayerDel" title="Eliminar capa (Supr)">🗑</button>
      <button class="mini" id="btnColL" title="Colapsar columna">⏴</button>
    </span>
  </div>
  <div id="layersList" class="secBody"></div>
  <div class="panel-title" data-sec="scenesList"><span><span class="chev">▾</span>Escenas</span>
    <span><button class="mini" id="btnSceneAdd" title="Añadir escena">＋</button></span>
  </div>
  <div id="scenesList" class="secBody"></div>
  <div class="panel-title" data-sec="routesList"><span><span class="chev">▾</span>Rutas de animación</span>
    <span>
      <button class="mini" id="btnRoutesEye" title="Mostrar todas las rutas en el lienzo">👁</button>
      <button class="mini" id="btnRouteAdd" title="Añadir ruta predefinida o desde el trazado seleccionado">＋</button>
    </span>
  </div>
  <div id="routesList" class="secBody"></div>
</div>
<!-- Menú de rutas: fuera del panel para evitar el clipping por overflow:hidden -->
<div id="routeMenu" class="menu">
  <button data-rp="lr">Línea →</button><button data-rp="rl">Línea ←</button>
  <button data-rp="ud">Línea ↓</button><button data-rp="du">Línea ↑</button>
  <button data-rp="diag">Diagonal</button><button data-rp="circle">Círculo</button>
  <button data-rp="square">Cuadrado</button><button data-rp="eight">Ocho</button>
  <button data-rp="wave">Onda</button><button data-rp="zigzag">Zigzag</button>
  <button data-rp="bounce">Rebote</button><button data-rp="spiral">Espiral</button>
  <hr><button data-rp="fromsel">Desde el trazado seleccionado</button>
</div>

<!-- ============ LIENZO ============ -->
<div id="canvasArea">
  <div id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <canvas id="rulerX"></canvas>
  <canvas id="rulerY"></canvas>
  <div id="rulerOriginH"></div>
  <div id="rulerOriginV"></div>
  <div id="rulerCorner" title="Arrastra para mover el origen de las reglas · Doble clic para restablecer"></div>
  <div id="zoomHud">
    <button class="mini" id="zoomOut">−</button>
    <span id="zoomPct" style="min-width:42px;text-align:center">100%</span>
    <button class="mini" id="zoomIn">+</button>
    <button class="mini" id="zoomFit" title="Ajustar a la ventana">⛶</button>
  </div>
  <div id="hint"></div>
</div>

<!-- ============ PANEL DE PROPIEDADES ============ -->
<div id="propsPanel">
  <div class="panel-title">Propiedades</div>
  <div id="propsBody"><div class="empty-note">Selecciona un elemento para editar sus propiedades.<br><br>Atajos: V selección · R rectángulo · E elipse · L línea · P pluma · T texto · Espacio reproducir · Supr eliminar · Ctrl+Z deshacer.</div></div>
</div>

<!-- ============ LÍNEA DE TIEMPO ============ -->
<div id="timeline">
  <div id="tlResize" title="Arrastra para cambiar la altura de la línea de tiempo"></div>
  <div id="tControls">
    <button class="mini" id="btnToStart" title="Ir al inicio">⏮</button>
    <button id="btnPlay" class="toolbtn" title="Reproducir/Pausa (Espacio)">▶</button>
    <span id="timeLabel">0.00s</span>
    <label>Dur.</label>
    <input type="number" id="docDur" min="0.1" step="0.1" style="width:52px" title="Duración (s)">
    <button class="mini" id="btnLoop" title="Repetir">🔁</button>
    <select id="speedSel" title="Velocidad de reproducción (no afecta a la exportación)" style="width:48px">
      <option value="0.25">¼×</option><option value="0.5">½×</option>
      <option value="1" selected>1×</option><option value="2">2×</option>
    </select>
    <button class="mini" id="tlZoomOut" title="Alejar línea de tiempo">⊖</button>
    <button class="mini" id="tlZoomIn" title="Acercar línea de tiempo">⊕</button>
  </div>
  <div id="tRulerWrap"><div id="tRuler"></div><div id="rulerPlayhead"></div></div>

<!-- Popup de easing para keyframes -->
<div id="kfEasing">
  <label>Easing</label>
  <select id="kfEasingSel">
    <option value="linear">Lineal</option>
    <option value="easeIn">Ease In</option>
    <option value="easeOut">Ease Out</option>
    <option value="easeInOut">Ease In-Out</option>
    <option value="step">Escalón</option>
    <option value="expoIn">Expo In</option>
    <option value="expoOut">Expo Out</option>
    <option value="backIn">Back In (anticipación)</option>
    <option value="backOut">Back Out (rebasa)</option>
    <option value="elasticIn">Elástico In</option>
    <option value="elasticOut">Elástico Out</option>
    <option value="bounceIn">Rebote In</option>
    <option value="bounceOut">Rebote Out</option>
    <option value="custom">Personalizada…</option>
  </select>
  <input type="number" id="kfTime" step="0.01" min="0" style="width:62px" title="Tiempo (s)">
  <button class="mini danger" id="kfDelete" title="Eliminar keyframe">🗑</button>
  <div id="curveEd"><svg id="curveSvg" width="180" height="140"></svg></div>
</div>

<script>
'use strict';
/* ================================================================
   VectorMotion — Editor SVG con animación por keyframes
   Código original. Sin restricciones de importación/exportación.
   ================================================================ */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const uid = ()=> 'el'+Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => Math.abs(n-Math.round(n))<1e-6 ? String(Math.round(n)) : (+(+n).toFixed(3)).toString();

/* ---------------- Estado ---------------- */
let doc = { w:800, h:600, dur:3, bg:'#ffffff', defs:'', layers:[], routes:[], scenes:[] };
let anims = {};   // { layerId: { prop: [{t,v,ease}] } }
const S = {
  tool:'select', sel:null, selSet:new Set(), T:0, playing:false, loop:true, autoKey:false,
  zoom:1, panX:60, panY:40,
  selKf:null, expanded:{},
  penPts:[], penActive:false,
  nodeEdit:null,   // {id|routeId, subs:[{nodes:[{x,y,hin,hout,smooth}],closed}], sel:{si,ni}}
  grid:{show:false, snap:false, size:20},
  showRoutes:false, routeHover:null, onion:false, speed:1, abA:null, abB:null,
  rulerOX:0, rulerOY:0  // offset del origen de las reglas en unidades del lienzo
};
const DEF_BASE = {tx:0,ty:0,rot:0,sx:1,sy:1,skx:0,sky:0,opacity:1,mp:0,draw:100};
const ANIM_PROPS = [
  ['tx','Posición X'],['ty','Posición Y'],['rot','Rotación'],
  ['sx','Escala X'],['sy','Escala Y'],['skx','Sesgo X'],['sky','Sesgo Y'],
  ['opacity','Opacidad'],['fill','Color'],['mp','Trayecto %'],
  ['draw','Dibujo %'],['geom','Geometría']
];
const PROP_LABEL = Object.fromEntries(ANIM_PROPS);

const canvas = $('#canvas');
const nodeMap = {}; // id -> <g>

/* ---------------- Easing ---------------- */
const EASE = {
  linear: t=>t,
  easeIn: t=>t*t,
  easeOut: t=>t*(2-t),
  easeInOut: t=> t<0.5 ? 2*t*t : -1+(4-2*t)*t,
  step: t=> t<1 ? 0 : 1,
  expoIn: t=> t<=0?0:Math.pow(2,10*t-10),
  expoOut: t=> t>=1?1:1-Math.pow(2,-10*t),
  backIn: t=>{const c=1.70158;return t*t*((c+1)*t-c);},
  backOut: t=>{const c=1.70158,u=t-1;return 1+u*u*((c+1)*u+c);},
  elasticIn: t=> t<=0?0:t>=1?1:-Math.pow(2,10*t-10)*Math.sin((t*10-10.75)*(2*Math.PI/3)),
  elasticOut: t=> t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI/3))+1,
  bounceOut: t=>{const n=7.5625,d=2.75;
    if(t<1/d)return n*t*t;
    if(t<2/d){t-=1.5/d;return n*t*t+0.75;}
    if(t<2.5/d){t-=2.25/d;return n*t*t+0.9375;}
    t-=2.625/d;return n*t*t+0.984375;},
  bounceIn: t=>1-EASE.bounceOut(1-t)
};
const lerp = (a,b,t)=>a+(b-a)*t;
function cubicBezierEase(x1,y1,x2,y2){
  const bx=t=>3*t*(1-t)*(1-t)*x1+3*t*t*(1-t)*x2+t*t*t;
  const by=t=>3*t*(1-t)*(1-t)*y1+3*t*t*(1-t)*y2+t*t*t;
  return x=>{
    if(x<=0)return 0; if(x>=1)return 1;
    let lo=0,hi=1,t=x;
    for(let i=0;i<24;i++){ const cx=bx(t); if(Math.abs(cx-x)<1e-5)break; if(cx<x)lo=t;else hi=t; t=(lo+hi)/2; }
    return by(t);
  };
}
const easeLabel = e => (e&&e.cb)?'personalizada':(e||'linear');
function easeF(e){
  if(e&&e.cb) return cubicBezierEase(e.cb[0],e.cb[1],e.cb[2],e.cb[3]);
  return EASE[e]||EASE.linear;
}
function hexRgb(c){
  if(typeof c!=='string') return null;
  c=c.trim();
  let m=c.match(/^#([0-9a-f]{3})$/i);
  if(m) return m[1].split('').map(h=>parseInt(h+h,16));
  m=c.match(/^#([0-9a-f]{6})$/i);
  if(m) return [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16));
  m=c.match(/^rgba?\(([^)]+)\)/i);
  if(m) return m[1].split(',').slice(0,3).map(Number);
  return null;
}
const rgbHex = r => '#'+r.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
function mixVal(a,b,t){
  if(typeof a==='number'&&typeof b==='number') return lerp(a,b,t);
  const ra=hexRgb(a), rb=hexRgb(b);
  if(ra&&rb) return rgbHex(ra.map((v,i)=>lerp(v,rb[i],t)));
  return t<1?a:b;
}

/* ---------------- Modelo ---------------- */
const getLayer = id => doc.layers.find(l=>l.id===id);
const selLayer = ()=> S.sel ? getLayer(S.sel) : null;
const selLayers = ()=> doc.layers.filter(l=>S.selSet.has(l.id));
const keysOf = (id,prop)=> (anims[id]&&anims[id][prop])||null;
const ctr = l => l.origin ? [l.origin.x,l.origin.y] : [l._cx||0,l._cy||0];

function baseVal(l,prop){
  if(prop==='fill') return l.attrs.fill!==undefined ? l.attrs.fill : (l.attrs.stroke||'#7c5cff');
  const v=l.base[prop];
  return v===undefined?DEF_BASE[prop]:v;
}
function valAt(l,prop,T){
  if(prop==='geom') return geomAt(l,T);
  const ks = keysOf(l.id,prop);
  if(!ks||!ks.length) return baseVal(l,prop);
  if(T<=ks[0].t) return ks[0].v;
  if(T>=ks[ks.length-1].t) return ks[ks.length-1].v;
  for(let i=0;i<ks.length-1;i++){
    const a=ks[i], b=ks[i+1];
    if(T>=a.t && T<=b.t){
      const span=b.t-a.t||1e-9;
      const e=easeF(a.ease)((T-a.t)/span);
      return mixVal(a.v,b.v,e);
    }
  }
  return baseVal(l,prop);
}
function setKeyAt(l,prop,t,v,ease){
  anims[l.id]=anims[l.id]||{};
  const ks=anims[l.id][prop]=anims[l.id][prop]||[];
  const ex=ks.find(k=>Math.abs(k.t-t)<1e-4);
  if(ex){ ex.v=v; if(ease)ex.ease=ease; }
  else { ks.push({t:+t.toFixed(4),v,ease:ease||'linear'}); ks.sort((a,b)=>a.t-b.t); }
}
function removeKey(l,prop,idx){
  const ks=keysOf(l.id,prop); if(!ks)return;
  ks.splice(idx,1);
  if(!ks.length){ delete anims[l.id][prop]; if(!Object.keys(anims[l.id]).length) delete anims[l.id]; }
}
function writeProp(l,prop,v){
  if(keysOf(l.id,prop)) setKeyAt(l,prop,S.T,v);
  else if(S.autoKey){ setKeyAt(l,prop,S.T,v); setBase(l,prop,v); }
  else setBase(l,prop,v);
}
function setBase(l,prop,v){
  if(prop==='geom'){ if(v&&v.tp){ l.type=v.tp; l.attrs=JSON.parse(JSON.stringify(v.at)); } return; }
  if(prop==='fill'){ if(l.attrs.fill!==undefined) l.attrs.fill=v; else l.attrs.stroke=v; }
  else l.base[prop]=v;
}

/* ---------------- Historial ---------------- */
const undoStack=[], redoStack=[];
function snapshot(){
  undoStack.push(JSON.stringify({doc,anims}));
  if(undoStack.length>60) undoStack.shift();
  redoStack.length=0;
}
function restore(json){
  const s=JSON.parse(json);
  doc=s.doc; anims=s.anims;
  if(S.sel && !getLayer(S.sel)) S.sel=null;
  S.selSet=new Set([...S.selSet].filter(id=>getLayer(id)));
  S.nodeEdit=null;
  refresh();
}
function undo(){ if(!undoStack.length)return; redoStack.push(JSON.stringify({doc,anims})); restore(undoStack.pop()); }
function redo(){ if(!redoStack.length)return; undoStack.push(JSON.stringify({doc,anims})); restore(redoStack.pop()); }
let _editSnap=false;
function editSnap(){ if(!_editSnap){snapshot(); _editSnap=true; setTimeout(()=>_editSnap=false,800);} }

/* ---------------- Geometría de polígonos ---------------- */
function polyPoints(a){
  const n=Math.max(3,Math.round(a.sides||5)), pts=[];
  const star=!!a.star, ir=clamp(a.ir===undefined?0.5:a.ir,0.05,1);
  const steps=star?n*2:n;
  for(let i=0;i<steps;i++){
    const r=star&&(i%2===1)?a.r*ir:a.r;
    const ang=-Math.PI/2 + i*2*Math.PI/steps;
    pts.push([a.cx+r*Math.cos(ang), a.cy+r*Math.sin(ang)]);
  }
  return pts;
}

/* ---------------- Render del lienzo ---------------- */
function layerMarkup(l){
  const a=l.attrs;
  const st=(f=1)=>`${f&&a.fill!==undefined?` fill="${esc(a.fill)}"`:''}${a.stroke?` stroke="${esc(a.stroke)}" stroke-width="${a.sw||1}"`:' stroke="none"'}`;
  switch(l.type){
    case 'rect': return `<rect x="${fmt(a.x)}" y="${fmt(a.y)}" width="${fmt(Math.max(0,a.w))}" height="${fmt(Math.max(0,a.h))}" rx="${fmt(a.rx||0)}"${st()}/>`;
    case 'ellipse': return `<ellipse cx="${fmt(a.cx)}" cy="${fmt(a.cy)}" rx="${fmt(Math.max(0,a.rx))}" ry="${fmt(Math.max(0,a.ry))}"${st()}/>`;
    case 'line': return `<line x1="${fmt(a.x1)}" y1="${fmt(a.y1)}" x2="${fmt(a.x2)}" y2="${fmt(a.y2)}" stroke="${esc(a.stroke||'#fff')}" stroke-width="${a.sw||2}" stroke-linecap="round"/>`;
    case 'polygon': return `<polygon points="${polyPoints(a).map(p=>fmt(p[0])+','+fmt(p[1])).join(' ')}"${st()} stroke-linejoin="round"/>`;
    case 'path': return `<path d="${esc(a.d)}"${st()} stroke-linejoin="round" stroke-linecap="round"/>`;
    case 'text': return `<text x="${fmt(a.x)}" y="${fmt(a.y)}" font-size="${a.fs||24}" font-family="${esc(a.ff||'sans-serif')}"`
      +`${a.fw&&a.fw!=='normal'?` font-weight="${esc(a.fw)}"`:''}${a.fst?' font-style="italic"':''}`
      +`${a.td?' text-decoration="underline"':''}${a.ls?` letter-spacing="${fmt(a.ls)}"`:''}`
      +`${a.anchor&&a.anchor!=='start'?` text-anchor="${esc(a.anchor)}"`:''}${st()}>${esc(a.text)}</text>`;
    case 'raw': return l.raw;
  }
  return '';
}
function transformStr(p,cx,cy){
  let s='';
  if(p.tx||p.ty) s+=`translate(${fmt(p.tx)} ${fmt(p.ty)}) `;
  if(p.rot) s+=`rotate(${fmt(p.rot)} ${fmt(cx)} ${fmt(cy)}) `;
  if(p.sx!==1||p.sy!==1||p.skx||p.sky){
    s+=`translate(${fmt(cx)} ${fmt(cy)}) `;
    if(p.sx!==1||p.sy!==1) s+=`scale(${fmt(p.sx)} ${fmt(p.sy)}) `;
    if(p.skx) s+=`skewX(${fmt(p.skx)}) `;
    if(p.sky) s+=`skewY(${fmt(p.sky)}) `;
    s+=`translate(${fmt(-cx)} ${fmt(-cy)})`;
  }
  return s.trim();
}

/* --- medición de trayectorias (motion path) --- */
let measureSvg=null;
const pathCache={};
function pathEl(d){
  if(!measureSvg){
    measureSvg=document.createElementNS(NS,'svg');
    measureSvg.style.cssText='position:absolute;width:0;height:0;overflow:hidden;';
    document.body.appendChild(measureSvg);
  }
  if(!pathCache[d]){
    const keys=Object.keys(pathCache);
    if(keys.length>300){ for(const k of keys){ pathCache[k].el.remove(); delete pathCache[k]; } }
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill','none');
    measureSvg.appendChild(p);
    pathCache[d]={el:p,len:p.getTotalLength()};
  }
  return pathCache[d];
}
function motionAt(l,T){
  if(!l.motion||!l.motion.d) return null;
  try{
    const pc=pathEl(l.motion.d);
    const prog=clamp(valAt(l,'mp',T),0,100)/100;
    const pt=pc.el.getPointAtLength(prog*pc.len);
    let ang=0;
    if(l.motion.orient){
      const d=Math.min(pc.len,Math.max(0.01,prog*pc.len));
      const p2=pc.el.getPointAtLength(Math.min(pc.len,d+0.5));
      const p1=pc.el.getPointAtLength(Math.max(0,d-0.5));
      ang=Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI;
    }
    return {x:pt.x,y:pt.y,ang};
  }catch(e){ return null; }
}

function render(){
  canvas.setAttribute('width',doc.w); canvas.setAttribute('height',doc.h);
  canvas.setAttribute('viewBox',`0 0 ${doc.w} ${doc.h}`);
  canvas.style.background=doc.bg;
  canvas.innerHTML=`<defs>${doc.defs||''}</defs>
    <defs id="edefs"><filter id="onionR"><feColorMatrix type="matrix" values="0.9 0 0 0 0.35  0 0.2 0 0 0  0 0 0.2 0 0  0 0 0 1 0"/></filter>
    <filter id="onionG"><feColorMatrix type="matrix" values="0.2 0 0 0 0  0 0.9 0 0 0.25  0 0 0.2 0 0  0 0 0 1 0"/></filter></defs>
    <g id="gridG"></g><g id="onionG" style="pointer-events:none"></g>`;
  for(const id in nodeMap) delete nodeMap[id];
  for(const l of doc.layers){
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','layer'); g.setAttribute('data-id',l.id);
    g.innerHTML=layerMarkup(l);
    if(!l.visible) g.setAttribute('display','none');
    canvas.appendChild(g);
    try{ const bb=g.getBBox(); l._bb=bb; l._cx=bb.x+bb.width/2; l._cy=bb.y+bb.height/2; }
    catch(e){ l._bb={x:0,y:0,width:0,height:0}; l._cx=0; l._cy=0; }
    nodeMap[l.id]=g;
  }
  const ov=document.createElementNS(NS,'g');
  ov.setAttribute('id','overlay');
  canvas.appendChild(ov);
  drawGrid();
  applyFrame(S.T);
}
function drawGrid(){
  const g=$('#gridG'); if(!g)return;
  if(!S.grid.show){ g.innerHTML=''; return; }
  const sz=Math.max(2,S.grid.size); let h='';
  for(let x=0;x<=doc.w;x+=sz) h+=`<line x1="${x}" y1="0" x2="${x}" y2="${doc.h}"/>`;
  for(let y=0;y<=doc.h;y+=sz) h+=`<line x1="0" y1="${y}" x2="${doc.w}" y2="${y}"/>`;
  g.innerHTML=`<g stroke="#7c5cff" stroke-opacity="0.15" stroke-width="${1/S.zoom}" style="pointer-events:none">${h}</g>`;
}
const snapV = v => S.grid.snap ? Math.round(v/S.grid.size)*S.grid.size : v;
const snapPt = p => S.grid.snap ? {x:snapV(p.x),y:snapV(p.y)} : p;

function effProps(l,T){
  return {
    tx:valAt(l,'tx',T), ty:valAt(l,'ty',T), rot:valAt(l,'rot',T),
    sx:valAt(l,'sx',T), sy:valAt(l,'sy',T), skx:valAt(l,'skx',T), sky:valAt(l,'sky',T),
    opacity:valAt(l,'opacity',T), fill:valAt(l,'fill',T), mp:valAt(l,'mp',T),
    draw:valAt(l,'draw',T)
  };
}
function applyFrame(T){
  for(const l of doc.layers){
    const g=nodeMap[l.id]; if(!g) continue;
    if(keysOf(l.id,'geom')){
      const gm=geomAt(l,T);
      const mk=layerMarkup({type:gm.tp,attrs:gm.at,raw:l.raw});
      if(g._mk!==mk){
        g.innerHTML=mk; g._mk=mk;
        try{ const bb=g.getBBox(); l._bb=bb; l._cx=bb.x+bb.width/2; l._cy=bb.y+bb.height/2; }catch(e){}
      }
    }
    const sf=sceneFactorAt(l,T);
    if(sf.hidden||!l.visible){ g.setAttribute('display','none'); continue; }
    g.removeAttribute('display');
    const p=effProps(l,T); const [cx,cy]=ctr(l);
    let tr='';
    if(sf.tx||sf.ty) tr+=`translate(${fmt(sf.tx)} ${fmt(sf.ty)}) `;
    if(sf.sc!==1) tr+=`translate(${fmt(doc.w/2)} ${fmt(doc.h/2)}) scale(${fmt(sf.sc)}) translate(${fmt(-doc.w/2)} ${fmt(-doc.h/2)}) `;
    const m=motionAt(l,T);
    if(m) tr+=`translate(${fmt(m.x-cx)} ${fmt(m.y-cy)})${m.ang?` rotate(${fmt(m.ang)} ${fmt(cx)} ${fmt(cy)})`:''} `;
    tr+=transformStr(p,cx,cy);
    g.setAttribute('transform',tr.trim());
    g.setAttribute('opacity',fmt(p.opacity*sf.op));
    const sh=g.firstElementChild;
    if(sh&&keysOf(l.id,'fill')){ if(l.type==='line') sh.setAttribute('stroke',p.fill); else sh.setAttribute('fill',p.fill); }
    if(sh&&sh.getTotalLength&&l.type!=='text'&&l.type!=='raw'&&(keysOf(l.id,'draw')||p.draw<100)){
      sh.setAttribute('pathLength','1');
      sh.setAttribute('stroke-dasharray','1');
      sh.setAttribute('stroke-dashoffset',fmt(1-clamp(p.draw,0,100)/100));
    }
  }
  renderOnion(T);
  mirrorFrame();
  drawOverlay();
}
function layerMatrix(l,T){
  const p=effProps(l,T); const [cx,cy]=ctr(l);
  let mtx=new DOMMatrix();
  const m=motionAt(l,T);
  if(m){
    mtx=mtx.translate(m.x-cx,m.y-cy);
    if(m.ang) mtx=mtx.translate(cx,cy).rotate(m.ang).translate(-cx,-cy);
  }
  return mtx.translate(p.tx,p.ty).translate(cx,cy).rotate(p.rot)
    .scale(p.sx,p.sy).skewX(p.skx).skewY(p.sky).translate(-cx,-cy);
}

/* ---------------- Overlay de selección ---------------- */
function worldCorners(l){
  const m=layerMatrix(l,S.T), bb=l._bb||{x:0,y:0,width:0,height:0};
  return [[bb.x,bb.y],[bb.x+bb.width,bb.y],[bb.x+bb.width,bb.y+bb.height],[bb.x,bb.y+bb.height]]
    .map(([x,y])=>m.transformPoint(new DOMPoint(x,y)));
}
function worldBBox(l){
  const cs=worldCorners(l);
  const xs=cs.map(p=>p.x), ys=cs.map(p=>p.y);
  return {x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys)};
}
function drawOverlay(){
  const ov=$('#overlay'); if(!ov)return;
  ov.innerHTML='';
  if(S.penActive && S.penPts.length){
    const d=subToD({nodes:S.penPts,closed:false});
    ov.innerHTML+=`<path d="${d}" fill="none" stroke="#00c2a8" stroke-width="${1.5/S.zoom}" stroke-dasharray="${4/S.zoom}" style="pointer-events:none"/>`+
      S.penPts.map(n=>{
        let h='';
        for(const w of ['hin','hout']) if(n[w])
          h+=`<line x1="${n.x}" y1="${n.y}" x2="${n[w].x}" y2="${n[w].y}" stroke="#00c2a8" stroke-width="${0.8/S.zoom}" opacity=".7"/>`
            +`<circle cx="${n[w].x}" cy="${n[w].y}" r="${2.5/S.zoom}" fill="#00c2a8"/>`;
        return h+`<circle cx="${n.x}" cy="${n.y}" r="${3/S.zoom}" fill="#fff" stroke="#00c2a8" stroke-width="${1/S.zoom}"/>`;
      }).join('');
  }
  if(gesture&&gesture.kind==='routedraw'&&gesture.pts.length>1){
    ov.innerHTML+=`<polyline points="${gesture.pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ffb454" stroke-width="${1.5/S.zoom}" stroke-dasharray="${5/S.zoom}" style="pointer-events:none"/>`;
  }
  // rutas de la biblioteca (hover / todas / en edición)
  const routesToShow=new Set();
  if(S.showRoutes) doc.routes.forEach(r=>routesToShow.add(r.id));
  if(S.routeHover) routesToShow.add(S.routeHover);
  if(S.nodeEdit&&S.nodeEdit.routeId) routesToShow.add(S.nodeEdit.routeId);
  for(const rid of routesToShow){
    const r=getRoute(rid); if(!r)continue;
    ov.innerHTML+=routeMarkup(r.d, S.nodeEdit&&S.nodeEdit.routeId===rid);
  }
  if(S.tool==='node'){ drawNodeOverlay(ov); return; }
  if(S.tool!=='select') return;
  for(const l of selLayers()){
    if(l.id===S.sel || !l._bb) continue;
    const cs=worldCorners(l);
    ov.innerHTML+=`<polygon points="${cs.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#00c2a8" stroke-width="${1/S.zoom}" stroke-dasharray="${3/S.zoom}" style="pointer-events:none"/>`;
  }
  const l=selLayer();
  if(!l || !l._bb) return;
  if(l.motion&&l.motion.d)
    ov.innerHTML+=routeMarkup(l.motion.d,false);
  const m=layerMatrix(l,S.T), bb=l._bb;
  const cs=worldCorners(l);
  const hs=8/S.zoom;
  let html=`<polygon points="${cs.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#7c5cff" stroke-width="${1.5/S.zoom}" style="pointer-events:none"/>`;
  cs.forEach((p,i)=>{
    html+=`<rect data-handle="scale" data-corner="${i}" x="${p.x-hs/2}" y="${p.y-hs/2}" width="${hs}" height="${hs}" fill="#fff" stroke="#7c5cff" stroke-width="${1/S.zoom}" style="cursor:nwse-resize"/>`;
  });
  const [cx,cy]=ctr(l);
  const topMid=m.transformPoint(new DOMPoint(l._cx,bb.y-24/S.zoom));
  const tm2=m.transformPoint(new DOMPoint(l._cx,bb.y));
  html+=`<line x1="${tm2.x}" y1="${tm2.y}" x2="${topMid.x}" y2="${topMid.y}" stroke="#7c5cff" stroke-width="${1/S.zoom}" style="pointer-events:none"/>`;
  html+=`<circle data-handle="rotate" cx="${topMid.x}" cy="${topMid.y}" r="${hs*0.7}" fill="#7c5cff" stroke="#fff" stroke-width="${1/S.zoom}" style="cursor:grab"/>`;
  const oPt=m.transformPoint(new DOMPoint(cx,cy));
  html+=`<g data-handle="origin" style="cursor:move">
    <circle cx="${oPt.x}" cy="${oPt.y}" r="${hs*0.55}" fill="none" stroke="#e94560" stroke-width="${1.2/S.zoom}"/>
    <line x1="${oPt.x-hs*0.9}" y1="${oPt.y}" x2="${oPt.x+hs*0.9}" y2="${oPt.y}" stroke="#e94560" stroke-width="${1/S.zoom}"/>
    <line x1="${oPt.x}" y1="${oPt.y-hs*0.9}" x2="${oPt.x}" y2="${oPt.y+hs*0.9}" stroke="#e94560" stroke-width="${1/S.zoom}"/>
  </g>`;
  ov.innerHTML+=html;
}

/* ---------------- Vista (zoom / pan / reglas) ---------------- */
const area=$('#canvasArea'), wrap=$('#canvasWrap');
function updateView(){
  wrap.style.transform=`translate(${S.panX}px,${S.panY}px) scale(${S.zoom})`;
  $('#zoomPct').textContent=Math.round(S.zoom*100)+'%';
  drawRulers();
  drawOverlay();
}
function niceStep(minUnits){
  const steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000];
  for(const s of steps) if(s>=minUnits) return s;
  return 10000;
}
function drawRulers(){
  const rx=$('#rulerX'), ry=$('#rulerY');
  if(!rx||!ry) return;
  const W=area.clientWidth-22, H=area.clientHeight-22;
  const dpr=window.devicePixelRatio||1;
  const step=niceStep(50/S.zoom);
  const font='10px sans-serif', bg='#1f2128', fg='#8b8e99', ln='#33363f', ac='#00c2a8';
  // Posición en píxeles del origen (0,0) del lienzo con el offset de la regla
  const originScreenX = S.panX + S.rulerOX * S.zoom - 22; // px en el canvas del rulerX
  const originScreenY = S.panY + S.rulerOY * S.zoom - 22; // px en el canvas del rulerY

  rx.width=W*dpr; rx.height=22*dpr; rx.style.width=W+'px'; rx.style.height='22px';
  let c=rx.getContext('2d'); c.scale(dpr,dpr);
  c.fillStyle=bg; c.fillRect(0,0,W,22);
  c.strokeStyle=ln; c.beginPath(); c.moveTo(0,21.5); c.lineTo(W,21.5); c.stroke();
  c.fillStyle=fg; c.font=font; c.strokeStyle=ln;
  // u0: primera marca visible en unidades del lienzo relativas al origen de la regla
  const u0=Math.floor((-(S.panX-22)/S.zoom - S.rulerOX)/step)*step;
  for(let u=u0;;u+=step){
    const x=S.panX+(u+S.rulerOX)*S.zoom-22;
    if(x>W)break; if(x<-40)continue;
    const isOrigin=(u===0);
    c.strokeStyle=isOrigin?ac:ln;
    c.beginPath(); c.moveTo(x,isOrigin?8:14); c.lineTo(x,22); c.stroke();
    c.fillStyle=isOrigin?ac:fg;
    c.fillText(fmt(u),x+3,11);
    c.strokeStyle=ln; c.fillStyle=fg;
    const sub=step/5;
    for(let k=1;k<5;k++){ const xs=x+k*sub*S.zoom; if(xs<0||xs>W)continue; c.beginPath(); c.moveTo(xs,18); c.lineTo(xs,22); c.stroke(); }
  }
  // Triángulo indicador del origen en la regla X
  if(originScreenX>=0 && originScreenX<=W){
    c.fillStyle=ac; c.beginPath(); c.moveTo(originScreenX,22); c.lineTo(originScreenX-4,14); c.lineTo(originScreenX+4,14); c.closePath(); c.fill();
  }

  ry.width=22*dpr; ry.height=H*dpr; ry.style.width='22px'; ry.style.height=H+'px';
  c=ry.getContext('2d'); c.scale(dpr,dpr);
  c.fillStyle=bg; c.fillRect(0,0,22,H);
  c.strokeStyle=ln; c.beginPath(); c.moveTo(21.5,0); c.lineTo(21.5,H); c.stroke();
  c.fillStyle=fg; c.font=font;
  const v0=Math.floor((-(S.panY-22)/S.zoom - S.rulerOY)/step)*step;
  for(let u=v0;;u+=step){
    const y=S.panY+(u+S.rulerOY)*S.zoom-22;
    if(y>H)break; if(y<-40)continue;
    const isOrigin=(u===0);
    c.strokeStyle=isOrigin?ac:ln;
    c.beginPath(); c.moveTo(isOrigin?8:14,y); c.lineTo(22,y); c.stroke();
    c.save(); c.translate(11,y+3); c.rotate(-Math.PI/2);
    c.fillStyle=isOrigin?ac:fg;
    c.fillText(fmt(u),-c.measureText(fmt(u)).width,0); c.restore();
    c.strokeStyle=ln; c.fillStyle=fg;
    const sub=step/5;
    for(let k=1;k<5;k++){ const ys=y+k*sub*S.zoom; if(ys<0||ys>H)continue; c.beginPath(); c.moveTo(18,ys); c.lineTo(22,ys); c.stroke(); }
  }
  // Triángulo indicador del origen en la regla Y
  if(originScreenY>=0 && originScreenY<=H){
    c.fillStyle=ac; c.beginPath(); c.moveTo(22,originScreenY); c.lineTo(14,originScreenY-4); c.lineTo(14,originScreenY+4); c.closePath(); c.fill();
  }
}
function zoomAt(f,cx,cy){
  const z=clamp(S.zoom*f,0.05,32);
  const r=area.getBoundingClientRect();
  const x=(cx??(r.left+r.width/2))-r.left, y=(cy??(r.top+r.height/2))-r.top;
  S.panX=x-(x-S.panX)*(z/S.zoom); S.panY=y-(y-S.panY)*(z/S.zoom); S.zoom=z;
  drawGrid(); updateView();
}
function zoomFit(){
  const r=area.getBoundingClientRect();
  S.zoom=clamp(Math.min((r.width-90)/doc.w,(r.height-90)/doc.h),0.05,32);
  S.panX=(r.width-doc.w*S.zoom)/2; S.panY=(r.height-doc.h*S.zoom)/2+8;
  drawGrid(); updateView();
}
area.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){ zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY); return; }
  if(e.shiftKey) S.panX-=e.deltaY;
  else { S.panY-=e.deltaY; S.panX-=e.deltaX; }
  updateView();
},{passive:false});
$('#zoomIn').onclick=()=>zoomAt(1.25);
$('#zoomOut').onclick=()=>zoomAt(1/1.25);
$('#zoomFit').onclick=zoomFit;

function svgPt(e){
  const m=canvas.getScreenCTM(); if(!m) return {x:0,y:0};
  return new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
}

/* ---------------- Agrupar / Desagrupar / Unión ---------------- */
function bakedMarkup(l){
  const p=effProps(l,0); const [cx,cy]=ctr(l);
  const tr=transformStr(p,cx,cy);
  return `<g${tr?` transform="${tr}"`:''}${p.opacity!==1?` opacity="${fmt(p.opacity)}"`:''}>${layerMarkup(l)}</g>`;
}
function groupSelection(){
  const ls=selLayers(); if(ls.length<1){showHint('Selecciona una o más capas para agrupar');return;}
  const animated=ls.some(l=>anims[l.id]&&Object.keys(anims[l.id]).length);
  if(animated && !confirm('Al agrupar se pierden las animaciones de las capas individuales (el grupo se anima como un conjunto). ¿Continuar?')) return;
  snapshot();
  const inner=ls.map(bakedMarkup).join('');
  const ids=new Set(ls.map(l=>l.id));
  const idx=doc.layers.findIndex(l=>ids.has(l.id));
  doc.layers=doc.layers.filter(l=>!ids.has(l.id));
  ids.forEach(id=>delete anims[id]);
  const g={ id:uid(), name:'Grupo', type:'raw', attrs:{}, raw:`<g>${inner}</g>`,
    base:{...DEF_BASE}, visible:true, locked:false };

  selectOnly(g.id);

}
function ungroupSelection(){
  const l=selLayer();
  if(!l||l.type!=='raw'){showHint('Selecciona un grupo (o SVG importado) para desagrupar');return;}
  const tmp=document.createElementNS(NS,'svg');
  tmp.innerHTML=l.raw;
  let nodes=[...tmp.children];
  if(nodes.length===1&&nodes[0].nodeName.toLowerCase()==='g'&&!nodes[0].getAttribute('transform')) nodes=[...nodes[0].children];
  if(!nodes.length){showHint('Nada que desagrupar');return;}
  snapshot();
  const idx=doc.layers.findIndex(x=>x.id===l.id);
  const p=effProps(l,0); const [cx,cy]=ctr(l);
  const tr=transformStr(p,cx,cy);
  const newLayers=nodes.map((n,i)=>{
    const raw=tr?`<g transform="${tr}">${n.outerHTML}</g>`:n.outerHTML;
    return { id:uid(), name:l.name+' '+(i+1), type:'raw', attrs:{}, raw,
      base:{...DEF_BASE}, visible:true, locked:false };
  });
  doc.layers.splice(idx,1,...newLayers);
  delete anims[l.id];
  S.selSet=new Set(newLayers.map(n=>n.id)); S.sel=newLayers[0].id;
  refresh();
}
/* --- conversión de formas a path y unión --- */
function shapeToD(l){
  const a=l.attrs, K=0.5522847498;
  switch(l.type){
    case 'rect':{
      const x=a.x,y=a.y,w=a.w,h=a.h;
      return [['M',x,y],['L',x+w,y],['L',x+w,y+h],['L',x,y+h],['Z']];
    }
    case 'ellipse':{
      const {cx,cy,rx,ry}=a, kx=K*rx, ky=K*ry;
      return [['M',cx+rx,cy],
        ['C',cx+rx,cy+ky, cx+kx,cy+ry, cx,cy+ry],
        ['C',cx-kx,cy+ry, cx-rx,cy+ky, cx-rx,cy],
        ['C',cx-rx,cy-ky, cx-kx,cy-ry, cx,cy-ry],
        ['C',cx+kx,cy-ry, cx+rx,cy-ky, cx+rx,cy],['Z']];
    }
    case 'polygon':{
      const pts=polyPoints(a);
      return [['M',...pts[0]],...pts.slice(1).map(p=>['L',...p]),['Z']];
    }
    case 'path': return parseD(a.d);
  }
  return null;
}
function parseD(d){
  const out=[]; let cur=[0,0];
  const re=/([MLHVCQZ])([^MLHVCQZ]*)/gi;
  let m;
  while((m=re.exec(d))){
    const cmd=m[1].toUpperCase();
    if(m[1]!==cmd) throw new Error('rel');
    const nums=(m[2].match(/-?\d*\.?\d+(?:e-?\d+)?/gi)||[]).map(Number);
    if(cmd==='Z'){ out.push(['Z']); continue; }
    if(cmd==='H'){ for(const n of nums){ out.push(['L',n,cur[1]]); cur=[n,cur[1]]; } continue; }
    if(cmd==='V'){ for(const n of nums){ out.push(['L',cur[0],n]); cur=[cur[0],n]; } continue; }
    const size={M:2,L:2,C:6,Q:4}[cmd];
    if(!size) throw new Error('cmd');
    for(let i=0;i+size<=nums.length;i+=size){
      out.push([cmd,...nums.slice(i,i+size)]);
      cur=[nums[i+size-2],nums[i+size-1]];
    }
  }
  return out;
}
function dToStr(cmds){
  return cmds.map(c=>c[0]+c.slice(1).map(fmt).join(' ')).join(' ');
}
function unionSelection(){
  const ls=selLayers().filter(l=>['rect','ellipse','polygon','path'].includes(l.type));
  if(ls.length<2){showHint('Selecciona 2+ formas (rect., elipse, polígono o trazado) para unir');return;}
  let all=[];
  try{
    for(const l of ls){
      const cmds=shapeToD(l);
      if(!cmds) throw new Error('tipo');
      const m=layerMatrix(l,S.T);
      all=all.concat(cmds.map(c=>{
        if(c[0]==='Z')return ['Z'];
        const o=[c[0]];
        for(let i=1;i<c.length;i+=2){
          const p=m.transformPoint(new DOMPoint(c[i],c[i+1]));
          o.push(p.x,p.y);
        }
        return o;
      }));
    }
  }catch(e){ alert('Alguna forma tiene comandos de trazado no compatibles con la unión (arcos o coordenadas relativas).'); return; }
  snapshot();
  const first=ls[0];
  const ids=new Set(ls.map(l=>l.id));
  const idx=doc.layers.findIndex(l=>ids.has(l.id));
  doc.layers=doc.layers.filter(l=>!ids.has(l.id));
  ids.forEach(id=>delete anims[id]);
  const nl={ id:uid(), name:'Unión', type:'path',
    attrs:{d:dToStr(all), fill:first.attrs.fill||'#7c5cff', stroke:first.attrs.stroke||'', sw:first.attrs.sw||1},
    base:{...DEF_BASE}, visible:true, locked:false };
  doc.layers.splice(idx,0,nl);
  selectOnly(nl.id);
  refresh();
  showHint('Unión creada (subtrazados combinados con regla nonzero)');
}
/* --- suavizar trazado de pluma (Catmull-Rom → Bézier) --- */
function smoothSelection(){
  const l=selLayer();
  if(!l||l.type!=='path'){showHint('Selecciona un trazado para suavizar');return;}
  let cmds;
  try{ cmds=parseD(l.attrs.d); }catch(e){ alert('Trazado no compatible.'); return; }
  const closed=cmds.some(c=>c[0]==='Z');
  const pts=cmds.filter(c=>c[0]==='M'||c[0]==='L').map(c=>[c[1],c[2]]);
  if(pts.length<3){showHint('Se necesitan al menos 3 puntos');return;}
  snapshot();
  const P=i=>pts[closed?((i%pts.length)+pts.length)%pts.length:clamp(i,0,pts.length-1)];
  let d=`M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
  const n=closed?pts.length:pts.length-1;
  for(let i=0;i<n;i++){
    const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C${fmt(c1[0])} ${fmt(c1[1])} ${fmt(c2[0])} ${fmt(c2[1])} ${fmt(p2[0])} ${fmt(p2[1])}`;
  }
  if(closed)d+=' Z';
  l.attrs.d=d;
  if(S.nodeEdit&&S.nodeEdit.id===l.id) S.nodeEdit.subs=nodesFromD(d);
  refresh();
}

/* ---------------- Edición de nodos Bézier (estilo Illustrator) ---------------- */
const bz=(a,b,c,d,t)=>{const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d;};
function nodesFromD(d){
  const cmds=parseD(d);
  const subs=[]; let cur=null;
  for(const c of cmds){
    if(c[0]==='M'){ cur={nodes:[{x:c[1],y:c[2],hin:null,hout:null,smooth:false}],closed:false}; subs.push(cur); }
    else if(!cur) continue;
    else if(c[0]==='L') cur.nodes.push({x:c[1],y:c[2],hin:null,hout:null,smooth:false});
    else if(c[0]==='C'){
      const prev=cur.nodes[cur.nodes.length-1];
      prev.hout={x:c[1],y:c[2]};
      cur.nodes.push({x:c[5],y:c[6],hin:{x:c[3],y:c[4]},hout:null,smooth:false});
    }
    else if(c[0]==='Q'){
      const prev=cur.nodes[cur.nodes.length-1];
      prev.hout={x:prev.x+2/3*(c[1]-prev.x), y:prev.y+2/3*(c[2]-prev.y)};
      cur.nodes.push({x:c[3],y:c[4],hin:{x:c[3]+2/3*(c[1]-c[3]),y:c[4]+2/3*(c[2]-c[4])},hout:null,smooth:false});
    }
    else if(c[0]==='Z'){
      cur.closed=true;
      const ns=cur.nodes;
      if(ns.length>1){
        const f=ns[0], lt=ns[ns.length-1];
        if(Math.hypot(f.x-lt.x,f.y-lt.y)<0.5){ if(lt.hin)f.hin=lt.hin; ns.pop(); }
      }
      cur=null;
    }
  }
  for(const sub of subs) for(const n of sub.nodes){
    if(n.hin&&n.hout){
      const a1=Math.atan2(n.y-n.hin.y,n.x-n.hin.x), a2=Math.atan2(n.hout.y-n.y,n.hout.x-n.x);
      let dd=Math.abs(a1-a2); if(dd>Math.PI)dd=2*Math.PI-dd;
      n.smooth=dd<0.06;
    }
  }
  return subs;
}
function subToD(sub){
  const ns=sub.nodes; if(!ns.length)return '';
  let d=`M${fmt(ns[0].x)} ${fmt(ns[0].y)}`;
  const segs=sub.closed?ns.length:ns.length-1;
  for(let i=0;i<segs;i++){
    const a=ns[i], b=ns[(i+1)%ns.length];
    if(!a.hout&&!b.hin) d+=` L${fmt(b.x)} ${fmt(b.y)}`;
    else{
      const c1=a.hout||a, c2=b.hin||b;
      d+=` C${fmt(c1.x)} ${fmt(c1.y)} ${fmt(c2.x)} ${fmt(c2.y)} ${fmt(b.x)} ${fmt(b.y)}`;
    }
  }
  if(sub.closed)d+=' Z';
  return d;
}
const subsToD=subs=>subs.map(subToD).join(' ');
function neMatrix(){
  const ne=S.nodeEdit;
  if(!ne) return new DOMMatrix();
  if(ne.routeId) return new DOMMatrix();
  const l=getLayer(ne.id);
  return l?layerMatrix(l,S.T):new DOMMatrix();
}
function commitNodes(){
  const ne=S.nodeEdit; if(!ne)return;
  const d=subsToD(ne.subs);
  if(ne.routeId){
    const r=getRoute(ne.routeId); if(!r)return;
    r.d=d;
    for(const o of doc.layers) if(o.motion&&o.motion.srcId===r.id) o.motion.d=d;
    applyFrame(S.T); return;
  }
  const l=getLayer(ne.id); if(!l)return;
  l.attrs.d=d;
  if(keysOf(l.id,'geom')) setKeyAt(l,'geom',S.T,{tp:l.type,at:JSON.parse(JSON.stringify(l.attrs))});
  for(const o of doc.layers) if(o.motion&&o.motion.srcId===l.id) o.motion.d=d;
  render();
}
function convertToPath(){
  const l=selLayer();
  if(!l){showHint('Selecciona una forma');return null;}
  if(l.type==='path')return l;
  if(!['rect','ellipse','polygon','line'].includes(l.type)){showHint('Este tipo de capa no puede convertirse en trazado');return null;}
  if(keysOf(l.id,'geom')&&!confirm('Esta forma tiene geometría animada; al convertirla a trazado se descartan esas claves. ¿Continuar?'))return null;
  snapshot();
  if(anims[l.id]) delete anims[l.id].geom;
  const a=l.attrs;
  const cmds=l.type==='line'?[['M',a.x1,a.y1],['L',a.x2,a.y2]]:shapeToD(l);
  const fill=l.type==='line'?'none':(a.fill!==undefined?a.fill:'#7c5cff');
  const stroke=l.type==='line'?(a.stroke||'#fff'):(a.stroke||'');
  l.type='path';
  l.attrs={d:dToStr(cmds), fill, stroke, sw:a.sw||1};
  refresh();
  showHint('Forma convertida a trazado editable por nodos');
  return l;
}
function enterNodeEdit(l){
  if(!l)return;
  if(l.type!=='path'){
    selectOnly(l.id);
    l=convertToPath();
    if(!l)return;
  }
  try{ S.nodeEdit={id:l.id, subs:nodesFromD(l.attrs.d), sel:null}; }
  catch(e){ alert('Este trazado contiene comandos no compatibles con la edición de nodos (arcos o coordenadas relativas).'); S.nodeEdit=null; return; }
  selectOnly(l.id);
  refreshPanels(); drawOverlay();
}
function toggleNodeSmooth(si,ni){
  const ne=S.nodeEdit; if(!ne)return;
  snapshot();
  const sub=ne.subs[si], n=sub.nodes[ni];
  if(n.hin||n.hout){ n.hin=null; n.hout=null; n.smooth=false; }
  else{
    const N=sub.nodes.length;
    const prev=sub.nodes[(ni-1+N)%N], next=sub.nodes[(ni+1)%N];
    let vx=next.x-prev.x, vy=next.y-prev.y;
    const dd=Math.hypot(vx,vy)||1; vx/=dd; vy/=dd;
    const len=(Math.min(Math.hypot(next.x-n.x,next.y-n.y),Math.hypot(prev.x-n.x,prev.y-n.y))/3)||20;
    n.hin={x:n.x-vx*len,y:n.y-vy*len};
    n.hout={x:n.x+vx*len,y:n.y+vy*len};
    n.smooth=true;
  }
  commitNodes(); refreshPanels();
}
function insertNodeAt(pt){
  const ne=S.nodeEdit; if(!ne)return;
  const q=neMatrix().inverse().transformPoint(new DOMPoint(pt.x,pt.y));
  let best=null;
  ne.subs.forEach((sub,si)=>{
    const segs=sub.closed?sub.nodes.length:sub.nodes.length-1;
    for(let i=0;i<segs;i++){
      const a=sub.nodes[i], b=sub.nodes[(i+1)%sub.nodes.length];
      const p0=a,p1=a.hout||a,p2=b.hin||b,p3=b;
      for(let t=0.02;t<1;t+=0.02){
        const x=bz(p0.x,p1.x,p2.x,p3.x,t), y=bz(p0.y,p1.y,p2.y,p3.y,t);
        const d2=(x-q.x)*(x-q.x)+(y-q.y)*(y-q.y);
        if(!best||d2<best.d2) best={d2,si,i,t};
      }
    }
  });
  if(!best||Math.sqrt(best.d2)>10/S.zoom){ showHint('Haz doble clic más cerca del trazado para insertar un nodo'); return; }
  snapshot();
  const sub=ne.subs[best.si];
  const a=sub.nodes[best.i], b=sub.nodes[(best.i+1)%sub.nodes.length];
  const t=best.t;
  const straight=!a.hout&&!b.hin;
  const p0=a,p1=a.hout||a,p2=b.hin||b,p3=b;
  const mixP=(u,v)=>({x:lerp(u.x,v.x,t),y:lerp(u.y,v.y,t)});
  const p01=mixP(p0,p1),p12=mixP(p1,p2),p23=mixP(p2,p3);
  const p012=mixP(p01,p12),p123=mixP(p12,p23),pm=mixP(p012,p123);
  const nn=straight?{x:pm.x,y:pm.y,hin:null,hout:null,smooth:false}
    :{x:pm.x,y:pm.y,hin:p012,hout:p123,smooth:true};
  if(!straight){ if(a.hout)a.hout=p01; if(b.hin)b.hin=p23; }
  sub.nodes.splice(best.i+1,0,nn);
  ne.sel={si:best.si,ni:best.i+1};
  commitNodes(); refreshPanels();
}
function deleteSelNode(){
  const ne=S.nodeEdit; if(!ne||!ne.sel)return;
  const sub=ne.subs[ne.sel.si];
  if(sub.nodes.length<=2){ showHint('Un trazado necesita al menos 2 nodos'); return; }
  snapshot();
  sub.nodes.splice(ne.sel.ni,1);
  ne.sel=null;
  commitNodes(); refreshPanels();
}
function drawNodeOverlay(ov){
  const ne=S.nodeEdit; if(!ne)return;
  if(!ne.routeId && !getLayer(ne.id))return;
  const m=neMatrix();
  const W=p=>m.transformPoint(new DOMPoint(p.x,p.y));
  const hs=7/S.zoom, hr=3.5/S.zoom;
  let hnd='', anc='';
  ne.subs.forEach((sub,si)=>{
    sub.nodes.forEach((n,ni)=>{
      const P=W(n);
      for(const w of ['hin','hout']){
        if(n[w]){
          const H=W(n[w]);
          hnd+=`<line x1="${P.x}" y1="${P.y}" x2="${H.x}" y2="${H.y}" stroke="#00c2a8" stroke-width="${1/S.zoom}" style="pointer-events:none"/>`
            +`<circle data-nh="${si}:${ni}:${w}" cx="${H.x}" cy="${H.y}" r="${hr}" fill="#00c2a8" stroke="#fff" stroke-width="${0.8/S.zoom}" style="cursor:move"/>`;
        }
      }
      const sel=ne.sel&&ne.sel.si===si&&ne.sel.ni===ni;
      anc+=`<rect data-nd="${si}:${ni}" x="${P.x-hs/2}" y="${P.y-hs/2}" width="${hs}" height="${hs}" fill="${sel?'#7c5cff':'#fff'}" stroke="#7c5cff" stroke-width="${1/S.zoom}" style="cursor:move"${n.smooth?' rx="'+hs/2+'"':''}/>`;
    });
  });
  ov.innerHTML+=hnd+anc;
}

/* ---------------- Morphing de geometría ---------------- */
function geomSnap(l){ return {tp:l.type, at:JSON.parse(JSON.stringify(l.attrs))}; }
function keyGeom(l){ if(keysOf(l.id,'geom')) setKeyAt(l,'geom',S.T,geomSnap(l)); }
function geomAt(l,T){
  const ks=keysOf(l.id,'geom');
  if(!ks||!ks.length) return geomSnap(l);
  if(T<=ks[0].t) return ks[0].v;
  if(T>=ks[ks.length-1].t) return ks[ks.length-1].v;
  for(let i=0;i<ks.length-1;i++){
    const a=ks[i],b=ks[i+1];
    if(T>=a.t&&T<=b.t) return geomLerp(a.v,b.v,easeF(a.ease)((T-a.t)/((b.t-a.t)||1e-9)));
  }
  return geomSnap(l);
}
function lerpAttrs(A,B,t){
  const out={};
  for(const k of new Set([...Object.keys(A),...Object.keys(B)])){
    const a=A[k],b=B[k];
    if(typeof a==='number'&&typeof b==='number') out[k]=lerp(a,b,t);
    else if(hexRgb(a)&&hexRgb(b)) out[k]=mixVal(a,b,t);
    else out[k]= t<0.999? (a!==undefined?a:b) : (b!==undefined?b:a);
  }
  if(out.sides!==undefined) out.sides=Math.round(out.sides);
  return out;
}
function geomToD(g){
  if(g.tp==='path') return g.at.d;
  if(g.tp==='line') return `M${fmt(g.at.x1)} ${fmt(g.at.y1)} L${fmt(g.at.x2)} ${fmt(g.at.y2)}`;
  try{ const c=shapeToD({type:g.tp,attrs:g.at}); return c?dToStr(c):''; }catch(e){ return ''; }
}
const GEOM_K=60, rsCache=new Map();
function resamplePts(d){
  try{
    const pc=pathEl(d), pts=[];
    for(let i=0;i<GEOM_K;i++){ const p=pc.el.getPointAtLength(pc.len*i/(GEOM_K-1)); pts.push([p.x,p.y]); }
    return pts;
  }catch(e){ return null; }
}
function rsPair(d1,d2){
  const k=d1+'|'+d2;
  if(!rsCache.has(k)){ if(rsCache.size>60)rsCache.clear(); rsCache.set(k,[resamplePts(d1),resamplePts(d2)]); }
  return rsCache.get(k);
}
function sameSig(d1,d2){
  try{
    const a=parseD(d1),b=parseD(d2);
    return a.length===b.length && a.every((c,i)=>c[0]===b[i][0]&&c.length===b[i].length);
  }catch(e){ return false; }
}
function lerpD(d1,d2,t){
  const a=parseD(d1),b=parseD(d2);
  return dToStr(a.map((c,i)=>c.map((v,j)=>j===0?v:lerp(v,b[i][j],t))));
}
function geomLerp(A,B,t){
  if(t<=0)return A; if(t>=1)return B;
  if(A.tp===B.tp&&A.tp!=='path'&&A.tp!=='raw'){
    if(A.tp==='text'){
      const at=lerpAttrs(A.at,B.at,t);
      if(A.at.text!==B.at.text){
        const a=String(A.at.text||''), b=String(B.at.text||'');
        at.text = t<0.5 ? a.slice(0,Math.round(a.length*(1-2*t))) : b.slice(0,Math.round(b.length*(2*t-1)));
        if(!at.text)at.text=' ';
      }
      return {tp:'text',at};
    }
    return {tp:A.tp, at:lerpAttrs(A.at,B.at,t)};
  }
  const d1=geomToD(A), d2=geomToD(B);
  if(!d1||!d2) return t<0.5?A:B;
  let d;
  if(sameSig(d1,d2)) d=lerpD(d1,d2,t);
  else{
    const [P1,P2]=rsPair(d1,d2);
    if(!P1||!P2) return t<0.5?A:B;
    const pts=P1.map((p,i)=>[lerp(p[0],P2[i][0],t),lerp(p[1],P2[i][1],t)]);
    const closed=/z\s*$/i.test(d1)||/z\s*$/i.test(d2);
    d=smoothPtsToD(pts)+(closed?' Z':'');
  }
  const at=lerpAttrs({fill:A.at.fill,stroke:A.at.stroke,sw:A.at.sw||1},{fill:B.at.fill,stroke:B.at.stroke,sw:B.at.sw||1},t);
  at.d=d;
  return {tp:'path',at};
}

/* ---------------- Escenas y transiciones ---------------- */
function sceneStart(i){ let t=0; for(let j=0;j<i;j++) t+=doc.scenes[j].dur; return t; }
function computeDocDur(){
  if(doc.scenes.length) doc.dur=Math.max(0.1,+doc.scenes.reduce((s,x)=>s+x.dur,0).toFixed(3));
  const di=$('#docDur'); if(di){ di.value=doc.dur; di.disabled=doc.scenes.length>0; }
}
function activeSceneAt(T){
  for(let i=0;i<doc.scenes.length;i++){ const st=sceneStart(i); if(T>=st&&T<st+doc.scenes[i].dur) return doc.scenes[i].id; }
  return null;
}
function transFactor(kind,q,dirIn){
  const f={op:1,tx:0,ty:0,sc:1,hidden:false};
  const p=EASE.easeInOut(clamp(q,0,1));
  switch(kind){
    case 'fade': f.op=dirIn?p:1-p; break;
    case 'push-l': f.tx=dirIn?(1-p)*doc.w:-p*doc.w; break;
    case 'push-r': f.tx=dirIn?-(1-p)*doc.w:p*doc.w; break;
    case 'push-u': f.ty=dirIn?(1-p)*doc.h:-p*doc.h; break;
    case 'push-d': f.ty=dirIn?-(1-p)*doc.h:p*doc.h; break;
    case 'zoom': f.sc=Math.max(0.001,dirIn?p:1-p); f.op=dirIn?p:1-p; break;
  }
  return f;
}
function sceneFactorAt(l,T){
  const none={op:1,tx:0,ty:0,sc:1,hidden:false};
  if(!doc.scenes.length||!l.scene) return none;
  const i=doc.scenes.findIndex(s=>s.id===l.scene);
  if(i<0) return none;
  const s=doc.scenes[i], st=sceneStart(i), en=st+s.dur;
  const tdIn=(s.trans&&s.trans!=='cut')?Math.min(s.tdur||0,s.dur):0;
  const nx=doc.scenes[i+1];
  const tdOut=(nx&&nx.trans&&nx.trans!=='cut')?Math.min(nx.tdur||0,nx.dur):0;
  if(T<st-1e-9||T>=en+tdOut-1e-9) return {...none,hidden:true};
  if(tdIn>0&&T<st+tdIn) return transFactor(s.trans,(T-st)/tdIn,true);
  if(T>=en&&tdOut>0) return transFactor(nx.trans,(T-en)/tdOut,false);
  if(T>=en) return {...none,hidden:true};
  return none;
}
function addScene(){
  snapshot();
  const first=!doc.scenes.length;
  const s={id:'sc'+Math.random().toString(36).slice(2,8), name:'Escena '+(doc.scenes.length+1),
    dur:first?doc.dur:2, trans:first?'cut':'fade', tdur:0.5};
  doc.scenes.push(s);
  if(first) for(const l of doc.layers) l.scene=s.id;
  computeDocDur();
  refresh();
}
const TRANS_NAMES={cut:'Corte',fade:'Fundido','push-l':'Empuje ←','push-r':'Empuje →','push-u':'Empuje ↑','push-d':'Empuje ↓',zoom:'Zoom'};
function renderScenesPanel(){
  const el=$('#scenesList'); if(!el)return;

  const act=activeSceneAt(S.T);

      <span class="sname" style="flex:1;font-weight:600" title="Clic: ir a su inicio · doble clic: renombrar">${esc(s.name)}</span>
      <span style="color:var(--txt2)" title="Capas en la escena">${nLayers}▢</span>
      <button class="mini" data-a="assign" title="Asignar la selección a esta escena">➤</button>
      <button class="mini" data-a="del" title="Eliminar escena (sus capas pasan a globales)">🗑</button></div>
      <div class="prow2"><label>Dur.</label><input type="number" data-a="dur" min="0.1" step="0.1" value="${s.dur}">
      <select data-a="trans" title="Transición de entrada">${Object.entries(TRANS_NAMES).map(([k,v])=>`<option value="${k}"${s.trans===k?' selected':''}>${v}</option>`).join('')}</select>
      <input type="number" data-a="tdur" min="0" step="0.1" value="${s.tdur}" title="Duración de la transición"></div>`;
    d.onclick=e=>{

      if(a==='del'){ snapshot(); doc.layers.forEach(l=>{if(l.scene===s.id)l.scene=null;}); doc.scenes.splice(i,1); computeDocDur(); refresh(); return; }
      if(a||e.target.closest('input,select'))return;

    d.querySelector('[data-a=trans]').onchange=e=>{ snapshot(); s.trans=e.target.value; applyFrame(S.T); };
    d.querySelector('[data-a=tdur]').onchange=e=>{ snapshot(); s.tdur=Math.max(0,+e.target.value||0); applyFrame(S.T); };
    d.ondblclick=e=>{

}

/* ---------------- Efectos de vídeo (presets) ---------------- */
const FX={fadein:'Aparecer (fundido)',fadeout:'Desaparecer (fundido)',toblack:'Fundir a oscuro',fromblack:'Fundir desde oscuro',
  zoomin:'Acercar (entrada)',zoomout:'Alejar (salida)',
  'in-l':'Entrar desde la izquierda','in-r':'Entrar desde la derecha','in-u':'Entrar desde arriba','in-d':'Entrar desde abajo',
  'out-l':'Salir hacia la izquierda','out-r':'Salir hacia la derecha','out-u':'Salir hacia arriba','out-d':'Salir hacia abajo',
  spin:'Entrada girando',pulse:'Pulso',blink:'Parpadeo'};
function applyEffect(kind,fdur){
  const ls=selLayers(); if(!ls.length){showHint('Selecciona uno o más objetos');return;}
  snapshot();
  const t0=S.T, t1=Math.min(doc.dur,t0+fdur);
  for(const l of ls){
    const p=effProps(l,t0);
    const K=(prop,va,vb,ease)=>{ setKeyAt(l,prop,t0,va,ease||'linear'); setKeyAt(l,prop,t1,vb); };
    switch(kind){
      case 'fadein': K('opacity',0,p.opacity,'easeOut'); break;
      case 'fadeout': K('opacity',p.opacity,0,'easeIn'); break;
      case 'toblack': K('fill',valAt(l,'fill',t0),'#000000'); break;
      case 'fromblack': K('fill','#000000',valAt(l,'fill',t0)); break;
      case 'zoomin': K('sx',0.001,p.sx,'easeOut'); K('sy',0.001,p.sy,'easeOut'); K('opacity',0,p.opacity,'easeOut'); break;
      case 'zoomout': K('sx',p.sx,0.001,'easeIn'); K('sy',p.sy,0.001,'easeIn'); K('opacity',p.opacity,0,'easeIn'); break;
      case 'in-l': K('tx',p.tx-doc.w,p.tx,'easeOut'); break;
      case 'in-r': K('tx',p.tx+doc.w,p.tx,'easeOut'); break;
      case 'in-u': K('ty',p.ty-doc.h,p.ty,'easeOut'); break;
      case 'in-d': K('ty',p.ty+doc.h,p.ty,'easeOut'); break;
      case 'out-l': K('tx',p.tx,p.tx-doc.w,'easeIn'); break;
      case 'out-r': K('tx',p.tx,p.tx+doc.w,'easeIn'); break;
      case 'out-u': K('ty',p.ty,p.ty-doc.h,'easeIn'); break;
      case 'out-d': K('ty',p.ty,p.ty+doc.h,'easeIn'); break;
      case 'spin': K('rot',p.rot-360,p.rot,'easeOut'); K('opacity',0,p.opacity,'easeOut'); break;
      case 'pulse':
        for(const pr of ['sx','sy']){ setKeyAt(l,pr,t0,p[pr],'easeInOut'); setKeyAt(l,pr,(t0+t1)/2,p[pr]*1.2,'easeInOut'); setKeyAt(l,pr,t1,p[pr]); }
        break;
      case 'blink': for(let i=0;i<5;i++) setKeyAt(l,'opacity',t0+(t1-t0)*i/4, i%2?0:p.opacity,'step'); break;
    }
  }
  refreshPanels(); applyFrame(S.T);
  showHint(`Efecto "${FX[kind]}" aplicado desde ${t0.toFixed(2)}s`);
}
/* ---------------- Papel cebolla ---------------- */
function ghostLayerStr(l,T2){
  const sf=sceneFactorAt(l,T2);
  if(sf.hidden||!l.visible) return '';
  const gm=keysOf(l.id,'geom')?geomAt(l,T2):null;
  const mk=gm?layerMarkup({type:gm.tp,attrs:gm.at,raw:l.raw}):layerMarkup(l);
  const p=effProps(l,T2); const [cx,cy]=ctr(l);
  let tr='';
  if(sf.tx||sf.ty) tr+=`translate(${fmt(sf.tx)} ${fmt(sf.ty)}) `;
  if(sf.sc!==1) tr+=`translate(${fmt(doc.w/2)} ${fmt(doc.h/2)}) scale(${fmt(sf.sc)}) translate(${fmt(-doc.w/2)} ${fmt(-doc.h/2)}) `;
  const m=motionAt(l,T2);
  if(m) tr+=`translate(${fmt(m.x-cx)} ${fmt(m.y-cy)})${m.ang?` rotate(${fmt(m.ang)} ${fmt(cx)} ${fmt(cy)})`:''} `;
  tr+=transformStr(p,cx,cy);
  return `<g transform="${tr.trim()}">${mk}</g>`;
}
function renderOnion(T){
  const og=$('#onionG'); if(!og)return;
  if(!S.onion||S.playing){ if(og.innerHTML)og.innerHTML=''; return; }
  let h='';
  for(const [off,op] of [[-0.24,0.12],[-0.12,0.25],[0.12,0.25],[0.24,0.12]]){
    const T2=T+off;
    if(T2<0||T2>doc.dur)continue;
    let inner='';
    for(const l of doc.layers) if(anims[l.id]&&Object.keys(anims[l.id]).length) inner+=ghostLayerStr(l,T2);
    if(inner) h+=`<g opacity="${op}" filter="url(#${off<0?'onionR':'onionG'})">${inner}</g>`;
  }
  og.innerHTML=h;
}

/* ---------------- Guardar, autoguardado y copia de seguridad ---------------- */
let fileHandle=null, autoTimer=null;
function projectJSON(){ return JSON.stringify({app:'VectorMotion',version:3,doc,anims},null,1); }
async function saveNow(pick){
  const data=projectJSON();
  try{
    if(window.showSaveFilePicker&&(pick||fileHandle)){
      if(!fileHandle||pick){
        fileHandle=await showSaveFilePicker({suggestedName:'proyecto.vectormotion.json',
          types:[{description:'Proyecto VectorMotion',accept:{'application/json':['.json']}}]});
      }
      const w=await fileHandle.createWritable();
      await w.write(data); await w.close();
      showHint('Proyecto guardado en '+fileHandle.name);
    } else {
      download('proyecto.vectormotion.json',data,'application/json');
    }
    backupNow();
  }catch(e){ if(e&&e.name!=='AbortError') alert('No se pudo guardar: '+e.message); }
}
function backupNow(){
  try{ localStorage.setItem('vm_backup',projectJSON()); localStorage.setItem('vm_backup_date',new Date().toISOString()); }catch(e){}
}
$('#btnSave').onclick=()=>saveNow(!fileHandle);
$('#autoSel').onchange=e=>{
  const s=+e.target.value;
  if(autoTimer)clearInterval(autoTimer);
  autoTimer=null;
  if(s>0) autoTimer=setInterval(()=>{ if(fileHandle)saveNow(false); else backupNow(); },s*1000);
  try{ localStorage.setItem('vm_auto',String(s)); }catch(e){}
  showHint(s?`Autoguardado cada ${s<60?s+' s':(s/60)+' min'} (+ copia en el navegador)`:'Autoguardado desactivado');
};
function loadProjectData(s){
  doc=s.doc; anims=s.anims||{};

}
function tryRestoreBackup(){
  try{
    if(doc.layers.length)return;
    const b=localStorage.getItem('vm_backup');
    if(!b)return;
    const s=JSON.parse(b);
    if(!s.doc||!s.doc.layers||!s.doc.layers.length)return;

/* ---- Origen de reglas arrastrables (estilo Photoshop/Illustrator) ---- */
(()=>{
  const corner=$('#rulerCorner');
  const guideH=$('#rulerOriginH');
  const guideV=$('#rulerOriginV');
  let dragging=false;

  function showGuides(screenX, screenY){
    // screenX, screenY son posiciones relativas al área (ya sin las 22px de regla)
    guideH.style.top=(screenY+22)+'px';
    guideV.style.left=(screenX+22)+'px';
    guideH.style.display='block';
    guideV.style.display='block';
  }
  function hideGuides(){
    guideH.style.display='none';
    guideV.style.display='none';
  }

  corner.addEventListener('pointerdown', e=>{
    e.preventDefault();
    dragging=true;
    corner.setPointerCapture(e.pointerId);
    corner.style.cursor='crosshair';
    // Mostrar guías desde la posición inicial (esquina)
    showGuides(0, 0);
  });

  corner.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const r=area.getBoundingClientRect();
    // Posición del cursor relativa al área del lienzo (sin las 22px de regla)
    const px=e.clientX - r.left - 22;
    const py=e.clientY - r.top - 22;
    showGuides(px, py);
    // Convertir posición de pantalla a coordenadas del lienzo: donde el cursor apunta
    // El origen nuevo = posición canvas del cursor = (px - S.panX + 22) / S.zoom
    // Pero queremos que la regla muestre 0 en ese punto, así que:
    // valor_en_regla = (coord_canvas) - rulerOX = 0  →  rulerOX = coord_canvas
    S.rulerOX = (px - S.panX + 22) / S.zoom;
    S.rulerOY = (py - S.panY + 22) / S.zoom;
    drawRulers();
  });

  corner.addEventListener('pointerup', e=>{
    if(!dragging) return;
    dragging=false;
    corner.style.cursor='';
    hideGuides();
    drawRulers();
  });

  corner.addEventListener('dblclick', ()=>{
    S.rulerOX=0; S.rulerOY=0;
    drawRulers();
    showHint('Origen de reglas restablecido a (0, 0)');
  });
})();

/* ---------------- Rutas de animación (biblioteca) ---------------- */
function getRoute(id){ return doc.routes.find(r=>r.id===id); }
function routeUsers(id){ return doc.layers.filter(l=>l.motion&&l.motion.srcId===id); }
function addRoute(d,name){
  const r={id:'rt'+Math.random().toString(36).slice(2,8), name:name||('Ruta '+(doc.routes.length+1)), d};
  doc.routes.push(r);
  return r;
}
function assignRoute(r,layers){
  const ls=layers&&layers.length?layers:selLayers();
  if(!ls.length){ showHint('Selecciona uno o más objetos para asignarles la ruta'); return; }
  for(const l of ls){
    l.motion={srcId:r.id, d:r.d, orient:true};
    if(!keysOf(l.id,'mp')){ setKeyAt(l,'mp',0,0); setKeyAt(l,'mp',doc.dur,100); }
  }
  refreshPanels(); applyFrame(S.T);
  showHint(`Ruta "${r.name}" asignada a ${ls.length} objeto(s)`);
}
function routeAnchor(){
  const l=selLayer();
  if(l&&l._bb){ const m=layerMatrix(l,S.T).transformPoint(new DOMPoint(l._cx,l._cy)); return [m.x,m.y]; }
  return [doc.w/2,doc.h/2];
}
function presetRoute(kind){
  const [cx,cy]=routeAnchor();
  const R=Math.min(doc.w,doc.h)*0.28, f=fmt;
  const P={
    lr:`M${f(cx)} ${f(cy)} L${f(cx+R*1.6)} ${f(cy)}`,
    rl:`M${f(cx)} ${f(cy)} L${f(cx-R*1.6)} ${f(cy)}`,
    ud:`M${f(cx)} ${f(cy)} L${f(cx)} ${f(cy+R*1.4)}`,
    du:`M${f(cx)} ${f(cy)} L${f(cx)} ${f(cy-R*1.4)}`,
    diag:`M${f(cx)} ${f(cy)} L${f(cx+R*1.4)} ${f(cy+R*1.1)}`,
    circle:`M${f(cx+R)} ${f(cy)} A${f(R)} ${f(R)} 0 1 1 ${f(cx-R)} ${f(cy)} A${f(R)} ${f(R)} 0 1 1 ${f(cx+R)} ${f(cy)}`,
    square:`M${f(cx-R)} ${f(cy-R)} L${f(cx+R)} ${f(cy-R)} L${f(cx+R)} ${f(cy+R)} L${f(cx-R)} ${f(cy+R)} Z`,
    eight:`M${f(cx)} ${f(cy)} C${f(cx+R)} ${f(cy-R)} ${f(cx+R)} ${f(cy+R)} ${f(cx)} ${f(cy)} C${f(cx-R)} ${f(cy-R)} ${f(cx-R)} ${f(cy+R)} ${f(cx)} ${f(cy)}`,
    wave:`M${f(cx-R*1.5)} ${f(cy)} C${f(cx-R)} ${f(cy-R)} ${f(cx-R*0.5)} ${f(cy-R)} ${f(cx)} ${f(cy)} C${f(cx+R*0.5)} ${f(cy+R)} ${f(cx+R)} ${f(cy+R)} ${f(cx+R*1.5)} ${f(cy)}`,
    zigzag:`M${f(cx-R*1.5)} ${f(cy)} L${f(cx-R*0.75)} ${f(cy-R)} L${f(cx)} ${f(cy)} L${f(cx+R*0.75)} ${f(cy-R)} L${f(cx+R*1.5)} ${f(cy)}`,
    bounce:`M${f(cx-R*1.5)} ${f(cy)} Q${f(cx-R)} ${f(cy-R*1.6)} ${f(cx-R*0.5)} ${f(cy)} Q${f(cx-R*0.1)} ${f(cy-R*0.9)} ${f(cx+R*0.3)} ${f(cy)} Q${f(cx+R*0.6)} ${f(cy-R*0.45)} ${f(cx+R*0.9)} ${f(cy)} Q${f(cx+R*1.1)} ${f(cy-R*0.2)} ${f(cx+R*1.3)} ${f(cy)}`,
    spiral:(()=>{let d=`M${f(cx)} ${f(cy)}`;let a=0,rr=4;for(let i=0;i<40;i++){a+=0.45;rr+=R/28;d+=` L${f(cx+rr*Math.cos(a))} ${f(cy+rr*Math.sin(a))}`;}return d;})()
  }[kind];
  return P;
}
const ROUTE_NAMES={lr:'Línea →',rl:'Línea ←',ud:'Línea ↓',du:'Línea ↑',diag:'Diagonal',circle:'Círculo',square:'Cuadrado',eight:'Ocho',wave:'Onda',zigzag:'Zigzag',bounce:'Rebote',spiral:'Espiral'};

function simplifyPts(pts,tol){
  const out=[pts[0]];
  for(const p of pts){ const q=out[out.length-1]; if(Math.hypot(p[0]-q[0],p[1]-q[1])>tol) out.push(p); }
  if(out.length<2&&pts.length>1)out.push(pts[pts.length-1]);
  return out;
}
function smoothPtsToD(pts){
  if(pts.length<3) return 'M'+pts.map(p=>fmt(p[0])+' '+fmt(p[1])).join(' L');
  const P=i=>pts[clamp(i,0,pts.length-1)];
  let d=`M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    d+=` C${fmt(p1[0]+(p2[0]-p0[0])/6)} ${fmt(p1[1]+(p2[1]-p0[1])/6)} ${fmt(p2[0]-(p3[0]-p1[0])/6)} ${fmt(p2[1]-(p3[1]-p1[1])/6)} ${fmt(p2[0])} ${fmt(p2[1])}`;
  }
  return d;
}

/* ---------------- Voltear / Girar / Origen ---------------- */
function flipSel(axis){
  const ls=selLayers(); if(!ls.length)return;
  snapshot();
  for(const l of ls){
    const p=effProps(l,S.T);
    writeProp(l,axis==='h'?'sx':'sy',-(axis==='h'?p.sx:p.sy));
  }
  applyFrame(S.T); refreshPanels();
}
function rotateSel(deg){
  const ls=selLayers(); if(!ls.length)return;
  snapshot();
  for(const l of ls) writeProp(l,'rot',effProps(l,S.T).rot+deg);
  applyFrame(S.T); refreshPanels();
}
function centerOrigin(){
  const ls=selLayers(); if(!ls.length)return;
  snapshot();
  for(const l of ls) l.origin=null;
  applyFrame(S.T); refreshPanels();
  showHint('Origen restablecido al centro geométrico');
}
/* ---------------- Alineación ---------------- */
function alignSel(mode){
  const ls=selLayers().filter(l=>!l.locked); if(!ls.length){showHint('Selecciona capas para alinear');return;}
  snapshot();
  let ref;
  if(ls.length>1){
    const bs=ls.map(worldBBox);
    ref={x:Math.min(...bs.map(b=>b.x)), y:Math.min(...bs.map(b=>b.y))};
    ref.w=Math.max(...bs.map(b=>b.x+b.w))-ref.x;
    ref.h=Math.max(...bs.map(b=>b.y+b.h))-ref.y;
  } else ref={x:0,y:0,w:doc.w,h:doc.h};
  for(const l of ls){
    const b=worldBBox(l);
    const p=effProps(l,S.T);
    let dx=0,dy=0;
    if(mode==='l')dx=ref.x-b.x;
    if(mode==='c')dx=ref.x+ref.w/2-(b.x+b.w/2);
    if(mode==='r')dx=ref.x+ref.w-(b.x+b.w);
    if(mode==='t')dy=ref.y-b.y;
    if(mode==='m')dy=ref.y+ref.h/2-(b.y+b.h/2);
    if(mode==='b')dy=ref.y+ref.h-(b.y+b.h);
    if(dx)writeProp(l,'tx',p.tx+dx);
    if(dy)writeProp(l,'ty',p.ty+dy);
  }
  applyFrame(S.T); refreshPanels();
}

function selectLayer(id,additive){
  if(additive){
    if(S.selSet.has(id)&&S.sel!==id) S.selSet.delete(id);
    else { S.selSet.add(id); S.sel=id; }
    if(!S.selSet.size) S.sel=null;
    else if(!S.selSet.has(S.sel)) S.sel=[...S.selSet][0];
  } else selectOnly(id);
  S.selKf=null;
  paintLayerSelection();
  renderProps(); renderTimeline();
  drawOverlay();
}

  body.querySelectorAll('[data-attr]').forEach(inp=>{

  body.querySelectorAll('[data-battr]').forEach(cb=>{

  body.querySelectorAll('[data-cattr]').forEach(inp=>{
    inp.oninput=()=>{ editSnap(); l.attrs[inp.dataset.cattr]=inp.value; render(); };

    nostroke:()=>{ snapshot(); l.attrs.stroke=''; render(); renderProps(); },

    centerorg:centerOrigin, smooth:smoothSelection, nodes:()=>setTool('node'),

    italic:()=>{ snapshot(); l.attrs.fst=!l.attrs.fst; render(); renderProps(); },

  body.querySelectorAll('[data-a]').forEach(b=>{ b.onclick=()=>acts[b.dataset.a]&&acts[b.dataset.a](); });
  const ms=$('#motionSel');
  if(ms) ms.onchange=()=>{

      l.motion={srcId:src.id, d:rt?rt.d:src.attrs.d, orient:true};
